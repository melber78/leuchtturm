.bildk{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:8px}

<script>
/* ===== Aufgaben-Generatoren (Mathe, Geschichte) ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{const s=String(Math.abs(n));if(s.length<5)return (n<0?'−':'')+s;return (n<0?'−':'')+s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
const dez=n=>String(Math.round(n*1000)/1000).replace('.',',');
const mcNum=(q,c,wr,ex)=>({t:'m',q,a:[String(c),...wr.map(String)],ex});
function nearWrong(c,steps){const s=new Set();steps.forEach(d=>{if(c+d!==c&&c+d>=0)s.add(c+d)});return [...s].slice(0,3);}

const GEN={
 zahlen(){
  const k=R(0,4);
  if(k===0){const n=R(1000000,9999999);const names=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen'];const p=R(1,6);const d=String(n).split('').reverse()[p];
   return {t:'i',q:`Welche Ziffer steht in <b>${fmt(n)}</b> an der <b>${names[p]}</b>stelle?`,a:d,ex:`Von rechts gezählt: Einer, Zehner, Hunderter, Tausender, Zehntausender, Hunderttausender, Millionen. An der ${names[p]}stelle steht ${d}.`};}
  if(k===1){const n=R(1000000,9999999);const st=pick([[1000,'Tausender'],[10000,'Zehntausender'],[100000,'Hunderttausender']]);const r=Math.round(n/st[0])*st[0];
   return {t:'i',q:`Runde <b>${fmt(n)}</b> auf <b>${st[1]}</b>.`,a:String(r),ex:`Schau auf die Ziffer rechts neben der ${st[1]}stelle: 0–4 abrunden, 5–9 aufrunden. Ergebnis: ${fmt(r)}.`};}
  if(k===2){const base=pick([R(1,9)*1000000,R(10,99)*100000,R(100,999)*10000]);const nf=Math.random()<.5;const n=nf?base-1:base;const ans=nf?base:base-1;
   return {t:'i',q:`Wie heißt der <b>${nf?'Nachfolger':'Vorgänger'}</b> von <b>${fmt(n)}</b>?`,a:String(ans),ex:`${nf?'Nachfolger = Zahl + 1':'Vorgänger = Zahl − 1'}: ${fmt(ans)}.`};}
  if(k===3){const n=R(4,2999);const r=toRoman(n);if(Math.random()<.5)return {t:'i',q:`Schreibe als arabische Zahl: <b>${r}</b>`,a:String(n),ex:`I=1, V=5, X=10, L=50, C=100, D=500, M=1000. Steht ein kleineres Zeichen vor einem größeren, wird es abgezogen (IV = 4). ${r} = ${n}.`};
   return {t:'i',q:`Schreibe als römische Zahl: <b>${n}</b>`,a:r,ex:`${n} = ${r}. Tipp: Zerlege in Tausender, Hunderter, Zehner und Einer.`};}
  const d=String(R(1000000,9999999)).split('');const opts=new Set();while(opts.size<4){const c=[...d];const i=R(0,6),j=R(0,6);[c[i],c[j]]=[c[j],c[i]];if(c[0]!=='0')opts.add(Number(c.join('')));}
  const arr=[...opts].sort((a,b)=>b-a);const big=Math.random()<.5;const c=big?arr[0]:arr[3];
  return {t:'m',q:`Welche Zahl ist die <b>${big?'größte':'kleinste'}</b>?`,a:[fmt(c),...arr.filter(x=>x!==c).map(fmt)],ex:'Vergleiche von links nach rechts Stelle für Stelle. Die erste unterschiedliche Ziffer entscheidet.'};
 },
 rechnen(){
  const k=R(0,4);
  if(k===0){const a=R(10000,899999),b=R(1000,99999);return {t:'i',col:{a,b,op:'+'},q:`Rechne schriftlich: <b>${fmt(a)} + ${fmt(b)}</b>`,a:String(a+b),ex:`Schriftlich untereinander addieren, Überträge nicht vergessen. Ergebnis: ${fmt(a+b)}.`};}
  if(k===1){const a=R(20000,999999),b=R(1000,a-1000);return {t:'i',col:{a,b,op:'−'},q:`Rechne schriftlich: <b>${fmt(a)} − ${fmt(b)}</b>`,a:String(a-b),ex:`Schriftlich subtrahieren (Ergänzungsverfahren). Probe: ${fmt(a-b)} + ${fmt(b)} = ${fmt(a)}.`};}
  if(k===2){const a=R(102,989),b=R(12,89);return {t:'i',q:`Rechne schriftlich: <b>${a} · ${b}</b>`,a:String(a*b),ex:`${a} · ${Math.floor(b/10)*10} = ${fmt(a*Math.floor(b/10)*10)} und ${a} · ${b%10} = ${fmt(a*(b%10))}. Zusammen: ${fmt(a*b)}.`};}
  if(k===3){const d=R(3,9),q=R(112,1999);return {t:'i',q:`Rechne schriftlich: <b>${fmt(d*q)} : ${d}</b>`,a:String(q),ex:`Schriftlich dividieren. Probe: ${q} · ${d} = ${fmt(d*q)}.`};}

function gcd(a,b){return b?gcd(b,a%b):a}

{id:'de-zeichen',s:'de',title:'Zeichensetzung & wörtliche Rede',

{id:'de-texte',s:'de',title:'Märchen, Fabel, Sage & Erzählen',
 learn:[['Märchen','„Es war einmal …“, Ort und Zeit unbestimmt, Gut gegen Böse, Zauberei und Wunder, magische Zahlen (3, 7, 12), gutes Ende. Gesammelt u. a. von den Brüdern Grimm.'],['Fabel','Kurze Geschichte, Tiere handeln wie Menschen und haben typische Eigenschaften (Fuchs = listig, Löwe = mächtig). Am Ende eine Lehre (Moral). Berühmter Fabeldichter: Äsop.'],['Sage','Hat einen wahren Kern: echte Orte oder Personen, dazu Übernatürliches. Aus dem Harz: die Rosstrappe, der Hexentanzplatz.'],['Gut erzählen','<b>Einleitung</b>: Wer? Wo? Wann? · <b>Hauptteil</b>: Spannung steigt bis zum <b>Höhepunkt</b> · <b>Schluss</b>: Auflösung. Präteritum, wörtliche Rede, treffende Verben (statt „sagen“: flüstern, rufen, murmeln).']],
 cards:[['Typischer Märchenanfang','Es war einmal …'],['Magische Zahlen im Märchen','3, 7, 12'],['Fabel – Besonderheit','Tiere handeln wie Menschen, am Ende steht eine Lehre'],['Fuchs in der Fabel','listig, schlau'],['Sage – Besonderheit','wahrer Kern: echte Orte oder Personen'],['Aufbau einer Erzählung','Einleitung – Hauptteil mit Höhepunkt – Schluss'],['Zeitform beim Erzählen','Präteritum'],['Wortfeld „gehen“','schlendern, rennen, schleichen, stapfen …']],
 tasks:[['m','Woran erkennst du eine Fabel?',['Tiere handeln wie Menschen und es gibt eine Lehre.','Sie beginnt mit „Es war einmal“.','Sie spielt an einem echten Ort.','Sie wird immer in Reimen erzählt.'],'Typisch für die Fabel: Tiere mit menschlichen Eigenschaften und eine Moral.'],
 ['m','Welche Textsorte hat einen wahren Kern, z. B. einen echten Ort?',['Sage','Märchen','Fabel','Gedicht'],'Sagen verbinden Wirkliches mit Übernatürlichem.'],['m','Was gehört in die Einleitung einer Erzählung?',['Wer, wo und wann','der Höhepunkt','die Lehre','die Lösung des Problems'],'Die Einleitung stellt Figuren, Ort und Zeit vor.'],
 ['m','Welches Verb passt am besten? „Psst“, ___ Lena, „das Baby schläft.“',['flüsterte','brüllte','jubelte','stotterte'],'Bei „Psst“ und einem schlafenden Baby spricht man leise.'],['w','In Märchen sind Ort und Zeit meist genau angegeben.',false,'Märchen spielen „irgendwann, irgendwo“.'],['w','Die Spannung einer Erzählung ist im Höhepunkt am größten.',true,'Danach folgt die Auflösung im Schluss.']]},
{id:'de-lesen',s:'de',title:'Lesetraining: Der Fund im Steinbruch',
 text:`<p>Jonas verbrachte die Herbstferien bei seinem Opa Werner in einem kleinen Dorf im Harz. Am Mittwoch regnete es den ganzen Vormittag. Erst nach dem Mittagessen hörte es auf, und die beiden zogen ihre Gummistiefel an.</p><p>„Heute zeige ich dir den alten Steinbruch“, sagte Opa. „Dort habe ich als Junge jeden Nachmittag gesucht – meistens ohne Erfolg.“</p><p>Der Weg führte zuerst durch einen Fichtenwald und dann steil bergauf. Oben angekommen, war Jonas ziemlich außer Atem. Vor ihnen lag eine graue Wand aus Schiefer, von der der Regen viele kleine Bruchstücke gelöst hatte.</p><p>Jonas drehte einen flachen Stein nach dem anderen um. Nach einer halben Stunde wollte er schon aufgeben. Da entdeckte er auf einer Platte feine, geschwungene Linien, die aussahen wie die Rippen eines Fächers.</p><p>„Opa! Ist das ein Abdruck?“</p><p>Opa Werner setzte seine Lesebrille auf und pfiff leise durch die Zähne. „Das ist eine Muschel – und zwar eine, die vor etwa 380 Millionen Jahren gelebt hat. Damals war hier ein Meer.“</p><p>Jonas starrte ungläubig auf die Platte. Ein Meer, mitten im Harz?</p><p>Am Abend wickelte er seinen Fund vorsichtig in Zeitungspapier. Opa lächelte: „Siehst du, manchmal muss man nur lange genug suchen. Und manchmal braucht es den Regen dazu.“</p>`,
 learn:[['So liest du einen Sachtext oder eine Geschichte','1. Überschrift lesen und vermuten. 2. Text ganz lesen. 3. Fragen lesen. 4. Antworten im Text suchen – nicht raten! 5. Bei „Warum“-Fragen zwischen den Zeilen lesen.']],
 tasks:[['m','Wann machten sich Jonas und Opa auf den Weg?',['nach dem Mittagessen','am Vormittag','am Abend','am Donnerstag'],'„Erst nach dem Mittagessen hörte es auf, und die beiden zogen ihre Gummistiefel an.“'],
 ['m','Woraus bestand die Wand im Steinbruch?',['aus Schiefer','aus Kalkstein','aus Granit','aus Sandstein'],'„eine graue Wand aus Schiefer“'],
 ['m','Wie hatte der Regen beim Suchen geholfen?',['Er hatte Bruchstücke aus der Wand gelöst.','Er hatte andere Sammler ferngehalten.','Er hatte den Schiefer dunkler gefärbt.','Er hatte den Weg nach oben verkürzt.'],'„… von der der Regen viele kleine Bruchstücke gelöst hatte.“'],
 ['m','Wie alt ist die Muschel ungefähr?',['380 Millionen Jahre','38 Millionen Jahre','3 800 Jahre','380 000 Jahre'],'Opa sagt: „vor etwa 380 Millionen Jahren“.'],
 ['w','Opa hat als Junge im Steinbruch oft etwas gefunden.',false,'Er sagt: „meistens ohne Erfolg“.'],
 ['m','Warum staunte Jonas so sehr?',['Er konnte sich kaum vorstellen, dass im Harz einmal ein Meer war.','Er hatte noch nie eine Lesebrille gesehen.','Die Muschel war größer als seine Hand.','Opa hatte ihm nichts vom Steinbruch erzählt.'],'„Ein Meer, mitten im Harz?“ – Er ist ungläubig über das frühere Meer.'],
 ['m','Was zeigt das Verhalten von Opa, als er „leise durch die Zähne pfiff“?',['Er war beeindruckt.','Er war enttäuscht.','Er war ungeduldig.','Er war verärgert.'],'Ein leiser Pfiff drückt hier Staunen aus.'],
 ['m','Was meint Opa mit dem letzten Satz?',['Geduld lohnt sich – und manchmal hilft ein glücklicher Umstand.','Man sollte nur bei Regen nach Fossilien suchen.','Jonas soll beim nächsten Mal früher aufstehen.','Fossilien findet man nur mit Brille.'],'Jonas hat lange gesucht (Geduld), der Regen hat zufällig geholfen.'],
 ['m','In welcher Zeitform ist der Text geschrieben?',['Präteritum','Präsens','Perfekt','Futur I'],'verbrachte, regnete, zogen … – typische Erzählzeit.']]},

{id:'bio-leben',s:'bio',title:'Kennzeichen des Lebendigen',
 learn:[['Alle Lebewesen …','… haben einen <b>Stoffwechsel</b> (nehmen Stoffe auf, wandeln sie um, geben Stoffe ab) · zeigen <b>Bewegung</b> · sind <b>reizbar</b> (reagieren auf Reize) · <b>wachsen und entwickeln sich</b> · <b>pflanzen sich fort</b>.'],['Nur wenn alle Kennzeichen zutreffen','… ist etwas ein Lebewesen. Eine Kerzenflamme „bewegt sich“ und „wächst“ – sie pflanzt sich aber nicht fort und ist nicht reizbar.'],['Ordnen','Lebewesen ordnet man nach gemeinsamen Merkmalen, z. B. Wirbeltiere (mit Wirbelsäule) und Wirbellose.'],['Die Lupe','Lupe nah ans Auge, dann den Gegenstand heranführen, bis das Bild scharf ist.']],
 cards:[['5 Kennzeichen des Lebendigen','Stoffwechsel, Bewegung, Reizbarkeit, Wachstum/Entwicklung, Fortpflanzung'],['Stoffwechsel','Stoffe aufnehmen, umwandeln und abgeben'],['Reizbarkeit','auf Reize aus der Umwelt reagieren'],['Wirbeltiere','Tiere mit Wirbelsäule'],['Beispiel Reizbarkeit bei Pflanzen','Sonnenblume dreht sich zum Licht']],
 tasks:[['m','Welches Kennzeichen zeigt eine Sonnenblume, die sich zum Licht dreht?',['Reizbarkeit','Fortpflanzung','Stoffwechsel','Wachstum'],'Sie reagiert auf den Reiz Licht.'],['m','Warum ist eine Kerzenflamme kein Lebewesen?',['Sie pflanzt sich nicht fort und ist nicht reizbar.','Sie bewegt sich nicht.','Sie verbraucht keine Stoffe.','Sie wird nicht größer.'],'Es müssen alle Kennzeichen zutreffen.'],['m','Ein Hase frisst Möhren und scheidet Kot aus. Welches Kennzeichen ist gemeint?',['Stoffwechsel','Bewegung','Reizbarkeit','Entwicklung'],'Stoffe aufnehmen, umwandeln, abgeben = Stoffwechsel.'],['w','Pflanzen sind keine Lebewesen, weil sie sich nicht fortbewegen.',false,'Pflanzen bewegen sich (z. B. Blätter zum Licht) und zeigen alle Kennzeichen.'],['m','Aus der Kaulquappe wird ein Frosch. Welches Kennzeichen?',['Entwicklung','Fortpflanzung','Reizbarkeit','Stoffwechsel'],'Gestaltwandel während des Lebens = Entwicklung.']]},
{id:'bio-wirbeltiere',s:'bio',title:'Die fünf Wirbeltierklassen',
 learn:[['Fische','Schuppen, Kiemenatmung, wechselwarm, Eier (Laich) im Wasser, Flossen.'],['Lurche (Amphibien)','nackte, feuchte Schleimhaut · Larven (Kaulquappen) atmen mit Kiemen, erwachsene Tiere mit Lunge und Haut · wechselwarm · Laich im Wasser. Beispiele: Frosch, Kröte, Molch.'],['Kriechtiere (Reptilien)','trockene Hornschuppen · Lunge · wechselwarm · Eier mit lederartiger Schale an Land. Beispiele: Eidechse, Schlange, Schildkröte.'],['Vögel','Federn · Lunge mit Luftsäcken · gleichwarm · Eier mit Kalkschale.'],['Säugetiere','Haare/Fell · Lunge · gleichwarm · meist lebendgebärend · Junge werden gesäugt.'],['Wechselwarm – gleichwarm','<b>Wechselwarm</b>: Körpertemperatur hängt von der Umgebung ab (Winterstarre). <b>Gleichwarm</b>: konstante Körpertemperatur.']],
 cards:[['Körperbedeckung Fische','Schuppen'],['Körperbedeckung Lurche','nackte, feuchte Haut'],['Körperbedeckung Kriechtiere','Hornschuppen'],['Körperbedeckung Vögel','Federn'],['Körperbedeckung Säugetiere','Haare / Fell'],['gleichwarme Klassen','Vögel und Säugetiere'],['Atmung der Kaulquappe','Kiemen'],['Ist der Wal ein Fisch?','Nein – Säugetier (Lunge, säugt seine Jungen)'],['Ist die Blindschleiche eine Schlange?','Nein – eine beinlose Eidechse (Kriechtier)']],
 tasks:[['m','Zu welcher Klasse gehört der Wal?',['Säugetiere','Fische','Lurche','Kriechtiere'],'Wale atmen mit Lunge und säugen ihre Jungen.'],['m','Zu welcher Klasse gehört der Molch?',['Lurche','Kriechtiere','Fische','Säugetiere'],'Feuchte Haut, Larven im Wasser → Lurch.'],['m','Zu welcher Klasse gehört die Fledermaus?',['Säugetiere','Vögel','Kriechtiere','Lurche'],'Fell, säugt die Jungen – sie kann aber fliegen.'],['m','Zu welcher Klasse gehört der Pinguin?',['Vögel','Säugetiere','Fische','Lurche'],'Federn und Eier mit Kalkschale – nur flugunfähig.'],['m','Welche Tiere sind gleichwarm?',['Vögel und Säugetiere','Fische und Lurche','Kriechtiere und Vögel','Lurche und Säugetiere'],'Nur Vögel und Säugetiere halten ihre Körpertemperatur konstant.'],['m','Wie atmet ein erwachsener Frosch?',['mit Lunge und Haut','nur mit Kiemen','nur mit der Haut','mit Kiemen und Lunge'],'Erwachsene Lurche: Lunge + Hautatmung.'],['m','Welche Eier haben eine lederartige Schale?',['die der Kriechtiere','die der Vögel','die der Fische','die der Lurche'],'Vogeleier: Kalkschale. Kriechtiere: lederartig.'],['w','Kriechtiere fallen im Winter in eine Winterstarre, weil sie wechselwarm sind.',true,'Bei Kälte sinkt ihre Körpertemperatur.'],['w','Die Blindschleiche ist eine Schlange.',false,'Sie ist eine beinlose Eidechse.']]},
{id:'bio-anpassung',s:'bio',title:'Angepasstheit: Säuger, Vögel, Fische',
 learn:[['Fortbewegung der Säugetiere','<b>Sohlengänger</b>: ganze Fußsohle (Mensch, Bär) · <b>Zehengänger</b>: auf den Zehen (Hund, Katze) · <b>Zehenspitzengänger</b>: auf Hufen (Pferd, Rind)'],['Gebisse','<b>Fleischfresser</b> (Hund, Katze): Fangzähne, Reißzähne · <b>Pflanzenfresser</b> (Rind): breite Backenzähne, Wiederkäuer mit 4 Mägen: Pansen, Netzmagen, Blättermagen, Labmagen · <b>Allesfresser</b> (Schwein, Mensch)'],['Vögel – gebaut fürs Fliegen','Leichtbau: hohle Röhrenknochen, Luftsäcke, Hornschnabel statt Zähne · Federn: Schwung-, Deck-, Daunenfedern · Brustmuskeln sehr kräftig · Stromlinienform'],['Fische – gebaut fürs Wasser','Stromlinienform, Schleimschicht, Flossen zum Steuern, <b>Schwimmblase</b> zum Schweben, <b>Seitenlinienorgan</b> zum Spüren von Strömungen']],
 cards:[['Zehengänger','Hund, Katze'],['Sohlengänger','Mensch, Bär'],['Zehenspitzengänger','Pferd, Rind (Hufe)'],['Vier Mägen des Rindes','Pansen, Netzmagen, Blättermagen, Labmagen'],['Röhrenknochen beim Vogel','hohl → leicht'],['Daunenfedern','wärmen'],['Schwimmblase','Fisch kann im Wasser schweben'],['Seitenlinienorgan','spürt Wasserbewegungen'],['Vorfahr des Hundes','Wolf']],
 tasks:[['m','Wozu dient die Schwimmblase der Fische?',['zum Schweben in einer Wassertiefe','zum Atmen unter Wasser','zum Verdauen der Nahrung','zum Hören von Geräuschen'],'Mit der Schwimmblase gleicht der Fisch seinen Auftrieb aus.'],['m','Wie heißen die Zähne, mit denen der Hund Fleisch zerschneidet?',['Reißzähne','Fangzähne','Schneidezähne','Mahlzähne'],'Fangzähne halten fest, Reißzähne zerschneiden.'],['m','Welches Tier ist ein Zehengänger?',['Katze','Bär','Pferd','Rind'],'Katzen laufen auf den Zehen.'],['m','Welche Federn halten den Vogel warm?',['Daunenfedern','Schwungfedern','Deckfedern','Schwanzfedern'],'Daunen sind weich und isolieren.'],['m','Warum haben Vögel hohle Knochen?',['Sie sparen Gewicht.','Sie speichern dort Nahrung.','Sie wachsen dadurch schneller.','Sie können so besser hören.'],'Leichtbau erleichtert das Fliegen.'],['m','Welcher Magen gehört NICHT zum Rind?',['Kropf','Pansen','Blättermagen','Labmagen'],'Der Kropf gehört zu Vögeln.'],['w','Das Rind ist ein Wiederkäuer.',true,'Es würgt Nahrung aus dem Pansen hoch und kaut sie erneut.']]},
{id:'bio-skelett',s:'bio',title:'Skelett, Gelenke & Muskeln',
 learn:[['Aufgaben des Skeletts','stützen, schützen (Schädel → Gehirn, Brustkorb → Herz und Lunge), bewegen'],['Wirbelsäule','doppelt S-förmig – federt Stöße ab. Zwischen den Wirbeln liegen die <b>Bandscheiben</b>.'],['Gelenke','<b>Kugelgelenk</b>: Schulter, Hüfte (in alle Richtungen) · <b>Scharniergelenk</b>: Knie, Ellenbogen, Finger (in eine Richtung) · <b>Sattelgelenk</b>: Daumen · <b>Drehgelenk</b>: zwischen 1. und 2. Halswirbel'],['Gegenspielerprinzip','Muskeln können nur ziehen. Im Oberarm: <b>Bizeps</b> beugt, <b>Trizeps</b> streckt. Sie arbeiten als Gegenspieler.'],['Gesund bleiben','aufrecht sitzen, Schulranzen richtig tragen, Bewegung, Sport']],
 cards:[['Kugelgelenk','Schulter, Hüfte'],['Scharniergelenk','Knie, Ellenbogen, Finger'],['Sattelgelenk','Daumen'],['Bizeps','beugt den Arm'],['Trizeps','streckt den Arm'],['Form der Wirbelsäule','doppelte S-Form'],['Bandscheiben','Puffer zwischen den Wirbeln'],['Schädel schützt …','das Gehirn']],
 tasks:[['m','Welche Art Gelenk ist das Kniegelenk?',['Scharniergelenk','Kugelgelenk','Sattelgelenk','Drehgelenk'],'Das Knie bewegt sich in nur einer Ebene.'],['m','Welche Art Gelenk ist das Schultergelenk?',['Kugelgelenk','Scharniergelenk','Sattelgelenk','Drehgelenk'],'Der Arm lässt sich in alle Richtungen bewegen.'],['m','Welcher Muskel beugt den Arm?',['Bizeps','Trizeps','Deltamuskel','Wadenmuskel'],'Der Bizeps zieht den Unterarm nach oben.'],['m','Warum braucht ein Gelenk zwei Muskeln?',['Muskeln können nur ziehen, nicht drücken.','Ein Muskel allein wäre zu schwer.','Damit der Knochen besser wächst.','Damit das Gelenk geschmiert wird.'],'Gegenspielerprinzip: Beuger und Strecker.'],['m','Welche Aufgabe hat die doppelte S-Form der Wirbelsäule?',['Sie federt Stöße ab.','Sie macht uns größer.','Sie schützt das Herz.','Sie bildet Blut.'],'Wie eine Feder fängt sie Erschütterungen ab.'],['w','Der Daumen hat ein Sattelgelenk.',true,'Darum kann man den Daumen den anderen Fingern gegenüberstellen.']]},
{id:'bio-pflanzen',s:'bio',title:'Samenpflanzen: Bau, Blüte, Keimung',
 learn:[['Pflanzenorgane','<b>Wurzel</b>: Halt, Wasser- und Mineralstoffaufnahme · <b>Sprossachse</b> (Stängel): trägt, leitet · <b>Laubblatt</b>: Fotosynthese · <b>Blüte</b>: Fortpflanzung'],['Fotosynthese','Mit Licht und Blattgrün (Chlorophyll) stellt die Pflanze aus Wasser und Kohlenstoffdioxid Traubenzucker her. Dabei entsteht Sauerstoff.'],['Blütenbau (von außen nach innen)','Kelchblätter · Kronblätter · Staubblätter (mit Staubbeutel → Pollen) · Stempel (Narbe, Griffel, Fruchtknoten)'],['Bestäubung & Befruchtung','<b>Bestäubung</b>: Pollen gelangt auf die Narbe (durch Insekten oder Wind). <b>Befruchtung</b>: Verschmelzung im Fruchtknoten → Samen und Frucht entstehen.'],['Keimung','braucht Wasser, Wärme und Sauerstoff (Luft). Licht ist für die Keimung nicht nötig, aber für das Wachstum danach.'],['Nachweise','Stärke: Iod-Kaliumiodid-Lösung färbt <b>blauschwarz</b>. Fett: Fettfleckprobe – durchscheinender Fleck auf Papier.']],
 cards:[['Aufgabe der Wurzel','Halt, Wasser und Mineralstoffe aufnehmen'],['Was entsteht bei der Fotosynthese?','Traubenzucker und Sauerstoff'],['Was braucht die Fotosynthese?','Licht, Wasser, Kohlenstoffdioxid, Blattgrün'],['Teile des Stempels','Narbe, Griffel, Fruchtknoten'],['männlicher Blütenteil','Staubblatt'],['Bestäubung','Pollen gelangt auf die Narbe'],['Keimungsbedingungen','Wasser, Wärme, Sauerstoff'],['Stärkenachweis','Iod-Kaliumiodid-Lösung → blauschwarz'],['Fettnachweis','Fettfleckprobe']],
 tasks:[['m','Welches Gas entsteht bei der Fotosynthese?',['Sauerstoff','Kohlenstoffdioxid','Stickstoff','Wasserstoff'],'Pflanzen geben Sauerstoff ab.'],['m','Wo entsteht nach der Befruchtung der Samen?',['im Fruchtknoten','im Staubbeutel','in der Narbe','im Kelchblatt'],'Aus dem Fruchtknoten wird die Frucht mit den Samen.'],['m','Was braucht ein Samen NICHT zum Keimen?',['Licht','Wasser','Wärme','Sauerstoff'],'Bohnen keimen auch im Dunkeln.'],['m','Wie färbt sich Stärke mit Iod-Kaliumiodid-Lösung?',['blauschwarz','rot','gelb','grün'],'Typischer Stärkenachweis, z. B. bei der Kartoffel.'],['m','Wo sitzt der Pollen?',['im Staubbeutel','im Fruchtknoten','auf dem Kelchblatt','im Griffel'],'Staubblätter bestehen aus Staubfaden und Staubbeutel.'],['m','Was ist Bestäubung?',['Pollen gelangt auf die Narbe.','Samen fallen auf den Boden.','Blätter nehmen Licht auf.','Die Wurzel nimmt Wasser auf.'],'Danach kann die Befruchtung folgen.'],['w','Ein Experiment protokolliert man mit Frage, Vermutung, Durchführung, Beobachtung und Auswertung.',true,'Das ist das Protokollschema.']]},
{id:'bio-nahrung',s:'bio',title:'Nahrungsketten & Nutztiere',
 learn:[['Nahrungskette','Gras → Kaninchen → Fuchs. Der Pfeil bedeutet „wird gefressen von“.<br><b>Erzeuger (Produzenten)</b>: Pflanzen. <b>Verbraucher (Konsumenten)</b>: Tiere.'],['Nutztiere','Rind (Milch, Fleisch, Leder), Schwein (Fleisch), Huhn (Eier, Fleisch), Schaf (Wolle). Artgerechte Haltung: genug Platz, Auslauf, Licht, Kontakt zu Artgenossen, passendes Futter.']],
 cards:[['Erzeuger (Produzenten)','grüne Pflanzen'],['Verbraucher (Konsumenten)','Tiere'],['Pfeil in der Nahrungskette bedeutet','wird gefressen von'],['artgerechte Haltung','Platz, Auslauf, Licht, Artgenossen, passendes Futter']],
 tasks:[['m','Welche Nahrungskette ist richtig?',['Gras → Kaninchen → Fuchs','Fuchs → Kaninchen → Gras','Kaninchen → Gras → Fuchs','Gras → Fuchs → Kaninchen'],'Am Anfang steht immer eine Pflanze.'],['m','Wer steht am Anfang jeder Nahrungskette?',['eine Pflanze','ein Pflanzenfresser','ein Raubtier','ein Pilz'],'Pflanzen sind die Erzeuger.'],['w','Hühner brauchen für eine artgerechte Haltung Auslauf und Sandbäder.',true,'Sie scharren und baden gern im Sand.']]},

{id:'geo-erde',s:'geo',title:'Die Erde als Planet',
 learn:[['Unser Sonnensystem','8 Planeten: Merkur, Venus, <b>Erde</b>, Mars, Jupiter, Saturn, Uranus, Neptun. Merksatz: <i>Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel.</i>'],['Erdrotation','Die Erde dreht sich in <b>24 Stunden</b> einmal um sich selbst (von West nach Ost) → Tag und Nacht.'],['Erdrevolution','In etwa <b>365 Tagen</b> umläuft die Erde die Sonne. Weil die Erdachse schräg steht, gibt es Jahreszeiten.'],['Wichtige Linien','<b>Äquator</b>: teilt die Erde in Nord- und Südhalbkugel · <b>Nordpol und Südpol</b>: Endpunkte der Erdachse']],
 cards:[['Anzahl Planeten','8'],['Größter Planet','Jupiter'],['Sonnennächster Planet','Merkur'],['Dauer einer Erdrotation','24 Stunden'],['Dauer eines Sonnenumlaufs','etwa 365 Tage'],['Warum gibt es Jahreszeiten?','weil die Erdachse schräg steht'],['Äquator','teilt die Erde in Nord- und Südhalbkugel'],['Der Mond umkreist die Erde in …','etwa einem Monat (27–29 Tage)']],
 tasks:[['m','Was ist der Grund für Tag und Nacht?',['die Drehung der Erde um sich selbst','der Umlauf der Erde um die Sonne','die Bewegung des Mondes','die schräge Erdachse'],'Erdrotation: eine Drehung in 24 Stunden.'],['m','Warum gibt es Jahreszeiten?',['Die Erdachse steht schräg.','Die Erde ist im Sommer näher an der Sonne.','Die Sonne wird im Sommer heißer.','Der Mond verdeckt im Winter die Sonne.'],'Durch die Neigung bekommt mal die Nord-, mal die Südhalbkugel mehr Sonnenlicht.'],['m','Welcher Planet ist der Sonne am nächsten?',['Merkur','Venus','Mars','Erde'],'Merkur, Venus, Erde, Mars …'],['m','In welche Richtung dreht sich die Erde?',['von West nach Ost','von Ost nach West','von Nord nach Süd','von Süd nach Nord'],'Deshalb geht die Sonne im Osten auf.'],['w','Wenn bei uns Sommer ist, ist in Australien Winter.',true,'Nord- und Südhalbkugel haben entgegengesetzte Jahreszeiten.']]},
{id:'geo-orientierung',s:'geo',title:'Gradnetz, Himmelsrichtungen & Karten',
 learn:[['Himmelsrichtungen','N, O, S, W – dazwischen NO, SO, SW, NW. Die Sonne steht mittags im Süden. Kompassnadel zeigt nach Norden.'],['Gradnetz','<b>Breitenkreise</b>: parallel zum Äquator (0°) bis 90° N bzw. 90° S. <b>Längenhalbkreise (Meridiane)</b>: von Pol zu Pol, vom <b>Nullmeridian</b> (Greenwich bei London) bis 180° O bzw. W.'],['Karten','<b>Physische Karte</b>: Höhen (grün = Tiefland, gelb/braun = Gebirge), Flüsse, Städte. <b>Thematische Karte</b>: ein bestimmtes Thema (z. B. Klima, Bodenschätze). Die <b>Legende</b> erklärt die Zeichen.'],['Maßstab','1 : 100 000 → 1 cm auf der Karte = 100 000 cm = 1 km in Wirklichkeit. Großer Maßstab = viele Details, kleiner Ausschnitt.'],['Atlas','Im <b>Register</b> findest du einen Ort mit Seitenzahl und Planquadrat (z. B. 34 C3).']],
 cards:[['Breitengrad des Äquators','0°'],['Nullmeridian','verläuft durch Greenwich bei London'],['Höchster Breitengrad','90° (die Pole)'],['Farbe Tiefland auf physischen Karten','grün'],['Legende','erklärt die Kartenzeichen'],['1 : 100 000 – 1 cm sind …','1 km'],['Register im Atlas','alphabetisches Ortsverzeichnis'],['Wo steht die Sonne mittags?','im Süden']],
 tasks:[['m','Wo steht die Sonne bei uns um 12 Uhr mittags?',['im Süden','im Norden','im Osten','im Westen'],'Morgens Osten, mittags Süden, abends Westen.'],['m','Wodurch verläuft der Nullmeridian?',['Greenwich bei London','Berlin','Paris','den Nordpol und den Äquator'],'Er wurde 1884 festgelegt.'],['m','Was zeigt eine braune Farbe auf einer physischen Karte?',['Gebirge','Wüste','Tiefland','Städte'],'Je höher, desto dunkler das Braun.'],['m','Welche Karte zeigt die Bodenschätze Deutschlands?',['eine thematische Karte','eine physische Karte','ein Stadtplan','eine Wanderkarte'],'Thematische Karten zeigen ein bestimmtes Thema.'],['m','Welcher Maßstab zeigt mehr Einzelheiten?',['1 : 25 000','1 : 1 000 000','1 : 500 000','1 : 100 000'],'Je kleiner die Zahl hinter dem Doppelpunkt, desto größer der Maßstab und desto genauer.'],['w','Breitenkreise verlaufen von Pol zu Pol.',false,'Das sind die Längenhalbkreise (Meridiane).']]},
{id:'geo-kontinente',s:'geo',title:'Kontinente & Ozeane',auto:true,
 learn:[['7 Kontinente (nach Größe)','Asien · Afrika · Nordamerika · Südamerika · Antarktika · Europa · Australien (Australien und Ozeanien)'],['Ozeane','<b>Pazifik</b> (Pazifischer Ozean, größter) · <b>Atlantik</b> · <b>Indischer Ozean</b> · dazu Nord- und Südpolarmeer'],['Wasser und Land','Etwa 71 % der Erdoberfläche sind Wasser, nur 29 % Land. Deshalb nennt man die Erde den „blauen Planeten“.']],

{id:'geo-deutschland',s:'geo',title:'Deutschland: Landschaften & Flüsse',

{id:'ge-zeit',s:'ge',title:'Zeitrechnung & Quellen',gen:'jahrhundert',genShare:.45,

{id:'ge-urgeschichte',s:'ge',title:'Ur- und Frühgeschichte',
 learn:[['Altsteinzeit','Menschen lebten als <b>Jäger und Sammler</b>, zogen umher (<b>Nomaden</b>), nutzten Feuer, Faustkeil, Speere. Höhlenmalereien zeigen Tiere.'],['Jungsteinzeit','<b>Neolithische Revolution</b>: Ackerbau und Viehzucht → Menschen werden <b>sesshaft</b>, bauen Langhäuser, töpfern, weben, schleifen Steinwerkzeuge.'],['Metallzeit','Kupfer → <b>Bronze</b> (Kupfer + Zinn) → <b>Eisen</b>. Handel und Handwerk nehmen zu.'],['Himmelsscheibe von Nebra','1999 bei Nebra in Sachsen-Anhalt gefunden, etwa 3 600 Jahre alt (Bronzezeit). Älteste bekannte konkrete Darstellung des Himmels. Heute im Landesmuseum für Vorgeschichte in Halle.'],['Ötzi','Gletschermumie, ca. 5 300 Jahre alt, 1991 in den Ötztaler Alpen gefunden. Hatte ein Kupferbeil dabei.']],
 cards:[['Neolithische Revolution','Übergang zu Ackerbau, Viehzucht und Sesshaftigkeit'],['Nomaden','Menschen ohne festen Wohnsitz'],['Bronze besteht aus …','Kupfer und Zinn'],['Fundort Himmelsscheibe','Nebra (Sachsen-Anhalt)'],['Alter der Himmelsscheibe','etwa 3 600 Jahre'],['Wo ist die Himmelsscheibe heute?','Landesmuseum für Vorgeschichte Halle'],['Werkzeug der Altsteinzeit','Faustkeil'],['Ötzi – Alter','etwa 5 300 Jahre']],
 tasks:[['m','Was veränderte sich in der Jungsteinzeit grundlegend?',['Die Menschen wurden sesshaft und betrieben Ackerbau.','Die Menschen lernten das Feuer kennen.','Die Menschen begannen mit Eisen zu arbeiten.','Die Menschen erfanden die Schrift.'],'Das nennt man neolithische Revolution.'],['m','Woraus besteht Bronze?',['Kupfer und Zinn','Eisen und Kupfer','Zinn und Silber','Eisen und Kohle'],'Diese Mischung (Legierung) ist härter als reines Kupfer.'],['m','Wo wurde die Himmelsscheibe gefunden?',['bei Nebra in Sachsen-Anhalt','bei Halle im Saaletal','im Harz bei Wernigerode','in den Ötztaler Alpen'],'Fundort: Mittelberg bei Nebra.'],['m','Wie lebten die Menschen in der Altsteinzeit?',['als Jäger und Sammler','als Bauern in Dörfern','als Händler in Städten','als Hirten in Langhäusern'],'Sie folgten den Tierherden.'],['m','In welche Reihenfolge gehören die Zeitalter?',['Altsteinzeit – Jungsteinzeit – Metallzeit','Jungsteinzeit – Altsteinzeit – Metallzeit','Metallzeit – Altsteinzeit – Jungsteinzeit','Altsteinzeit – Metallzeit – Jungsteinzeit'],'Stein → geschliffener Stein → Metall.'],['w','Höhlenmalereien zeigen vor allem Tiere.',true,'z. B. Wildpferde, Bisons, Mammuts.']]},
{id:'ge-aegypten',s:'ge',title:'Ägypten – eine Hochkultur',

 tasks:[['m','Warum war die Nilschwemme wichtig?',['Sie brachte fruchtbaren Schlamm auf die Felder.','Sie schützte vor Feinden aus der Wüste.','Sie trieb die Mühlen an.','Sie spülte die Städte sauber.'],'Ohne Schlamm keine reichen Ernten.'],['m','Wer stand an der Spitze der ägyptischen Gesellschaft?',['der Pharao','der Wesir','der Hohepriester','der oberste Schreiber'],'Der Pharao galt als Sohn des Sonnengottes.'],['m','Was gehört NICHT zu den Merkmalen einer Hochkultur?',['Leben als Nomaden','Schrift','Arbeitsteilung','Verwaltung'],'Hochkulturen waren sesshaft mit Städten.'],['m','Warum wurden Tote mumifiziert?',['Der Körper sollte für das Leben nach dem Tod erhalten bleiben.','Man wollte Krankheiten erforschen.','So konnte man sie leichter transportieren.','Damit die Pyramiden schneller fertig wurden.'],'Glaube an ein Weiterleben im Jenseits.'],['m','Worauf schrieben die Ägypter?',['Papyrus','Pergament','Papier','Tontafeln'],'Papyrus wurde aus Schilfstängeln hergestellt.'],['w','Schreiber hatten im alten Ägypten ein hohes Ansehen.',true,'Nur wenige konnten lesen und schreiben.']]},

 learn:[['Was ist ein Märchen?','Eine Erzählung, in der Wunderbares und Zauberei ganz selbstverständlich passieren. Man unterscheidet <b>Volksmärchen</b> (unbekannter Verfasser, lange mündlich weitererzählt, später gesammelt) und <b>Kunstmärchen</b> (von einem bekannten Dichter erfunden und aufgeschrieben).'],

{id:'de-maerchen-text',s:'de',title:'Märchen: Merkmale im Text finden',
 text:`<p style="text-align:center"><b>Das Lied des Raben</b></p><p>Es war einmal ein armer Korbflechter, der hatte drei Söhne. Die beiden älteren waren stark, aber hochmütig. Der jüngste, Hans, war klein und still, und alle lachten über ihn.</p><p>Eines Tages ließ der König verkünden: „Ein böser Zauberer hat meine Tochter in den Turm am Schwarzen Moor gesperrt. Wer sie befreit, soll sie zur Frau bekommen.“</p><p>Zuerst zog der älteste Bruder los. Am Waldrand saß eine alte Frau und bat um ein Stück Brot. „Ich habe selbst nicht genug“, rief er und ging weiter. Er kam nie zurück. Dem zweiten Bruder erging es genauso.</p><p>Zuletzt machte sich Hans auf den Weg. Als die alte Frau ihn um Brot bat, teilte er seinen letzten Kanten mit ihr. Da sprach sie: „Weil du ein gutes Herz hast, schenke ich dir diesen Raben. Er wird dir dreimal helfen.“</p><p>Der Rabe führte Hans durch den finsteren Wald, warnte ihn vor einer tiefen Schlucht und fand den geheimen Eingang zum Turm. Dort stand der Zauberer und lachte: „Kleiner Wicht, was willst du hier?“</p><p>Doch der Rabe flog auf Hans' Schulter und sang:<br><i>„Nebel, Nebel, weiche fort,<br>Zauber, brich an diesem Ort!“</i></p><p>Da zerfiel der Zauberer zu grauem Staub. Auch die beiden Brüder, die er in Steine verwandelt hatte, wurden wieder lebendig.</p><p>Hans führte die Königstochter heim, und bald wurde Hochzeit gefeiert. Und wenn sie nicht gestorben sind, dann leben sie noch heute.</p>`,
 learn:[['So gehst du in der Arbeit vor','1. Text genau lesen. 2. Merkmale mit Bleistift markieren (Anfang, Schluss, Zahlen, Zauber, Helfer, Gegensätze). 3. Jedes Merkmal <b>mit Textstelle belegen</b>: „Das Märchen beginnt mit der typischen Anfangsformel ‚Es war einmal‘.“']],

 negativ(){const k=R(0,3);

  const a=R(1,20);return {t:'i',q:`Wie heißt die <b>Gegenzahl</b> von ${a}?`,a:'-'+a,ex:`Gegenzahlen liegen gleich weit von 0 entfernt: ${a} und −${a}. (Minus mit - eintippen)`};},
 dezimal(){const k=R(0,4);
  if(k===0){const n=R(1000,99999)/1000;const st=pick([[1,'Zehntel'],[2,'Hundertstel']]);const r=Math.round(n*10**st[0])/10**st[0];return {t:'i',q:`Runde <b>${dez(n)}</b> auf <b>${st[1]}</b>.`,a:r.toFixed(st[0]).replace('.',','),ex:`Schau auf die Ziffer rechts daneben: 0–4 abrunden, 5–9 aufrunden → ${r.toFixed(st[0]).replace('.',',')}.`};}
  if(k===1){const a=R(10,999)/100,b=R(10,999)/100,op=Math.random()<.5?'+':'−';const [x,y]=op==='−'&&b>a?[b,a]:[a,b];const r=Math.round((op==='+'?x+y:x-y)*100)/100;return {t:'i',q:`${dez(x)} ${op} ${dez(y)} =`,a:dez(r),ex:`Komma unter Komma schreiben, fehlende Stellen mit 0 auffüllen. Ergebnis: ${dez(r)}.`};}
  if(k===2){const f=pick([[1,2,'0,5'],[1,4,'0,25'],[3,4,'0,75'],[1,5,'0,2'],[2,5,'0,4'],[1,10,'0,1'],[3,10,'0,3'],[7,10,'0,7'],[1,100,'0,01'],[9,100,'0,09'],[3,5,'0,6'],[1,20,'0,05']]);return {t:'i',q:`Schreibe als Dezimalzahl: <b>${f[0]}/${f[1]}</b>`,a:f[2],ex:`${f[0]}/${f[1]} erweitert auf Zehntel/Hundertstel = ${f[2]}.`};}
  if(k===3){const a=R(100,999)/100;let b=Math.round((a+(Math.random()<.5?-1:1)*R(1,30)/100)*100)/100;if(b===a)b=a+0.01;const c=[a,b,Math.round(a*10)/100+R(1,4)].map(v=>Math.round(v*100)/100);const mx=Math.max(...c);return {t:'m',q:'Welche Zahl ist am größten?',a:[dez(mx),...c.filter(v=>v!==mx).map(dez)].filter((v,i,s)=>s.indexOf(v)===i),ex:'Stelle für Stelle vergleichen: erst Einer, dann Zehntel, dann Hundertstel.'};}
  const n=R(1,9),z=R(0,9),h=R(1,9);return {t:'i',q:`Welche Ziffer steht in <b>${n},${z}${h}</b> an der <b>Hundertstel</b>stelle?`,a:String(h),ex:'Nach dem Komma: 1. Stelle Zehntel, 2. Stelle Hundertstel, 3. Stelle Tausendstel.'};},
 bruchrechnen(){const k=R(0,3),n=pick([3,4,5,6,8,10,12]);
  const kurz=(z,nn)=>{const g=gcd(z,nn);return `${z/g}/${nn/g}`};
  if(k===0){const a=R(1,n-1),b=R(1,n-a);return {t:'i',q:`${a}/${n} + ${b}/${n} = ? (gekürzt)`,a:a+b===n?'1':kurz(a+b,n),ex:`Gleiche Nenner: nur die Zähler addieren: ${a+b}/${n}${gcd(a+b,n)>1?' = '+(a+b===n?'1':kurz(a+b,n)):''}.`};}
  if(k===1){const p=pick([[2,4],[2,6],[3,6],[2,8],[4,8],[3,12],[4,12]]),a=R(1,p[0]-1),b=R(1,p[1]-1),N=p[1],r=a*(N/p[0])+b;if(r>=N)return GEN.bruchrechnen();return {t:'i',q:`${a}/${p[0]} + ${b}/${N} = ? (gekürzt)`,a:kurz(r,N),ex:`Gleichnamig machen: ${a}/${p[0]} = ${a*N/p[0]}/${N}. Dann ${a*N/p[0]}/${N} + ${b}/${N} = ${r}/${N}${gcd(r,N)>1?' = '+kurz(r,N):''}.`};}
  if(k===2){const a=R(1,5),b=R(2,7),c=R(1,5),d=R(2,7);return {t:'i',q:`${a}/${b} · ${c}/${d} = ? (gekürzt)`,a:a*c%(b*d)===0?String(a*c/(b*d)):kurz(a*c,b*d),ex:`Zähler mal Zähler, Nenner mal Nenner: ${a*c}/${b*d}${gcd(a*c,b*d)>1?' = '+kurz(a*c,b*d):''}.`};}
  const a=R(1,5),b=R(2,7),c=R(1,5),d=R(2,7);const z=a*d,nn=b*c;return {t:'i',q:`${a}/${b} : ${c}/${d} = ? (gekürzt, ggf. als unechter Bruch)`,a:z%nn===0?String(z/nn):kurz(z,nn),ex:`Durch einen Bruch teilen = mit dem Kehrwert malnehmen: ${a}/${b} · ${d}/${c} = ${z}/${nn}${gcd(z,nn)>1?' = '+(z%nn===0?z/nn:kurz(z,nn)):''}.`};},
 winkelbez(){const a=R(3,17)*5,k=R(0,3);const nm=['Nebenwinkel','Scheitelwinkel','Stufenwinkel','Wechselwinkel'][k];const v=k===0?180-a:a;
  return {t:'i',q:`α = ${a}°. Wie groß ist sein <b>${nm}</b>?`,a:String(v),ex:k===0?`Nebenwinkel ergänzen sich zu 180°: 180° − ${a}° = ${v}°.`:`${nm} sind gleich groß${k>1?' (an geschnittenen Parallelen)':''}: ${v}°.`,u:'°'};},

  if(k===0){const a=R(20,100),b=R(20,150-a),c=180-a-b;return {t:'i',q:`In einem Dreieck ist α = ${a}° und β = ${b}°. Wie groß ist γ?`,a:String(c),ex:`Innenwinkelsumme im Dreieck: 180°. γ = 180° − ${a}° − ${b}° = ${c}°.`,u:'°'};}
  if(k===1){const g=R(2,12)*2,h=R(2,12);return {t:'i',q:`Ein Dreieck hat die Grundseite g = ${g} cm und die Höhe h = ${h} cm. Flächeninhalt in cm²?`,a:String(g*h/2),ex:`A = g · h : 2 = ${g} · ${h} : 2 = ${g*h/2} cm². (Halbes Rechteck!)`,u:'cm²'};}
  const a=R(3,12),b=R(3,12),c=R(Math.abs(a-b)+1,a+b-1);return {t:'i',q:`Ein Dreieck hat die Seiten ${a} cm, ${b} cm und ${c} cm. Umfang in cm?`,a:String(a+b+c),ex:`u = a + b + c = ${a+b+c} cm.`,u:'cm'};},
 viereck(){const k=R(0,2);
  if(k===0){const a=R(60,120),b=R(60,120),c=R(60,Math.min(150,330-a-b)),d=360-a-b-c;if(d<=20||d>=180)return GEN.viereck();return {t:'i',q:`In einem Viereck sind drei Winkel ${a}°, ${b}° und ${c}° groß. Wie groß ist der vierte?`,a:String(d),ex:`Innenwinkelsumme im Viereck: 360°. 360° − ${a}° − ${b}° − ${c}° = ${d}°.`,u:'°'};}
  if(k===1){const g=R(3,15),h=R(2,10);return {t:'i',q:`Ein Parallelogramm hat g = ${g} cm und h = ${h} cm. Flächeninhalt in cm²?`,a:String(g*h),ex:`A = g · h = ${g*h} cm². (Ein Dreieck abschneiden und anlegen → Rechteck.)`,u:'cm²'};}
  const a=R(2,10),c=R(2,10),h=R(2,8);if((a+c)*h%2)return GEN.viereck();return {t:'i',q:`Ein Trapez hat die parallelen Seiten a = ${a} cm und c = ${c} cm und die Höhe h = ${h} cm. Flächeninhalt in cm²?`,a:String((a+c)*h/2),ex:`A = (a + c) · h : 2 = (${a} + ${c}) · ${h} : 2 = ${(a+c)*h/2} cm².`,u:'cm²'};},

  if(k===0){const p=pick([[3,'Brötchen',[0.35,0.4,0.45,0.5]],[4,'Hefte',[0.8,1.2,1.5]],[5,'Kugeln Eis',[1.2,1.5,1.8]],[2,'kg Äpfel',[2.2,2.5,3]]]);const n=p[0],e=pick(p[2]),m=R(n+1,n+8),tot=Math.round(n*e*100)/100,ans=Math.round(m*e*100)/100;
   return {t:'i',q:`${n} ${p[1]} kosten ${dez(tot)} €. Wie viel kosten <b>${m}</b> ${p[1]}? (in €)`,a:ans.toFixed(2).replace('.',','),ex:`Dreisatz: ${n} → ${dez(tot)} € · 1 → ${dez(e)} € · ${m} → ${m} · ${dez(e)} € = ${ans.toFixed(2).replace('.',',')} €.`,u:'€'};}
  const w=pick([2,3,4,6]),t=pick([12,18,24,36]),w2=pick([1,2,3,4,6,8,9,12].filter(x=>x!==w&&(w*t)%x===0));return {t:'i',q:`${w} Personen brauchen für eine Arbeit ${t} Stunden. Wie lange brauchen <b>${w2}</b> Personen? (Stunden)`,a:String(w*t/w2),ex:`Antiproportional: Mehr Personen → weniger Zeit. 1 Person: ${w} · ${t} = ${w*t} h. ${w2} Personen: ${w*t} : ${w2} = ${w*t/w2} h.`,u:'h'};}

 tasks:[['m','Woran erkennst du sofort, dass ein Netz KEIN Würfelnetz ist?',['Vier Quadrate bilden einen 2×2-Block.','Es hat genau sechs Quadrate.','Vier Quadrate liegen in einer Reihe.','Es sieht wie ein Kreuz aus.'],'Ein 2×2-Block lässt sich nicht zum Würfel falten.'],['m','Wie viele Rechtecke hat das Netz eines Quaders?',['6','4','8','12'],'Jeder Quader hat 6 Flächen.'],['m','Wie zeichnet man im Schrägbild die nach hinten laufenden Kanten?',['im 45°-Winkel und halb so lang','senkrecht und doppelt so lang','waagerecht in wahrer Länge','im 90°-Winkel und halb so lang'],'So wirkt die Zeichnung räumlich.'],['w','Bei einem Würfel liegen sich im Netz gegenüberliegende Flächen nie direkt nebeneinander.',true,'Gegenüberliegende Flächen haben im Netz immer eine Fläche dazwischen.']]});

 cards:[['Nebenwinkel ergeben zusammen …','180°'],['Scheitelwinkel sind …','gleich groß'],['Stufenwinkel an Parallelen sind …','gleich groß'],['Wechselwinkel – typische Form','Z-Form']],

 cards:[['Innenwinkelsumme im Viereck','360°'],['Quadrat','4 gleich lange Seiten und 4 rechte Winkel'],['Raute','4 gleich lange Seiten'],['Trapez','mindestens zwei parallele Seiten'],['Fläche Parallelogramm','A = g · h'],['Fläche Trapez','A = (a + c) · h : 2'],['Drachenviereck','zwei Paare gleich langer Nachbarseiten']],
 th:[['m','Welche Aussage stimmt?',['Jedes Quadrat ist auch ein Rechteck.','Jedes Rechteck ist auch ein Quadrat.','Jede Raute ist ein Quadrat.','Jedes Trapez ist ein Parallelogramm.'],'Das Quadrat erfüllt alle Bedingungen des Rechtecks.'],['m','Welches Viereck hat vier gleich lange Seiten, aber nicht unbedingt rechte Winkel?',['Raute','Rechteck','Trapez','Drachen'],'Die Raute.'],['m','Warum hat jedes Viereck die Winkelsumme 360°?',['Es lässt sich in zwei Dreiecke teilen.','Es hat vier rechte Winkel.','Es hat vier Seiten mit je 90 cm.','Weil 4 · 180° = 360° ist.'],'2 · 180° = 360°.']]});
addAfter('ma-daten',{id:'ma-proportional',s:'ma',title:'Zuordnungen & Dreisatz',k6:true,gen:'dreisatz',genShare:.6,

 th:[['m','Welche Zuordnung ist proportional?',['Anzahl Hefte → Preis','Anzahl Maler → Zeit zum Streichen','Alter → Körpergröße','Geschwindigkeit → Fahrzeit'],'Doppelt so viele Hefte kosten doppelt so viel.'],['m','Welche Zuordnung ist antiproportional?',['Anzahl Personen → Zeit für dieselbe Arbeit','Liter Benzin → Preis','Kilogramm Äpfel → Preis','Minuten → zurückgelegte Strecke bei gleichem Tempo'],'Mehr Personen brauchen weniger Zeit.'],['w','Bei proportionalen Zuordnungen bleibt das Produkt der Wertepaare gleich.',false,'Das gilt bei antiproportionalen. Bei proportionalen bleibt der Quotient gleich.']]});

addAfter('de-zeichen',{id:'de-rechtschreibung2',s:'de',title:'Rechtschreibung: Dehnung, Schärfung, ähnliche Laute',
 learn:[['Dehnung (langer Vokal)','Meist ohne Zeichen (Tafel, Hose). Sonst: <b>ie</b> (Liebe), <b>Dehnungs-h</b> (fahren, Stuhl), <b>Doppelvokal</b> (Meer, Boot, Saal).'],['Schärfung (kurzer Vokal)','Nach kurzem, betontem Vokal folgen zwei Konsonanten. Hört man nur einen, wird er verdoppelt: Ball, Kamm, Mutter. Statt kk → <b>ck</b> (Decke), statt zz → <b>tz</b> (Katze).'],['Ähnlich klingende Laute','<b>Verlängern</b> hilft bei b/p, d/t, g/k am Wortende: Hund → Hunde, Zug → Züge. <b>Ableiten</b> hilft bei ä/e und äu/eu: Bäume → Baum, Hände → Hand.'],['Anredepronomen','Höfliche Anrede wird großgeschrieben: <b>Sie, Ihnen, Ihr</b>. In Briefen dürfen du/dein auch groß geschrieben werden.']],
 cards:[['Probe bei b/p, d/t, g/k am Wortende','verlängern (Hund → Hunde)'],['Probe bei ä oder e','ableiten (Hände → Hand)'],['Statt kk schreibt man …','ck'],['Statt zz schreibt man …','tz'],['Drei Dehnungszeichen','ie, Dehnungs-h, Doppelvokal'],['höfliche Anrede','Sie, Ihnen, Ihr – groß']],
 tasks:[['m','Wie schreibt man richtig? Der Hun_ bellt.',['d','t'],'Verlängern: die Hunde → d.'],['m','Der Zu_ fährt ab.',['g','k'],'Verlängern: die Züge → g.'],['m','Welches Wort ist richtig geschrieben?',['Bäume','Beume','Bäüme','Boime'],'Ableiten: Baum → Bäume.'],['m','Welches Wort ist richtig geschrieben?',['Katze','Kaze','Kazze','Katse'],'Nach kurzem Vokal: tz statt zz.'],['m','Welches Wort ist richtig geschrieben?',['Decke','Deke','Dekke','Decche'],'Nach kurzem Vokal: ck statt kk.'],['m','Welches Wort ist richtig geschrieben?',['Stuhl','Stul','Stuhll','Stuel'],'Dehnungs-h vor l.'],['m','Im Sommer fahren wir ans ___.',['Meer','Mehr','Mer','Meehr'],'Die See: das Meer – mit Doppelvokal. „mehr“ heißt „eine größere Menge“.'],['m','Höflicher Brief: Können ___ mir helfen?',['Sie','sie'],'Höfliche Anrede → groß.'],['w','In „Mutter“ ist das u kurz, darum steht tt.',true,'Schärfung: kurzer Vokal → Doppelkonsonant.']]});
addAfter('de-satzglieder',{id:'de-saetze',s:'de',title:'Satzarten, Satzbau & Verbformen',
 learn:[['Satzarten','<b>Aussagesatz</b> (.) · <b>Fragesatz</b> (?) · <b>Aufforderungssatz</b> (! oder .)'],['Haupt- und Nebensatz','<b>Hauptsatz</b>: kann allein stehen, Verb an 2. Stelle. <b>Nebensatz</b>: beginnt oft mit weil, dass, wenn, ob, als – das gebeugte Verb steht am <b>Ende</b>. Zwischen ihnen steht ein Komma.'],['Satzreihe & Satzgefüge','<b>Satzreihe</b>: Hauptsatz + Hauptsatz (Ich lache, denn es ist lustig.) · <b>Satzgefüge</b>: Hauptsatz + Nebensatz (Ich lache, weil es lustig ist.)'],['Weitere Satzglieder','<b>Genitivobjekt</b>: Wessen? (Sie gedenkt <i>der Toten</i>.) · <b>Präpositionalobjekt</b>: mit Präposition (Ich warte <i>auf dich</i>.) · <b>Attribut</b>: beschreibt ein Nomen näher (das <i>rote</i> Auto, das Haus <i>am See</i>)'],['Verbformen','<b>finit</b> (gebeugt): er spielt · <b>infinit</b>: spielen (Infinitiv), gespielt (Partizip II) · <b>Stammformen</b>: singen – sang – gesungen · <b>Aktiv</b>: Paul öffnet die Tür. <b>Passiv</b>: Die Tür wird geöffnet.']],
 cards:[['Wo steht das Verb im Nebensatz?','am Ende'],['Satzgefüge','Hauptsatz + Nebensatz'],['Satzreihe','Hauptsatz + Hauptsatz'],['Attribut','bestimmt ein Nomen näher (das rote Auto)'],['Präpositionalobjekt','Objekt mit Präposition (auf dich warten)'],['Stammformen von „gehen“','gehen – ging – gegangen'],['Passiv von „Paul baut ein Haus.“','Ein Haus wird (von Paul) gebaut.'],['finite Verbform','die gebeugte Form (er spielt)']],
 tasks:[['m','Welcher Satz ist ein Satzgefüge?',['Ich bleibe drinnen, weil es regnet.','Ich bleibe drinnen, denn es regnet.','Es regnet und ich bleibe drinnen.','Es regnet. Ich bleibe drinnen.'],'„weil“ leitet einen Nebensatz ein → Hauptsatz + Nebensatz.'],['m','Wo steht das gebeugte Verb in „…, dass er heute kommt“?',['am Ende','an zweiter Stelle','am Anfang','nach „dass“'],'Im Nebensatz steht das finite Verb am Ende.'],['m','Welches Satzglied ist „auf den Bus“ in „Wir warten auf den Bus.“?',['Präpositionalobjekt','Akkusativobjekt','Adverbiale des Ortes','Attribut'],'Man fragt: Worauf warten wir? – Präposition + Objekt.'],['m','Was ist „rote“ in „Das rote Fahrrad ist neu.“?',['Attribut','Prädikat','Objekt','Subjekt'],'Es beschreibt das Nomen „Fahrrad“ genauer und gehört zum Subjekt.'],['m','Welcher Satz steht im Passiv?',['Der Kuchen wird gebacken.','Oma backt einen Kuchen.','Oma hat einen Kuchen gebacken.','Oma wird einen Kuchen backen.'],'wird + Partizip II, die handelnde Person tritt in den Hintergrund.'],['i','Ergänze die Stammformen: schwimmen – schwamm – ___','geschwommen','schwimmen – schwamm – geschwommen.'],['m','Welche Satzart ist „Mach bitte das Fenster zu!“?',['Aufforderungssatz','Aussagesatz','Fragesatz','Ausrufesatz'],'Jemand wird zu etwas aufgefordert.'],['w','„Denn“ leitet einen Nebensatz ein.',false,'Nach „denn“ folgt ein Hauptsatz (Verb an 2. Stelle). „Weil“ leitet einen Nebensatz ein.']]});
addAfter('de-wortarten',{id:'de-wortbildung',s:'de',title:'Wortbildung, Wortfamilie & Wortfeld',
 learn:[['Zusammensetzung','<b>Grundwort</b> (hinten, bestimmt die Wortart und den Artikel) + <b>Bestimmungswort</b> (vorne): Haus + Tür → die Haustür. Manchmal mit <b>Fugenzeichen</b>: Geburt<b>s</b>tag, Hund<b>e</b>hütte.'],['Ableitung','Mit <b>Präfix</b> (Vorsilbe: <i>ver</i>laufen, <i>un</i>klar) oder <b>Suffix</b> (Nachsilbe: Frei<i>heit</i>, freund<i>lich</i>).'],['Wortfamilie','Wörter mit demselben <b>Wortstamm</b>: fahren, Fahrer, Fahrt, Fahrrad, gefährlich (Ablaut ä).'],['Wortfeld','Wörter mit ähnlicher Bedeutung: gehen – laufen, schleichen, rennen, schlendern.'],['Ober- und Unterbegriff','Obst (Oberbegriff) – Apfel, Birne (Unterbegriffe)'],['Wortherkunft','<b>Erbwort</b>: immer schon deutsch (Vater) · <b>Lehnwort</b>: eingedeutscht (Fenster aus lat. fenestra) · <b>Fremdwort</b>: noch fremd erkennbar (Computer)']],
 cards:[['Grundwort','der hintere Teil einer Zusammensetzung – bestimmt den Artikel'],['Fugenzeichen in „Geburtstag“','s'],['Präfix','Vorsilbe (ver-, un-, be-)'],['Suffix','Nachsilbe (-heit, -lich, -ung)'],['Wortfamilie','Wörter mit gleichem Wortstamm'],['Wortfeld','Wörter mit ähnlicher Bedeutung'],['Lehnwort','eingedeutschtes Wort aus einer anderen Sprache (Fenster)'],['Fremdwort','noch als fremd erkennbar (Computer)']],
 tasks:[['m','Was ist das Grundwort in „Fußballschuh“?',['Schuh','Fuß','Ball','Fußball'],'Das letzte Wort bestimmt: der Schuh.'],['m','Welcher Artikel gehört zu „Haustür“?',['die','das','der','den'],'Grundwort „Tür“ → die Haustür.'],['m','Welches Wort gehört NICHT zur Wortfamilie „fahren“?',['fertig','Fahrt','Gefährt','Fahrer'],'„fertig“ hat einen anderen Wortstamm.'],['m','Welches Wort gehört zum Wortfeld „sprechen“?',['flüstern','schreiben','hören','lesen'],'Flüstern ist eine Art zu sprechen.'],['m','Welche Nachsilbe macht aus „frei“ ein Nomen?',['-heit','-lich','-ig','-bar'],'die Freiheit.'],['m','Was ist „Computer“?',['ein Fremdwort','ein Erbwort','ein Lehnwort','eine Zusammensetzung'],'Schreibung und Aussprache sind noch englisch.'],['m','Welches Wort hat ein Fugenzeichen?',['Arbeitszimmer','Haustür','Schulbuch','Kopfkissen'],'Arbeit + s + Zimmer.'],['m','Was ist der Oberbegriff zu Rose, Tulpe und Nelke?',['Blumen','Gärten','Pflanzenteile','Sträuße'],'Alle sind Blumen.']]});
addAfter('de-texte',{id:'de-beschreiben',s:'de',title:'Beschreiben, Berichten & Nacherzählen',
 learn:[['Beschreiben','<b>Sachlich und genau</b>, im <b>Präsens</b>, ohne eigene Meinung. Gegenstand: vom Gesamteindruck zu den Einzelheiten (Form, Farbe, Material, Größe). Weg: Reihenfolge, Richtungen, Orientierungspunkte („an der Ampel links“). Vorgang/Anleitung: Materialien, dann Schritte der Reihe nach.'],['Berichten','Informiert sachlich über ein Ereignis. Beantwortet die <b>W-Fragen</b>: Wer? Was? Wann? Wo? Wie? Warum? Welche Folgen? Zeitform: <b>Präteritum</b>. Keine Spannung, keine wörtliche Rede, keine Gefühle.'],['Nacherzählen','Eine Geschichte in eigenen Worten wiedergeben: Reihenfolge beibehalten, nichts Wichtiges weglassen, nichts dazuerfinden. Präteritum.'],['Erzählen vs. Berichten','Erzählen will <b>unterhalten</b> (spannend, Gefühle). Berichten will <b>informieren</b> (sachlich, genau).']],
 cards:[['Zeitform beim Beschreiben','Präsens'],['Zeitform beim Berichten','Präteritum'],['W-Fragen des Berichts','Wer? Was? Wann? Wo? Wie? Warum? Folgen?'],['Ziel eines Berichts','sachlich informieren'],['Wegbeschreibung braucht …','Reihenfolge, Richtungen, Orientierungspunkte'],['Nacherzählen','in eigenen Worten, Reihenfolge beibehalten, nichts dazuerfinden']],
 tasks:[['m','Welcher Satz passt in einen Unfallbericht?',['Am Montag gegen 7.45 Uhr stieß an der Kreuzung ein Radfahrer mit einem Auto zusammen.','Plötzlich – ein lauter Knall! Mein Herz raste.','„Pass doch auf!“, schrie der Fahrer wütend.','Es war der schlimmste Morgen meines Lebens.'],'Sachlich, genaue Zeit und Ort, keine Gefühle.'],['m','In welcher Zeitform schreibt man eine Gegenstandsbeschreibung?',['Präsens','Präteritum','Perfekt','Futur I'],'Der Gegenstand ist jetzt so.'],['m','Was gehört NICHT in einen Bericht?',['wörtliche Rede und Spannung','Angaben zu Zeit und Ort','die Folgen des Ereignisses','die beteiligten Personen'],'Ein Bericht ist sachlich.'],['m','Welcher Satz ist eine gute Wegbeschreibung?',['Geh an der Bäckerei vorbei und biege an der Ampel links ab.','Geh irgendwie Richtung Stadt, dann siehst du es schon.','Das ist ganz einfach, das findest du sofort.','Früher stand dort ein großer Baum.'],'Genaue Orientierungspunkte und Richtungen.'],['m','Womit beginnt eine Gegenstandsbeschreibung?',['mit dem Gesamteindruck (Art, Größe, Form)','mit der kleinsten Einzelheit','mit der eigenen Meinung','mit dem Preis'],'Vom Ganzen zu den Einzelheiten.'],['w','Beim Nacherzählen darf man spannende Stellen dazuerfinden.',false,'Nacherzählen heißt: Inhalt treu wiedergeben.']]});
addAfter('de-beschreiben',{id:'de-brief',s:'de',title:'Brief, E-Mail & Postkarte',
 learn:[['Aufbau eines Briefes','Ort und Datum (oben rechts) · Anrede mit Komma (Liebe Oma,) · Brieftext, nach der Anrede klein weiter · Grußformel (Viele Grüße) · Unterschrift'],['Persönlich oder offiziell','<b>Persönlich</b>: an Freunde/Familie, du. <b>Offiziell</b>: an Fremde, Ämter, Firmen – höflich mit <b>Sie</b>, Anrede „Sehr geehrte Frau …,“, Gruß „Mit freundlichen Grüßen“.'],['E-Mail','Aussagekräftiger <b>Betreff</b>, Anrede, kurzer Text, Gruß, Name. Bei offiziellen E-Mails keine Smileys und keine Abkürzungen.'],['Postkarte','Kurz: Gruß vom Ort, was man erlebt, Gruß. Adresse rechts.']],
 cards:[['Wo steht das Datum im Brief?','oben rechts (mit Ort)'],['Satzzeichen nach der Anrede','Komma'],['Nach der Anrede schreibt man …','klein weiter'],['Offizielle Grußformel','Mit freundlichen Grüßen'],['Offizielle Anrede','Sehr geehrte Frau …, / Sehr geehrter Herr …,'],['Was braucht jede E-Mail?','einen aussagekräftigen Betreff']],
 tasks:[['m','Welche Anrede passt in einen Brief an die Schulleiterin?',['Sehr geehrte Frau Krause,','Hallo Frau Krause!','Hi Schulleiterin,','Liebe Krause,'],'Offizieller Brief → höflich.'],['m','Wie geht es nach „Liebe Oma,“ in der nächsten Zeile weiter?',['vielen Dank für das Paket!','Vielen Dank für das Paket!','VIELEN Dank für das Paket!','… vielen Dank für das Paket!'],'Nach dem Komma geht es klein weiter (außer bei Nomen).'],['m','Welcher Betreff ist für eine E-Mail an den Sportverein am besten?',['Anmeldung zum Fußballtraining','Hallo','Frage','!!!'],'Der Betreff sagt kurz, worum es geht.'],['m','Welche Grußformel passt zu einem offiziellen Brief?',['Mit freundlichen Grüßen','Hab dich lieb','Tschüssi','Bis bald, Kumpel'],'Höflich und sachlich.'],['w','In einem Brief an die Stadtverwaltung schreibt man „Sie“ groß.',true,'Höfliche Anredepronomen werden immer großgeschrieben.']]});
addAfter('de-maerchen-text',{id:'de-lyrik',s:'de',title:'Gedichte: Vers, Strophe, Reim & Metrum',
 text:`<p style="text-align:center"><b>Novembermorgen</b></p><p>Der Nebel kriecht durchs stille Feld,<br>die Krähe ruft vom kahlen Baum,<br>als hätte sich die ganze Welt<br>verloren in dem grauen Traum.</p><p>Da bricht ein Sonnenstrahl hervor,<br>er tanzt auf jedem nassen Blatt,<br>und leise öffnet sich ein Tor<br>zu einem Tag, der Farben hat.</p>`,
 learn:[['Bausteine','<b>Vers</b> = eine Gedichtzeile · <b>Strophe</b> = mehrere Verse als Abschnitt'],['Reimformen','<b>Paarreim</b> aabb · <b>Kreuzreim</b> abab · <b>umarmender Reim</b> abba · <b>Haufenreim</b> aaaa. Am Versende = <b>Endreim</b>.'],['Metrum (Versmaß)','Abfolge von betonten (X) und unbetonten (x) Silben. <b>Jambus</b>: xX (be-<b>ginnt</b>) · <b>Trochäus</b>: Xx (<b>Son</b>-ne)'],['Zeilensprung','Der Satz geht über das Versende hinaus in den nächsten Vers weiter.'],['Sprachliche Bilder','<b>Vergleich</b>: mit „wie“ (stark wie ein Bär) · <b>Metapher</b>: ohne „wie“ (Du bist ein Bär) · <b>Personifikation</b>: Dinge handeln wie Menschen (Der Wind singt) · <b>Alliteration</b>: gleicher Anfangslaut (Milch macht müde Männer munter) · <b>Wiederholung</b>'],['Lyrisches Ich','Die Stimme, die im Gedicht spricht – nicht unbedingt der Dichter selbst.']],
 cards:[['Vers','eine Zeile im Gedicht'],['Strophe','Abschnitt aus mehreren Versen'],['Paarreim','aabb'],['Kreuzreim','abab'],['umarmender Reim','abba'],['Jambus','unbetont – betont (xX)'],['Trochäus','betont – unbetont (Xx)'],['Personifikation','Dinge oder Tiere handeln wie Menschen'],['Metapher','bildlicher Ausdruck ohne „wie“'],['Alliteration','gleicher Anfangslaut aufeinanderfolgender Wörter'],['Lyrisches Ich','die Sprecherstimme im Gedicht']],
 tasks:[['m','Welche Reimform hat die erste Strophe von „Novembermorgen“ (Feld – Baum – Welt – Traum)?',['Kreuzreim (abab)','Paarreim (aabb)','umarmender Reim (abba)','Haufenreim (aaaa)'],'Feld/Welt = a, Baum/Traum = b → abab.'],['m','Wie viele Verse hat jede Strophe von „Novembermorgen“?',['4','2','8','3'],'Jede Strophe hat vier Zeilen.'],['m','Welches Stilmittel ist „Der Nebel kriecht“?',['Personifikation','Vergleich','Alliteration','Reim'],'Nebel kann nicht wirklich kriechen – er handelt wie ein Lebewesen.'],['m','Welches Stilmittel ist „er tanzt auf jedem nassen Blatt“ (über den Sonnenstrahl)?',['Personifikation','Vergleich','Alliteration','Zeilensprung'],'Der Sonnenstrahl tanzt wie ein Mensch.'],['m','Welcher Ausdruck ist ein Vergleich?',['flink wie ein Wiesel','Der Mond lacht.','Max macht Musik.','ein Meer aus Tränen'],'Ein Vergleich enthält „wie“.'],['m','Welches Metrum hat „be-GINNT, ver-LIERT, zu-RÜCK“?',['Jambus','Trochäus','gar keins','Haufenreim'],'unbetont – betont = Jambus.'],['m','Wie heißt es, wenn ein Satz über das Versende hinausgeht (Verse 3 und 4 der ersten Strophe)?',['Zeilensprung','Kreuzreim','Strophe','Metapher'],'„als hätte sich die ganze Welt / verloren …“'],['m','Wie verändert sich die Stimmung von der ersten zur zweiten Strophe?',['von grau und trüb zu hell und hoffnungsvoll','von fröhlich zu traurig','von laut zu leise','sie bleibt gleich düster'],'Der Sonnenstrahl bringt Farbe – „ein Tag, der Farben hat“.']]});
addAfter('de-lyrik',{id:'de-epik',s:'de',title:'Erzählung, Sage & Drama',
 learn:[['Erzählung untersuchen','<b>Ort</b> und <b>Zeit</b> · <b>Figuren</b> und ihre Beziehungen · <b>Handlung</b> (Was passiert?) · <b>Thema</b> (Worum geht es eigentlich?) · <b>Aufbau</b> (Einleitung, Hauptteil mit Höhepunkt, Schluss)'],['Erzählform','<b>Ich-Erzähler</b>: eine Figur erzählt selbst („Ich rannte …“) · <b>Er-/Sie-Erzähler</b>: jemand erzählt von außen („Sie rannte …“)'],['Sagen','<b>Götter- und Heldensagen</b> (z. B. griechische Sagen um Odysseus oder Herakles): Helden bestehen Abenteuer, Götter greifen ein. <b>Ortssagen</b> (z. B. aus dem Harz) erklären Orte oder Naturerscheinungen.'],['Drama','Text zum Aufführen: in <b>Szenen</b> gegliedert, besteht aus <b>Dialogen</b>. <b>Regieanweisungen</b> (oft kursiv/in Klammern) sagen, wie gespielt wird. Zur Aufführung gehören Bühne, Kostüm, Mimik, Gestik.']],
 cards:[['Ich-Erzähler','eine Figur erzählt selbst in der Ich-Form'],['Er-/Sie-Erzähler','erzählt von außen in der 3. Person'],['Regieanweisung','Hinweis, wie gespielt wird (Ort, Bewegung, Tonfall)'],['Dialog','Gespräch zwischen Figuren'],['Szene','Abschnitt eines Theaterstücks'],['Heldensage','Abenteuer eines Helden, oft mit Göttern']],
 tasks:[['m','„Als ich das Tor öffnete, stockte mir der Atem.“ – Welche Erzählform?',['Ich-Erzähler','Er-Erzähler','Sie-Erzähler','Dialog'],'Die Figur erzählt selbst.'],['m','Was ist eine Regieanweisung?',['ein Hinweis, wie eine Szene gespielt werden soll','der wichtigste Satz einer Figur','die Überschrift des Theaterstücks','das Ende eines Gedichts'],'z. B. (flüstert, geht zur Tür).'],['m','Woraus besteht ein Theaterstück hauptsächlich?',['aus Dialogen','aus Strophen','aus Berichten','aus Briefen'],'Figuren sprechen miteinander.'],['m','Was unterscheidet eine Sage von einem Märchen?',['Sie hat einen wahren Kern, z. B. einen echten Ort.','Sie beginnt mit „Es war einmal“.','In ihr gibt es keine Helden.','Sie ist immer in Reimen geschrieben.'],'Sagen sind an Orte oder Personen gebunden.'],['m','Was beschreibt das „Thema“ einer Geschichte?',['worum es im Kern geht, z. B. Freundschaft oder Mut','wie viele Seiten sie hat','wer sie geschrieben hat','in welcher Zeitform sie steht'],'Das Thema ist die zentrale Frage hinter der Handlung.']]});
addAfter('de-lesen',{id:'de-sachtext',s:'de',title:'Sachtexte & Medien: Der Biber kehrt zurück',
 text:`<p style="text-align:center"><b>Der Biber kehrt zurück</b></p><p>Vor etwa hundert Jahren war der Biber in Deutschland fast ausgerottet. Man jagte ihn wegen seines dichten Fells und seines Fleisches. Nur an der mittleren Elbe in Sachsen-Anhalt überlebten einige Tiere. Heute leben wieder viele Biber in Deutschland – die Elbe-Biber gelten als Ursprung vieler heutiger Bestände.</p><p>Der Biber ist das größte Nagetier Europas. Ein ausgewachsenes Tier kann über einen Meter lang und bis zu 30 Kilogramm schwer werden. Sein platter, schuppiger Schwanz, die „Kelle“, dient ihm beim Schwimmen als Steuer. Mit seinen orangefarbenen Nagezähnen fällt er Bäume.</p><p>Biber bauen <b>Dämme</b>, um den Wasserstand eines Baches anzuheben. So liegt der Eingang zu ihrer Wohnung, der <b>Burg</b>, immer unter Wasser und ist vor Feinden geschützt. Durch die Dämme entstehen neue Teiche, in denen Fische, Frösche und Libellen leben.</p><p>Nicht alle freuen sich über den Rückkehrer: Manchmal überschwemmen Biberdämme Felder oder Wege. Naturschützer suchen dann gemeinsam mit Landwirten nach Lösungen.</p>`,
 learn:[['Sachtexte lesen','1. Überschrift und Bilder ansehen – was erwarte ich? 2. <b>Orientierendes Lesen</b>: überfliegen, worum geht es? 3. <b>Genaues Lesen</b>: Schlüsselwörter markieren, Absätze zusammenfassen. 4. Fragen mit Textverweis beantworten.'],['Kontinuierlich & diskontinuierlich','<b>Kontinuierliche</b> Texte: Fließtext in Sätzen. <b>Diskontinuierliche</b> Texte: Tabellen, Diagramme, Schaubilder, Karten.'],['Orientierungshilfen','Inhaltsverzeichnis, Kapitelüberschriften, Hervorhebungen (fett), Glossar (Worterklärungen am Ende)'],['Textsorten','Lehrbuchtext · Klappentext (macht neugierig auf ein Buch) · Wörterbucheintrag · Gebrauchsanleitung'],['Medien','Quellen immer angeben (Wer hat es geschrieben? Wann?). Informationen in mehreren Quellen prüfen. Bilder und Texte anderer nicht einfach als eigene ausgeben.']],
 cards:[['orientierendes Lesen','überfliegen, um zu erfahren, worum es geht'],['diskontinuierlicher Text','Tabelle, Diagramm, Schaubild, Karte'],['Glossar','Worterklärungen am Ende eines Buches'],['Klappentext','kurzer Text auf dem Buchumschlag, der neugierig macht']],
 tasks:[['m','Warum war der Biber vor etwa 100 Jahren fast ausgerottet?',['Er wurde wegen Fell und Fleisch gejagt.','Die Flüsse waren ausgetrocknet.','Eine Krankheit hatte die Tiere befallen.','Er fand im Winter keine Nahrung.'],'1. Absatz: „Man jagte ihn wegen seines dichten Fells und seines Fleisches.“'],['m','Wo überlebten einige Biber?',['an der mittleren Elbe in Sachsen-Anhalt','im Harz an der Bode','an der Ostseeküste','in den Alpen'],'1. Absatz.'],['m','Wozu dient die „Kelle“?',['als Steuer beim Schwimmen','zum Fällen von Bäumen','zum Bauen der Burg','zum Wärmen im Winter'],'2. Absatz.'],['m','Warum bauen Biber Dämme?',['damit der Eingang ihrer Burg unter Wasser liegt','um Fische zu fangen','um Menschen fernzuhalten','um im Sommer zu baden'],'3. Absatz.'],['m','Welche Folge der Biberdämme wird als Problem genannt?',['Felder oder Wege werden überschwemmt.','Fische können nicht mehr schwimmen.','Bäume wachsen schneller.','Libellen verschwinden.'],'4. Absatz.'],['m','Welche Überschrift passt am besten zum 3. Absatz?',['Baumeister am Bach','Gejagt und fast verschwunden','Streit mit den Landwirten','Das größte Nagetier Europas'],'Der Absatz erklärt Dämme und Burg.'],['m','Was für ein Text ist „Der Biber kehrt zurück“?',['ein Sachtext','ein Märchen','ein Gedicht','eine Fabel'],'Er informiert sachlich über ein Tier.'],['m','Was ist ein diskontinuierlicher Text?',['ein Säulendiagramm','ein Zeitungsartikel','eine Erzählung','ein Brief'],'Diskontinuierlich = nicht fortlaufend in Sätzen.']]});

addAfter('bio-wirbeltiere',{id:'bio-entwicklung',s:'bio',title:'Fortpflanzung & Entwicklung: Frosch und Vogel',
 learn:[['Entwicklung des Grasfroschs','<b>Laich</b> im Wasser (Laichballen) → <b>Kaulquappe</b> mit äußeren, dann inneren Kiemen und Ruderschwanz → Hinterbeine wachsen → Vorderbeine wachsen, Lunge entsteht → Schwanz bildet sich zurück → junger <b>Frosch</b> geht an Land. Diese Umwandlung heißt <b>Metamorphose</b>.'],['Das Vogelei','<b>Kalkschale</b> (Schutz, mit Poren für Luft) · <b>Schalenhaut</b> · <b>Luftkammer</b> · <b>Eiklar</b> (Wasser, Eiweiß, polstert) · <b>Hagelschnüre</b> (halten den Dotter in der Mitte) · <b>Dotter</b> (Nahrung) · <b>Keimscheibe</b> (daraus entwickelt sich das Küken). Die Henne brütet 21 Tage.'],['Nesthocker & Nestflüchter','<b>Nesthocker</b>: schlüpfen nackt und blind, werden lange gefüttert (Amsel, Meise). <b>Nestflüchter</b>: schlüpfen mit Daunen und sehend, laufen bald mit (Huhn, Ente).'],['Verwandtschaft','Lurche leben „doppelt“ (Wasser und Land) und zeigen, wie die Wirbeltiere vom Wasser an Land gekommen sind.']],
 cards:[['Metamorphose','Umwandlung von der Larve zum erwachsenen Tier (Kaulquappe → Frosch)'],['Froschlarve','Kaulquappe'],['Keimscheibe','Teil des Eis, aus dem sich das Küken entwickelt'],['Dotter','Nahrungsvorrat für den Embryo'],['Hagelschnüre','halten den Dotter in der Mitte'],['Brutdauer beim Huhn','21 Tage'],['Nesthocker – Beispiel','Amsel, Meise'],['Nestflüchter – Beispiel','Huhn, Ente']],
 tasks:[['m','In welcher Reihenfolge entwickelt sich ein Frosch?',['Laich – Kaulquappe – Hinterbeine – Vorderbeine – Frosch','Laich – Vorderbeine – Kaulquappe – Hinterbeine – Frosch','Kaulquappe – Laich – Hinterbeine – Frosch – Vorderbeine','Laich – Kaulquappe – Vorderbeine – Hinterbeine – Frosch'],'Zuerst wachsen die Hinterbeine.'],['m','Womit atmet eine junge Kaulquappe?',['mit Kiemen','mit der Lunge','nur über die Haut','mit Luftsäcken'],'Sie lebt im Wasser.'],['m','Aus welchem Teil des Eis entsteht das Küken?',['aus der Keimscheibe','aus dem Eiklar','aus dem Dotter','aus der Luftkammer'],'Der Dotter ist nur die Nahrung.'],['m','Wozu hat die Kalkschale Poren?',['damit Luft zum Küken gelangt','damit Wasser ausläuft','damit sie leichter bricht','damit die Henne sie wärmen kann'],'Der Embryo braucht Sauerstoff.'],['m','Welcher Vogel ist ein Nestflüchter?',['Ente','Amsel','Meise','Taube'],'Küken laufen kurz nach dem Schlüpfen mit.'],['w','Bei der Metamorphose des Froschs bildet sich der Schwanz zurück.',true,'Der erwachsene Frosch hat keinen Schwanz mehr.']]});
addAfter('bio-pflanzen',{id:'bio-kulturpflanzen',s:'bio',title:'Kulturpflanzen & Pflanzen bestimmen',
 learn:[['Kulturpflanzen','Vom Menschen angebaute und gezüchtete Pflanzen. Sie speichern Nährstoffe in bestimmten Organen.'],['Speicherstoffe','<b>Stärke</b>: Kartoffel (Sprossknolle), Getreide (Weizen, Roggen, Gerste, Hafer, Mais) · <b>Fett/Öl</b>: Raps, Sonnenblume · <b>Zucker</b>: Zuckerrübe · <b>Eiweiß</b>: Bohne, Erbse'],['Getreide unterscheiden','<b>Weizen</b>: kurze Grannen oder keine · <b>Roggen</b>: lange Grannen, Ähre hängt · <b>Gerste</b>: sehr lange Grannen · <b>Hafer</b>: keine Ähre, sondern eine Rispe'],['Pflanzen bestimmen','Mit einem <b>Bestimmungsschlüssel</b>: Schritt für Schritt zwischen zwei Merkmalen entscheiden. Pflanzenfamilien: <b>Kreuzblütler</b> (4 Kronblätter über Kreuz, z. B. Raps) · <b>Rosengewächse</b> (5 Kronblätter, viele Staubblätter, z. B. Apfel, Erdbeere) · <b>Lippenblütler</b> (Ober- und Unterlippe, z. B. Taubnessel) · <b>Schmetterlingsblütler</b> (Blüte wie ein Schmetterling, z. B. Erbse) · <b>Korbblütler</b> (viele kleine Blüten in einem Korb, z. B. Löwenzahn, Sonnenblume)']],
 cards:[['Speicherstoff der Kartoffel','Stärke'],['Speicherstoff im Raps','Öl (Fett)'],['Speicherstoff der Zuckerrübe','Zucker'],['Getreide mit Rispe statt Ähre','Hafer'],['Kreuzblütler – Merkmal','4 Kronblätter über Kreuz'],['Korbblütler – Beispiel','Löwenzahn, Sonnenblume'],['Rosengewächs – Beispiel','Apfel, Erdbeere'],['Bestimmungsschlüssel','Schritt für Schritt zwischen zwei Merkmalen entscheiden']],
 tasks:[['m','Welcher Speicherstoff steckt vor allem in der Kartoffel?',['Stärke','Öl','Zucker','Eiweiß'],'Iodprobe: blauschwarz.'],['m','Aus welcher Pflanze wird bei uns viel Speiseöl gewonnen?',['Raps','Roggen','Zuckerrübe','Kartoffel'],'Die gelben Rapsfelder im Frühling.'],['m','Woran erkennst du Hafer?',['Er hat eine Rispe statt einer Ähre.','Er hat sehr lange Grannen.','Seine Ähre hängt nach unten.','Er hat gar keine Körner.'],'Die Körner hängen an kleinen Ästchen.'],['m','Zu welcher Familie gehört der Löwenzahn?',['Korbblütler','Kreuzblütler','Rosengewächse','Lippenblütler'],'Viele kleine Einzelblüten bilden einen „Korb“.'],['m','Welche Pflanzenfamilie hat 4 Kronblätter über Kreuz?',['Kreuzblütler','Rosengewächse','Schmetterlingsblütler','Korbblütler'],'z. B. Raps, Senf, Kohl.'],['m','Welche Pflanze ist ein Schmetterlingsblütler?',['Erbse','Apfel','Raps','Löwenzahn'],'Ihre Blüte sieht aus wie ein Schmetterling.'],['w','Die Kartoffelknolle ist eine Wurzel.',false,'Sie ist eine verdickte Sprossachse (Sprossknolle).']]});
addAfter('geo-laender',{id:'geo-wirtschaft',s:'geo',title:'Deutschland: Landwirtschaft, Industrie & Tourismus',
 learn:[['Landwirtschaft','<b>Magdeburger Börde</b>: sehr fruchtbare <b>Schwarzerde</b> (Löss) → Weizen, Zuckerrüben. Mittelgebirge und Alpen: eher Grünland und Viehhaltung. Formen: konventionell und <b>ökologisch</b> (ohne chemische Spritzmittel, artgerechte Tierhaltung).'],['Industrie im Wandel','<b>Ruhrgebiet</b>: früher Kohle und Stahl, heute <b>Strukturwandel</b> zu Dienstleistung, Technik, Kultur. <b>Mitteldeutsches Chemiedreieck</b> (Leuna, Schkopau, Bitterfeld) in Sachsen-Anhalt. <b>Braunkohle</b> im Tagebau – nach dem Abbau Rekultivierung, z. B. <b>Geiseltalsee</b>.'],['Landschaften & Tourismus','<b>Küste</b>: Badeurlaub, Wattwandern · <b>Mittelgebirge</b> (Harz = <b>Bruchschollengebirge</b>): Wandern, Wintersport · <b>Alpen</b>: Skifahren, Bergsteigen. Tourismus bringt Arbeit, kann aber Natur belasten.'],['Bevölkerungsdichte','Einwohner pro km². Dicht: Ballungsräume (Ruhrgebiet, Berlin). Dünn: ländliche Räume (Altmark).']],
 cards:[['Schwarzerde-Gebiet in Sachsen-Anhalt','Magdeburger Börde'],['Strukturwandel im Ruhrgebiet','von Kohle und Stahl zu Dienstleistung und Technik'],['Mitteldeutsches Chemiedreieck','Leuna, Schkopau, Bitterfeld'],['Rekultivierung','Landschaft nach dem Bergbau wieder nutzbar machen (z. B. Seen)'],['Geiseltalsee','entstand aus einem ehemaligen Braunkohletagebau'],['Bevölkerungsdichte','Einwohner pro Quadratkilometer'],['Harz – Gebirgsart','Bruchschollengebirge'],['ökologische Landwirtschaft','ohne chemische Spritzmittel, artgerechte Tierhaltung']],
 tasks:[['m','Warum wird in der Magdeburger Börde viel Weizen angebaut?',['wegen des sehr fruchtbaren Schwarzerdebodens','wegen der vielen Berge','weil es dort sehr kalt ist','weil dort kaum Regen fällt'],'Lössboden mit Schwarzerde gehört zu den besten Böden.'],['m','Was bedeutet „Strukturwandel“ im Ruhrgebiet?',['Kohle und Stahl wurden weniger wichtig, neue Branchen kamen dazu.','Alle Menschen zogen weg.','Es wurden neue Kohlebergwerke gebaut.','Die Städte wurden zu Dörfern.'],'Heute gibt es dort Universitäten, Technik und Kultur.'],['m','Was ist der Geiseltalsee?',['ein gefluteter ehemaliger Braunkohletagebau','ein Gletschersee in den Alpen','ein Meeresarm der Ostsee','ein Stausee im Harz'],'Er liegt bei Merseburg und ist einer der größten künstlichen Seen Deutschlands.'],['m','Welche Region ist am dichtesten besiedelt?',['Ruhrgebiet','Altmark','Bayerischer Wald','Lüneburger Heide'],'Ein Ballungsraum mit vielen Städten.'],['m','Welche Stadt gehört zum Mitteldeutschen Chemiedreieck?',['Leuna','Wernigerode','Stendal','Dessau-Roßlau'],'Leuna, Schkopau und Bitterfeld.'],['w','Tourismus kann der Natur auch schaden.',true,'z. B. durch Verkehr, Müll oder überlaufene Wanderwege.']]});
