/* ---------- Üben / Trainieren ---------- */
function startQuiz(id,rep){const t=topic(id);const tasks=tasksFor(t,10);go('quiz',{title:t.title,color:subj(t.s).color,tasks,i:0,r:0,w:0,xp:0,retry:[],phase:1,tid:id,text:t.text},rep)}
function startMix(tasks,title,color){if(!tasks.length){toast('Keine Aufgaben gefunden.');return}go('quiz',{title,color:color||'#38bdf8',tasks,i:0,r:0,w:0,xp:0,retry:[],phase:1})}
VIEWS.quiz=p=>{
 if(p.i>=p.tasks.length)return quizEnd(p);
 const t=p.tasks[p.i];const pct=Math.round(p.i/p.tasks.length*100);const tp=topic(t.tid);
 let h=hdr(esc(p.title),p.color,`<span class="pill">${p.i+1}/${p.tasks.length}</span>`)+`<div class="prog"><i style="width:${pct}%"></i></div>`;
 if(p.phase===2)h+=`<p class="small" style="color:var(--warn)">🔁 Fehler-Runde: Versuch es noch einmal!</p>`;
 if(tp&&tp.text)h+=`<details class="text"${p.i===0?' open':''}><summary>Lesetext anzeigen</summary>${tp.text}</details>`;
 h+=`<div class="q">${t.q}</div>`+answerUI(t,p.ans,p.done);
 if(p.done){const ok=p.ok;h+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ '+PRAISE[p.i%PRAISE.length]:'❌ '+OOPS[p.i%OOPS.length]+' Richtig ist: '+esc(showAns(t))}</b>${t.ex?`<div class="small">${t.ex}</div>`:''}</div><button class="btn" id="nx" onclick="quizNext()" autofocus>Weiter →</button>`}
 return h;
};
function answerUI(t,ans,done,testMode){
 if(t.t==='m'){if(!t._o)t._o=shuffle(t.a);return `<div class="opts">${t._o.map((o,j)=>{let c='';if(done){if(o===t.a[0])c='ok';else if(o===ans)c='no'}else if(testMode&&o===ans)c='sel';return `<button class="opt ${c}" ${done?'disabled':''} onclick="${testMode?'testAns':'quizAns'}(${j})">${o}</button>`}).join('')}</div>`}
 if(t.t==='w'){return `<div class="tf">${[true,false].map(v=>{let c='';if(done){if(v===t.a)c='ok';else if(v===ans)c='no'}else if(testMode&&v===ans)c='sel';return `<button class="opt ${c}" style="text-align:center" ${done?'disabled':''} onclick="${testMode?'testAns':'quizAns'}(${v})">${v?'👍 Stimmt':'👎 Stimmt nicht'}</button>`}).join('')}</div>`}
 const num=isNum(first(t.a));
 return `<div style="display:flex;gap:8px;align-items:center"><input id="ans" ${done?'disabled':''} value="${esc(ans||'')}" ${num?'inputmode="decimal"':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Deine Antwort" ${!done?'autofocus':''} onkeydown="if(event.key==='Enter'){${testMode?'testIn()':'quizIn()'}}" ${testMode?'oninput="testIn(true)"':''}>${t.u?`<b>${t.u}</b>`:''}</div>${done||testMode?'':'<button class="btn" onclick="quizIn()">Prüfen</button>'}`;
}
function quizIn(){const v=$('#ans').value.trim();if(!v){toast('Gib zuerst eine Antwort ein.');return}quizAns(v,true)}
function quizAns(j,raw){
 const p=view.p;if(p.done)return;const t=p.tasks[p.i];let v=raw?j:(t.t==='m'?t._o[j]:j);
 const ok=check(t,v);p.ans=v;p.done=true;p.ok=ok;const k=tkey(t);
 const st=S.tp[t.tid]||(S.tp[t.tid]={});
 if(ok){p.r++;st.r=(st.r||0)+1;const x=p.phase===2?5:10;p.xp+=x;addXP(x);delete S.miss[k]}
 else{p.w++;st.w=(st.w||0)+1;S.miss[k]={...t,_o:undefined};if(p.phase===1&&p.tasks!==p.retry)p.retry.push({...t,_o:undefined});if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}}
 const mk=Object.keys(S.miss);if(mk.length>80)delete S.miss[mk[0]];
 save();render();
}
function quizNext(){const p=view.p;p.i++;p.done=false;p.ans='';render();scrollTo(0,0)}
function quizEnd(p){
 if(p.phase===1&&p.retry.length&&!p.noRetry){return hdr(esc(p.title),p.color)+`<div class="big">🔁</div><h2 class="center">${p.retry.length} ${p.retry.length===1?'Aufgabe':'Aufgaben'} noch nicht richtig</h2><p class="center mut">Hol dir die Punkte zurück! In der Fehler-Runde übst du genau diese Aufgaben noch einmal.</p><button class="btn" onclick="retryRound()">Fehler-Runde starten</button><button class="btn sec2" onclick="view.p.noRetry=true;render()">Überspringen</button>`}
 if(!p.saved){p.saved=true;const first=p.r1??p.r;const tot=p.n1??p.tasks.length;const pct=Math.round(first/tot*100);if(p.tid){const st=S.tp[p.tid]||(S.tp[p.tid]={});st.sc=st.sc==null?pct:Math.round(st.sc*.5+pct*.5);st.last=today()}save()}
 const tot=p.n1??p.tasks.length,first=p.r1??p.r,pct=Math.round(first/tot*100);
 const em=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'💪';
 return hdr(esc(p.title),p.color)+`<div class="big">${em}</div><h2 class="center">${first} von ${tot} beim ersten Versuch richtig</h2><p class="center mut">+${p.xp} XP · ${pct>=90?'Hervorragend!':pct>=70?'Richtig gut!':pct>=50?'Ordentlich – dranbleiben!':'Übung macht den Meister. Schau dir noch einmal die Merkkästen an.'}</p>
 ${p.tid?`<button class="btn" onclick="startQuiz('${p.tid}',true)">Noch eine Runde</button>`:`<button class="btn" onclick="go('train',{},true)">Weiter trainieren</button>`}
 ${p.tid&&pct<70?`<button class="btn sec2" onclick="go('learn',{id:'${p.tid}'},true)">📘 Nochmal lernen</button>`:''}<button class="btn sec2" onclick="go('home',{},true)">Zur Startseite</button>`;
}
function retryRound(){const p=view.p;p.r1=p.r;p.n1=p.tasks.length;p.tasks=p.retry.map(t=>({...t,_o:undefined}));p.retry=[];p.i=0;p.phase=2;p.done=false;render()}

/* ---------- Trainieren ---------- */
VIEWS.train=()=>{
 const nMiss=Object.keys(S.miss).length;
 return hdr('💪 Trainieren','#f59e0b')+`<div class="list">
 <button class="item" onclick="weakMix()"><span style="font-size:1.6rem">🎯</span><div class="t"><b>Schwächen-Mix</b><small>12 Aufgaben aus deinen unsichersten Themen</small></div>›</button>
 <button class="item" ${nMiss?'onclick="missMix()"':'style="opacity:.5"'}><span style="font-size:1.6rem">🔁</span><div class="t"><b>Fehler wiederholen</b><small>${nMiss?nMiss+' Aufgaben, die du falsch hattest':'Keine offenen Fehler – super!'}</small></div>›</button>
 <button class="item" onclick="startBlitz()"><span style="font-size:1.6rem">⚡</span><div class="t"><b>Blitzrechnen</b><small>60 Sekunden Kopfrechnen · Rekord: ${S.blitz||0}</small></div>›</button>
 <button class="item" onclick="startCards(null)"><span style="font-size:1.6rem">🧠</span><div class="t"><b>Karteikarten wiederholen</b><small>alle fälligen Karten aus allen Fächern</small></div>›</button>
 </div><div class="sec">Zufalls-Mix aus einem Fach</div><div class="chips">${SUBJECTS.filter(s=>topicsOf(s.id).length).map(s=>`<button class="chip" onclick="subjMix('${s.id}')">${s.icon} ${s.name}</button>`).join('')}</div>`;
};
function weakMix(){const ts=allTopics().filter(t=>(t.tasks&&t.tasks.length)||t.gen||((t.auto||t.vok)&&t.cards.length));
 const scored=ts.map(t=>({t,sc:topicScore(t.id)})).sort((a,b)=>(a.sc??60)-(b.sc??60));
 const sel=scored.slice(0,4).map(x=>x.t);startMix(shuffle(sel.flatMap(t=>tasksFor(t,3))),'Schwächen-Mix','#f59e0b')}
function missMix(){startMix(shuffle(Object.values(S.miss)).slice(0,15).map(t=>({...t,_o:undefined})),'Fehler wiederholen','#f43f5e')}
function subjMix(s){const ts=topicsOf(s).filter(t=>(t.tasks&&t.tasks.length)||t.gen||((t.auto||t.vok)&&t.cards.length));if(!ts.length){toast('Hier gibt es noch keine Aufgaben.');return}
 const out=[];for(let i=0;i<12;i++)out.push(...tasksFor(ts[i%ts.length],1));startMix(shuffle(out),subj(s).name+'-Mix',subj(s).color)}

/* ---------- Blitzrechnen ---------- */
let blitzT=null;
function startBlitz(){go('blitz',{});view.p={t:GEN.blitz(),r:0,w:0,end:Date.now()+60000,run:true};render();clearInterval(blitzT);blitzT=setInterval(()=>{const p=view.p;if(view.n!=='blitz'){clearInterval(blitzT);return}const left=Math.max(0,Math.ceil((p.end-Date.now())/1000));const el=$('#bt');if(el)el.textContent=left+' s';if(left<=0){clearInterval(blitzT);p.run=false;const x=p.r*2;addXP(x);if(p.r>(S.blitz||0)){S.blitz=p.r;p.rec=true}save();render()}},250)}
VIEWS.blitz=p=>{
 if(!p.t)return VIEWS.train();
 if(!p.run)return hdr('⚡ Blitzrechnen','#f59e0b')+`<div class="big">${p.rec?'🏆':'⚡'}</div><h2 class="center">${p.r} richtig${p.w?`, ${p.w} falsch`:''}</h2><p class="center mut">${p.rec?'Neuer Rekord!':'Rekord: '+S.blitz} · +${p.r*2} XP</p><button class="btn" onclick="startBlitz()">Nochmal</button><button class="btn sec2" onclick="go('train',{},true)">Zurück</button>`;
 return hdr('⚡ Blitzrechnen','#f59e0b',`<span class="pill timer" id="bt">60 s</span>`)+`<p class="center mut">✅ ${p.r} · ❌ ${p.w}</p><div class="q center" style="font-size:2rem">${p.t.q}</div><input id="ans" inputmode="numeric" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')blitzIn()" style="font-size:1.6rem;text-align:center"><button class="btn" onclick="blitzIn()">OK</button>${p.last?`<p class="center small mut">${p.last}</p>`:''}`;
};
function blitzIn(){const p=view.p;const v=$('#ans').value.trim();if(!v)return;if(check(p.t,v)){p.r++;p.last='✅ '+p.t.q+' '+p.t.a}else{p.w++;p.last='❌ '+p.t.q+' '+p.t.a}p.t=GEN.blitz();render()}

/* ---------- Merken (Karteikarten, Lernkartei mit 5 Fächern) ---------- */
function startCards(id){
 let cs;
 if(id){const all=cardsOf(topic(id));cs=shuffle(all.filter(isDue)).concat(shuffle(all.filter(isNew)).slice(0,15));if(!cs.length)cs=shuffle(all).slice(0,15)}
 else{cs=shuffle(allTopics().flatMap(cardsOf).filter(isDue)).slice(0,30);if(!cs.length){go('cardsempty');return}}
 cs=cs.map(c=>({...c,rev:c.vok&&Math.random()<.5}));
 const t=id?topic(id):null;go('cards',{cs,i:0,ok:0,no:0,title:t?t.title:'Alle fälligen Karten',color:t?subj(t.s).color:'#a855f7',tid:id});
}
VIEWS.cardsempty=()=>hdr('🧠 Merken','#a855f7')+`<div class="big">🎉</div><h2 class="center">Heute ist nichts fällig!</h2><p class="center mut">Neue Karten lernst du in jedem Thema über „Merken“. Wähle ein Fach:</p><div class="chips" style="justify-content:center">${SUBJECTS.filter(s=>topicsOf(s.id).some(t=>(t.cards||[]).length)).map(s=>`<button class="chip" onclick="go('subject',{s:'${s.id}'})">${s.icon} ${s.name}</button>`).join('')}</div>`;
VIEWS.cards=p=>{
 if(p.i>=p.cs.length){if(!p.saved){p.saved=true;save()}return hdr('🧠 '+esc(p.title),p.color)+`<div class="big">🧠</div><h2 class="center">${p.ok} gewusst · ${p.no} noch üben</h2><p class="center mut">Karten, die du wusstest, kommen erst in ein paar Tagen wieder. Die anderen morgen.</p>${p.tid?`<button class="btn" onclick="startQuiz('${p.tid}',true)">Jetzt mit Aufgaben üben</button>`:''}<button class="btn sec2" onclick="go('home',{},true)">Zur Startseite</button>`}
 const c=p.cs[p.i],tp=topic(c.tid);const fr=c.rev?first(c.b):c.f,bk=c.rev?c.f:c.b.split('|').join(' / ');const box=S.cards[c.key]?.b||0;
 return hdr('🧠 '+esc(p.title),p.color,`<span class="pill">${p.i+1}/${p.cs.length}</span>`)+`<div class="prog"><i style="width:${p.i/p.cs.length*100}%"></i></div>
 <div class="card3d"><div class="flip ${p.flip?'on':''}" onclick="view.p.flip=!view.p.flip;render()"><div class="face"><small>${esc(tp?tp.title:'')} · Fach ${box}/5</small>${esc(fr)}<div class="small mut" style="margin-top:14px;font-weight:400">Tippen zum Umdrehen</div></div><div class="face b"><small>Antwort</small>${esc(bk)}</div></div></div>
 ${p.flip?`<div class="row2"><button class="btn no" onclick="cardRate(false)">✗ Noch nicht</button><button class="btn ok" onclick="cardRate(true)">✓ Gewusst</button></div>`:`<button class="btn sec2" onclick="view.p.flip=true;render()">Antwort zeigen</button>`}`;
};
function cardRate(ok){const p=view.p,c=p.cs[p.i];const s=S.cards[c.key]||{b:0};
 if(ok){s.b=Math.min(5,(s.b||0)+1);s.d=today(INT[s.b]);p.ok++;addXP(5)}else{s.b=1;s.d=today(1);p.no++;if(!c.again)p.cs.push({...c,again:true})}
 S.cards[c.key]=s;p.i++;p.flip=false;save();render()}

/* ---------- Test simulieren ---------- */
VIEWS.testsetup=p=>{
 p.s=p.s||'ma';const ts=topicsOf(p.s).filter(t=>(t.tasks&&t.tasks.length)||t.gen||((t.auto||t.vok)&&t.cards.length));
 if(!p.sel||p.selS!==p.s){p.sel=ts.map(t=>t.id);p.selS=p.s}p.n=p.n||15;p.min=p.min??30;
 const hist=S.tests.slice(-5).reverse();
 return hdr('📝 Test simulieren','#38bdf8')+`<p class="small mut">Wie eine echte Arbeit: Du bekommst erst am Ende deine Auswertung und eine Note.</p>
 <div class="sec">Fach</div><div class="chips">${SUBJECTS.filter(s=>topicsOf(s.id).length).map(s=>`<button class="chip ${p.s===s.id?'on':''}" onclick="view.p.s='${s.id}';render()">${s.icon} ${s.name}</button>`).join('')}</div>
 <div class="sec">Themen <button class="pill" onclick="tsAll()">${p.sel.length===ts.length?'keine':'alle'}</button></div><div class="list">${ts.map(t=>`<label class="cb"><input type="checkbox" ${p.sel.includes(t.id)?'checked':''} onchange="tsTog('${t.id}')"><span>${esc(t.title)}</span></label>`).join('')||'<p class="mut">Keine Themen mit Aufgaben.</p>'}</div>
 <div class="sec">Anzahl Aufgaben</div><div class="chips">${[10,15,20,30].map(n=>`<button class="chip ${p.n===n?'on':''}" onclick="view.p.n=${n};render()">${n}</button>`).join('')}</div>
 <div class="sec">Zeit</div><div class="chips">${[0,15,30,45].map(n=>`<button class="chip ${p.min===n?'on':''}" onclick="view.p.min=${n};render()">${n?n+' Min.':'ohne Zeit'}</button>`).join('')}</div>
 <button class="btn" ${p.sel.length?'':'disabled'} onclick="startTest(view.p.sel,view.p.n,view.p.min)">Test starten</button>
 ${hist.length?`<div class="sec">Letzte Tests</div><div class="list">${hist.map(h=>`<div class="item"><b style="font-size:1.4rem;width:34px;text-align:center">${h.g}</b><div class="t">${esc(h.title)}<small>${h.d.split('-').reverse().join('.')} · ${h.r}/${h.n} richtig</small></div></div>`).join('')}</div>`:''}`;
};
function tsTog(id){const p=view.p;p.sel=p.sel.includes(id)?p.sel.filter(x=>x!==id):[...p.sel,id];render()}
function tsAll(){const p=view.p;const ts=topicsOf(p.s).filter(t=>(t.tasks&&t.tasks.length)||t.gen||((t.auto||t.vok)&&t.cards.length));p.sel=p.sel.length===ts.length?[]:ts.map(t=>t.id);render()}
let testT=null;
function startTest(ids,n,min){
 const ts=ids.map(topic).filter(Boolean);if(!ts.length)return;const per=Math.ceil(n/ts.length);
 let tasks=shuffle(ts.flatMap(t=>tasksFor(t,per)));const seen=new Set();tasks=tasks.filter(t=>{const k=tkey(t);if(seen.has(k))return false;seen.add(k);return true}).slice(0,n);
 const sb=subj(ts[0].s);const title=ts.length===1?ts[0].title:sb.name+'-Test';
 go('test',{tasks,ans:[],i:0,start:Date.now(),end:min?Date.now()+min*60000:0,title,color:sb.color,s:ts[0].s});
 clearInterval(testT);testT=setInterval(()=>{if(view.n!=='test'||view.p.fin){clearInterval(testT);return}const p=view.p;const el=$('#tt');const sec=p.end?Math.max(0,Math.round((p.end-Date.now())/1000)):Math.round((Date.now()-p.start)/1000);if(el)el.textContent=(p.end?'⏳ ':'⏱ ')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(p.end&&sec<=0){toast('⏰ Die Zeit ist um!');finishTest()}},500);
}
VIEWS.test=p=>{
 if(p.fin)return testResult(p);
 const t=p.tasks[p.i],tp=topic(t.tid);const done=p.ans.filter(a=>a!=null&&a!=='').length;
 return hdr('📝 '+esc(p.title),p.color,`<span class="pill timer" id="tt">⏱</span>`)+
 `<div class="nav">${p.tasks.map((_,j)=>`<button class="${j===p.i?'cur':''} ${p.ans[j]!=null&&p.ans[j]!==''?'done':''}" onclick="view.p.i=${j};render()">${j+1}</button>`).join('')}</div>
 ${tp&&tp.text?`<details class="text"><summary>Lesetext anzeigen</summary>${tp.text}</details>`:''}
 <div class="q"><span class="k">Aufgabe ${p.i+1} von ${p.tasks.length}</span>${t.q}</div>${answerUI(t,p.ans[p.i],false,true)}
 <div class="row2" style="margin-top:6px"><button class="btn sec2" ${p.i?'':'disabled'} onclick="view.p.i--;render()">← Zurück</button><button class="btn sec2" ${p.i<p.tasks.length-1?'':'disabled'} onclick="view.p.i++;render()">Weiter →</button></div>
 <button class="btn ${p.sure?'no':''}" onclick="finishTest(true)">${p.sure?`Wirklich abgeben? (${done}/${p.tasks.length} beantwortet)`:'Test abgeben'}</button>`;
};
function testAns(j){const p=view.p,t=p.tasks[p.i];p.ans[p.i]=t.t==='m'?t._o[j]:j;p.sure=false;if(t.t!=='i'&&p.i<p.tasks.length-1){render();setTimeout(()=>{if(view.p===p&&!p.fin){p.i++;render()}},250)}else render()}
function testIn(soft){const p=view.p;p.ans[p.i]=$('#ans').value.trim();p.sure=false;if(!soft&&p.i<p.tasks.length-1){p.i++;render()}}
function grade(pct){const k=S.set.keys||[92,81,67,50,30];for(let i=0;i<5;i++)if(pct>=k[i])return i+1;return 6}
function finishTest(ask){const p=view.p;if(ask&&!p.sure){p.sure=true;render();return}
 p.fin=true;clearInterval(testT);p.res=p.tasks.map((t,j)=>check(t,p.ans[j]));p.r=p.res.filter(Boolean).length;p.pct=Math.round(p.r/p.tasks.length*100);p.g=grade(p.pct);p.sec=Math.round((Date.now()-p.start)/1000);
 p.tasks.forEach((t,j)=>{const st=S.tp[t.tid]||(S.tp[t.tid]={});if(p.res[j]){st.r=(st.r||0)+1;delete S.miss[tkey(t)]}else{st.w=(st.w||0)+1;S.miss[tkey(t)]={...t,_o:undefined}}});
 const tids=[...new Set(p.tasks.map(t=>t.tid))];tids.forEach(id=>{const idx=p.tasks.map((t,j)=>t.tid===id?j:-1).filter(j=>j>=0);const pc=Math.round(idx.filter(j=>p.res[j]).length/idx.length*100);const st=S.tp[id];st.sc=st.sc==null?pc:Math.round(st.sc*.5+pc*.5)});
 addXP(p.r*5+20);S.tests.push({d:today(),title:p.title,s:p.s,n:p.tasks.length,r:p.r,g:p.g,sec:p.sec});if(S.tests.length>100)S.tests.shift();save();render();scrollTo(0,0)}
function testResult(p){
 const col=['','#22c55e','#84cc16','#eab308','#f97316','#ef4444','#b91c1c'][p.g];
 return hdr('📝 Auswertung',p.color)+`<p class="center mut" style="margin:0">${esc(p.title)}</p><div class="note" style="color:${col}">${p.g}</div><p class="center"><b>${p.r} von ${p.tasks.length} richtig (${p.pct} %)</b><br><span class="small mut">Zeit: ${Math.floor(p.sec/60)} min ${p.sec%60} s · Note als Richtwert · +${p.r*5+20} XP</span></p>
 <button class="btn" onclick="go('testsetup',{s:'${p.s}'},true)">Neuer Test</button>${p.r<p.tasks.length?`<button class="btn sec2" onclick="missMix()">🔁 Fehler gleich üben</button>`:''}
 <div class="sec">Alle Aufgaben</div>${p.tasks.map((t,j)=>`<div class="rev ${p.res[j]?'ok':'no'}"><div>${j+1}. ${t.q}</div><div class="small" style="margin-top:6px">${p.res[j]?'✅':'❌'} Deine Antwort: <b>${p.ans[j]==null||p.ans[j]===''?'–':esc(t.t==='w'?(p.ans[j]?'Stimmt':'Stimmt nicht'):p.ans[j])}</b>${p.res[j]?'':` · Richtig: <b>${esc(showAns(t))}</b>`}</div>${!p.res[j]&&t.ex?`<div class="small mut" style="margin-top:4px">${t.ex}</div>`:''}</div>`).join('')}`;
}

/* ---------- Eigene Themen ---------- */
VIEWS.edit=p=>{
 if(!p.d){const c=p.id?S.custom.find(x=>x.id===p.id):null;p.d=c?JSON.parse(JSON.stringify(c)):{id:'c_'+Date.now().toString(36),s:'eigen',title:'',kind:'qa',learn:'',la:'Deutsch',lb:'Englisch',cards:[['',''],['',''],['','']]};p.isNew=!c}
 const d=p.d,vok=d.kind==='vok';
 return hdr(p.isNew?'➕ Neues Thema':'✏️ Thema bearbeiten','#ec4899')+`
 <label class="small mut">Titel</label><input value="${esc(d.title)}" placeholder="z. B. Vokabeln Unit 2 oder Musik: Instrumente" oninput="view.p.d.title=this.value">
 <div class="row2" style="margin-top:10px"><div><label class="small mut">Fach</label><select onchange="view.p.d.s=this.value">${SUBJECTS.map(s=>`<option value="${s.id}" ${d.s===s.id?'selected':''}>${s.icon} ${s.name}</option>`).join('')}</select></div>
 <div><label class="small mut">Art</label><select onchange="view.p.d.kind=this.value;render()"><option value="qa" ${!vok?'selected':''}>Frage & Antwort</option><option value="vok" ${vok?'selected':''}>Vokabeln</option></select></div></div>
 ${vok?`<div class="row2" style="margin-top:10px"><div><label class="small mut">Sprache links</label><input value="${esc(d.la)}" oninput="view.p.d.la=this.value"></div><div><label class="small mut">Sprache rechts</label><input value="${esc(d.lb)}" oninput="view.p.d.lb=this.value"></div></div>`:''}
 <label class="small mut" style="display:block;margin-top:10px">Merkwissen (optional – erscheint unter „Lernen“)</label><textarea oninput="view.p.d.learn=this.value" placeholder="Was man sich merken soll …">${esc(d.learn)}</textarea>
 <div class="sec">${vok?'Vokabeln':'Karten'} (${d.cards.filter(c=>c[0]&&c[1]).length})</div>
 <div class="ed small mut"><span>${vok?esc(d.la):'Frage / Begriff'}</span><span>${vok?esc(d.lb):'Antwort'}</span><span></span></div>
 ${d.cards.map((c,i)=>`<div class="ed"><input value="${esc(c[0])}" oninput="view.p.d.cards[${i}][0]=this.value"><input value="${esc(c[1])}" oninput="view.p.d.cards[${i}][1]=this.value"><button onclick="view.p.d.cards.splice(${i},1);render()" aria-label="Löschen">🗑</button></div>`).join('')}
 <button class="btn sec2" onclick="view.p.d.cards.push(['','']);render()">+ Zeile</button>
 <details style="margin-top:10px"><summary class="small mut">Viele auf einmal einfügen</summary><p class="small mut">Eine Zeile pro Karte, getrennt mit = oder ; oder Tab.<br>Beispiel: <i>der Hund = dog</i>. Mehrere richtige Antworten mit | trennen: <i>Radiergummi = rubber|eraser</i></p><textarea id="bulk" placeholder="Wort = Übersetzung"></textarea><button class="btn sec2" onclick="bulkAdd()">Übernehmen</button></details>
 <p class="small mut">Tipp: Für Übungs- und Testaufgaben mit Auswahlantworten brauchst du mindestens 4 Karten.</p>
 <button class="btn" onclick="saveCustom()">💾 Speichern</button>${p.isNew?'':`<button class="btn ${p.del?'no':'sec2'}" onclick="delCustom()">${p.del?'Wirklich löschen?':'🗑 Thema löschen'}</button>`}`;
};
function bulkAdd(){const d=view.p.d;const lines=$('#bulk').value.split('\n').map(l=>l.split(/\s*(?:=|;|\t)\s*/)).filter(x=>x.length>=2&&x[0].trim()&&x[1].trim());d.cards=d.cards.filter(c=>c[0]||c[1]).concat(lines.map(x=>[x[0].trim(),x.slice(1).join(' ').trim()]));toast(lines.length+' Karten übernommen');render()}
function saveCustom(){const p=view.p,d=p.d;d.title=d.title.trim();d.cards=d.cards.map(c=>[c[0].trim(),c[1].trim()]).filter(c=>c[0]&&c[1]);if(!d.title){toast('Bitte einen Titel eingeben.');return}if(!d.cards.length&&!d.learn.trim()){toast('Bitte mindestens eine Karte oder Merkwissen eingeben.');return}
 const i=S.custom.findIndex(x=>x.id===d.id);if(i>=0)S.custom[i]=d;else S.custom.push(d);save();toast('Gespeichert ✓');go('topic',{id:d.id},true)}
function delCustom(){const p=view.p;if(!p.del){p.del=true;render();return}S.custom=S.custom.filter(x=>x.id!==p.d.id);Object.keys(S.cards).forEach(k=>{if(k.startsWith(p.d.id+'|'))delete S.cards[k]});delete S.tp[p.d.id];save();toast('Gelöscht');go('subject',{s:'eigen'},true)}

/* ---------- PIN (Gerät mit dem Server verbinden) ---------- */
VIEWS.pin=p=>{p.v=p.v||'';return `<div style="padding-top:40px" class="center"><div class="big">🔐</div><h2>Lernbasis</h2><p class="mut">${SYNC.setup?'<b>Erster Start:</b> Lege jetzt einen 4-stelligen Code fest. Diesen Code gibst du später auf jedem Gerät ein.':'Gib deinen Code ein, damit dein Fortschritt auf Handy und Tablet gleich ist.'}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<p.v.length?'f':''}"></i>`).join('')}</div>${p.err?`<p style="color:var(--bad)">${p.err}</p>`:''}<div class="pinpad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div></div>`};
async function pinKey(k){const p=view.p;p.err='';if(k==='⌫')p.v=p.v.slice(0,-1);else if(k==='✓'||p.v.length>=4){}else p.v+=k;render();
 if(p.v.length===4||k==='✓'){try{const j=await api('load',{pin:p.v});if(j.err){p.err=j.err==='warten'?'Zu viele Versuche – bitte 10 Minuten warten.':'Falscher Code.';p.v='';render();return}SYNC.setup=false;SYNC.pin=p.v;lsSet(LSPIN,p.v);const st=j.state;if(st&&st.updated>S.updated){S=fix(st);lsSet(LS,JSON.stringify(S))}else await push();SYNC.st='ok';go('home',{},true)}catch(e){p.err='Keine Verbindung.';p.v='';render()}}}

/* ---------- Eltern-Bereich ---------- */
VIEWS.eltern=p=>{
 if(!p.ok){p.v=p.v||'';return hdr('👩‍👦 Eltern-Bereich','#64748b')+`<p class="center mut">Eltern-PIN eingeben</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<p.v.length?'f':''}"></i>`).join('')}</div>${p.err?`<p class="center" style="color:var(--bad)">${p.err}</p>`:''}<div class="pinpad">${[1,2,3,4,5,6,7,8,9,'⌫',0,''].map(k=>`<button onclick="epin('${k}')">${k}</button>`).join('')}</div>${S.set.ppin==='0000'?'<p class="center small mut">Standard-PIN: 0000 – bitte danach ändern.</p>':''}`}
 const rows=SUBJECTS.map(s=>{const ts=topicsOf(s.id);let r=0,w=0;ts.forEach(t=>{r+=S.tp[t.id]?.r||0;w+=S.tp[t.id]?.w||0});const sc=ts.map(t=>topicScore(t.id)).filter(x=>x!=null);return `<tr><td>${s.icon} ${s.name}</td><td>${r+w}</td><td>${r+w?Math.round(r/(r+w)*100)+' %':'–'}</td><td>${sc.length}/${ts.length}</td></tr>`}).join('');
 const days=Array.from({length:14},(_,i)=>today(i-13));const mx=Math.max(30,...days.map(d=>S.days[d]||0));
 const weak=allTopics().filter(t=>topicScore(t.id)!=null).sort((a,b)=>topicScore(a.id)-topicScore(b.id)).slice(0,5);
 const k=S.set.keys;
 return hdr('👩‍👦 Eltern-Bereich','#64748b')+`
 <div class="sec">Aktivität (14 Tage, XP pro Tag)</div><div style="display:flex;gap:4px;align-items:flex-end;height:80px;background:var(--card);border-radius:14px;padding:10px">${days.map(d=>`<div title="${d}: ${S.days[d]||0} XP" style="flex:1;background:${(S.days[d]||0)>=S.set.goal?'#22c55e':'#38bdf8'};opacity:${S.days[d]?1:.15};height:${Math.max(4,(S.days[d]||0)/mx*100)}%;border-radius:4px"></div>`).join('')}</div>
 <p class="small mut">Serie: ${streak()} Tage · Gesamt: ${S.xp} XP · Level ${lvl().l}</p>
 <div class="sec">Fächer</div><table class="st"><tr><th>Fach</th><th>Aufg.</th><th>richtig</th><th>Themen</th></tr>${rows}</table>
 ${weak.length?`<div class="sec">Unsicherste Themen</div>${weak.map(t=>`<div class="small">${subj(t.s).icon} ${esc(t.title)} – <b>${topicScore(t.id)} %</b></div>`).join('')}`:''}
 <div class="sec">Letzte Tests</div>${S.tests.length?`<table class="st"><tr><th>Datum</th><th>Test</th><th>Erg.</th><th>Note</th></tr>${S.tests.slice(-10).reverse().map(h=>`<tr><td>${h.d.slice(5).split('-').reverse().join('.')}</td><td>${esc(h.title)}</td><td>${h.r}/${h.n}</td><td><b>${h.g}</b></td></tr>`).join('')}</table>`:'<p class="small mut">Noch keine Tests.</p>'}
 <div class="sec">Einstellungen</div>
 <label class="small mut">Name des Kindes</label><input value="${esc(S.name)}" onchange="S.name=this.value.trim()||'Henry';save()">
 <div class="row2" style="margin-top:8px"><div><label class="small mut">Tagesziel (XP)</label><input type="number" inputmode="numeric" value="${S.set.goal}" onchange="S.set.goal=Math.max(10,+this.value||60);save()"></div><div><label class="small mut">Eltern-PIN (4 Ziffern)</label><input inputmode="numeric" maxlength="4" value="${esc(S.set.ppin)}" onchange="if(/^\\d{4}$/.test(this.value)){S.set.ppin=this.value;save();toast('PIN geändert')}else toast('Bitte 4 Ziffern')"></div></div>
 <label class="small mut" style="display:block;margin-top:8px">Notenschlüssel (ab … % für Note 1 bis 5, darunter 6)</label><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${k.map((v,i)=>`<input type="number" inputmode="numeric" value="${v}" title="Note ${i+1}" onchange="S.set.keys[${i}]=+this.value;save()">`).join('')}</div>
 <div class="sec">Daten</div><p class="small mut">${SYNC.on?(SYNC.pin?'☁️ Fortschritt wird über den Leuchtturm zwischen allen Geräten synchronisiert.':'Server erreichbar, Gerät noch nicht verbunden.'):'📱 Fortschritt wird nur auf diesem Gerät gespeichert.'}</p>
 <div class="row2"><button class="btn sec2" onclick="exportData()">⬇️ Sicherung</button><label class="btn sec2" style="cursor:pointer">⬆️ Laden<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label></div>
 ${SYNC.on&&SYNC.pin?`<button class="btn sec2" onclick="lsDel(LSPIN);SYNC.pin=null;go('pin',{},true)">Gerät abmelden</button>`:''}
 <button class="btn ${p.rs?'no':'sec2'}" onclick="resetAll()">${p.rs?'Wirklich ALLES zurücksetzen?':'Fortschritt zurücksetzen'}</button>
 <p class="small mut center" style="margin-top:20px">Inhalte orientiert am Fachlehrplan Gymnasium Sachsen-Anhalt (Schuljahrgänge 5/6).</p>`;
};
function epin(k){const p=view.p;p.err='';if(k==='⌫')p.v=p.v.slice(0,-1);else if(k!==''&&p.v.length<4)p.v+=k;if(p.v.length===4){if(p.v===S.set.ppin)p.ok=true;else{p.err='Falsche PIN';p.v=''}}render()}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lernbasis-sicherung-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.xp!=='number')throw 0;S=fix(j);save();toast('Sicherung geladen ✓');render()}catch(e){toast('Datei konnte nicht gelesen werden.')}};r.readAsText(f)}
function resetAll(){const p=view.p;if(!p.rs){p.rs=true;render();return}const keep={name:S.name,set:S.set,custom:S.custom};S=fix(keep);save();toast('Zurückgesetzt');go('home',{},true)}

/* ---------- Start ---------- */
try{history.replaceState({n:'home',p:{}},'')}catch(e){}
render();syncInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
</body>
</html>
