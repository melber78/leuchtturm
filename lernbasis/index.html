addAfter('geo-europa',{id:'geo-europa2',s:'geo',title:'Europa: Landschaften, Klima & Vulkane',k6:true,
 learn:[['Klimazonen','Von Nord nach Süd: <b>polar</b> – <b>subpolar</b> – <b>gemäßigt</b> (Deutschland) – <b>subtropisch</b> (Mittelmeer: heiße, trockene Sommer, milde, feuchte Winter).'],['Vegetationszonen','Tundra (Moose, Flechten) – Nadelwald (Taiga) – Laub- und Mischwald – Hartlaubvegetation am Mittelmeer (Olive, Korkeiche)'],['Gletscher formen Landschaft','<b>Fjord</b>: vom Gletscher ausgeschürftes, vom Meer überflutetes Tal (Norwegen). <b>Glaziale Serie</b>: Grundmoräne – Endmoräne – Sander – Urstromtal (Norddeutschland).'],['Gebirge & Vulkane','<b>Alpen</b> = junges <b>Faltengebirge</b>, höchster Berg: Montblanc (über 4 800 m). Vulkane: <b>Ätna</b> (Sizilien), <b>Vesuv</b> (bei Neapel), viele auf <b>Island</b>.'],['Metropolen','Große Städte mit Bedeutung für Wirtschaft und Kultur: London, Paris, Moskau, Berlin.']],
 cards:[['Fjord','vom Gletscher geformtes, vom Meer überflutetes Tal'],['Klimazone Deutschlands','gemäßigte Zone'],['Mittelmeerklima','heiße, trockene Sommer – milde, feuchte Winter'],['Alpen – Gebirgsart','Faltengebirge'],['höchster Berg der Alpen','Montblanc'],['aktiver Vulkan auf Sizilien','Ätna'],['Vulkan bei Neapel','Vesuv'],['Taiga','Nadelwaldzone'],['Urstromtal','breites Tal, in dem Schmelzwasser der Gletscher abfloss']],
 tasks:[['m','Wo findet man besonders viele Fjorde?',['in Norwegen','in Italien','in Spanien','in Ungarn'],'Gletscher der Eiszeit haben die Täler geformt.'],['m','Wie ist das Klima am Mittelmeer?',['heiße, trockene Sommer und milde, feuchte Winter','kalte Sommer und heiße Winter','das ganze Jahr Regen','das ganze Jahr Frost'],'Subtropisches Klima.'],['m','Welche Pflanze ist typisch für das Mittelmeergebiet?',['Olivenbaum','Fichte','Birke','Moos und Flechten'],'Hartlaubgewächse halten Trockenheit aus.'],['m','Was ist ein Faltengebirge?',['ein Gebirge, das durch Zusammenschieben von Gesteinsschichten entstand','ein Gebirge aus Vulkanen','ein Gebirge aus Sanddünen','ein Gebirge, das durch Gletscher entstand'],'z. B. Alpen.'],['m','Welche Insel hat besonders viele Vulkane?',['Island','Irland','Sardinien','Rügen'],'Island liegt auf einer Plattengrenze.'],['m','In welcher Klimazone liegt Deutschland?',['gemäßigte Zone','subtropische Zone','polare Zone','tropische Zone'],'Vier deutliche Jahreszeiten.']]});
addAfter('ge-antike',{id:'ge-mittelmeer',s:'ge',title:'Byzanz, Islam & Frankenreich',k6:true,
 learn:[['Teilung des Römischen Reiches','395 n. Chr. wurde das Reich geteilt. Das <b>Weströmische Reich</b> ging 476 unter. Das <b>Oströmische (Byzantinische) Reich</b> mit der Hauptstadt <b>Konstantinopel</b> (heute Istanbul) bestand bis 1453.'],['Islam','Der Prophet <b>Mohammed</b> verkündete in Mekka den Islam. 622 zog er nach Medina – die <b>Hedschra</b>, Beginn der islamischen Zeitrechnung. Der Islam breitete sich bis nach Spanien aus.'],['Frankenreich','<b>Chlodwig</b> (um 500) einte die Franken und ließ sich taufen. <b>Karl der Große</b> wurde im Jahr <b>800</b> in Rom zum Kaiser gekrönt. Seine Lieblingspfalz war Aachen.'],['Dreiteilung','Nach Rom gab es rund ums Mittelmeer drei große Kulturräume: Byzanz, die islamische Welt und das christliche Abendland (Frankenreich).']],
 cards:[['Hauptstadt von Byzanz','Konstantinopel (heute Istanbul)'],['Untergang Westroms','476'],['Hedschra','Mohammeds Auszug nach Medina 622'],['Kaiserkrönung Karls des Großen','800 in Rom'],['erster bedeutender Frankenkönig','Chlodwig'],['Lieblingspfalz Karls des Großen','Aachen']],
 tasks:[['m','Wie hieß die Hauptstadt des Byzantinischen Reiches?',['Konstantinopel','Rom','Aachen','Mekka'],'Heute Istanbul.'],['m','Was geschah im Jahr 800?',['Karl der Große wurde Kaiser.','Westrom ging unter.','Mohammed zog nach Medina.','Rom wurde gegründet.'],'Kaiserkrönung in Rom.'],['m','Was bezeichnet die Hedschra?',['Mohammeds Auszug von Mekka nach Medina','die Taufe Chlodwigs','die Teilung des Römischen Reiches','den Bau der Hagia Sophia'],'622 – Beginn der islamischen Zeitrechnung.'],['m','Welches Reich bestand am längsten?',['das Byzantinische Reich','das Weströmische Reich','das Frankenreich Chlodwigs','das Reich Karls des Großen'],'Bis 1453.']]});
addAfter('ge-mittelmeer',{id:'ge-ottonen',s:'ge',title:'Könige und Kaiser: Otto der Große',k6:true,
 learn:[['Otto I.','936 in Aachen zum König gekrönt. 955 siegte er auf dem <b>Lechfeld</b> über die Ungarn. 962 wurde er in Rom zum <b>Kaiser</b> gekrönt. Er gründete 968 das Erzbistum <b>Magdeburg</b> und liegt im <b>Magdeburger Dom</b> begraben.'],['Herrschaft von Gottes Gnaden','Der König galt als von Gott eingesetzt (<b>Gottesgnadentum</b>). Bei der Krönung wurde er mit heiligem Öl <b>gesalbt</b>. Zeichen der Macht (<b>Reichsinsignien</b>): Krone, Zepter, Reichsapfel, Reichsschwert.'],['Reisekönigtum','Es gab keine Hauptstadt. Der König zog mit seinem Hof von <b>Pfalz</b> zu Pfalz, um überall zu herrschen und Recht zu sprechen. Pfalzen in Sachsen-Anhalt: Memleben, Quedlinburg, Tilleda.']],
 cards:[['Kaiserkrönung Ottos I.','962 in Rom'],['Schlacht auf dem Lechfeld','955 – Sieg über die Ungarn'],['Wo ist Otto I. begraben?','im Magdeburger Dom'],['Gottesgnadentum','der König gilt als von Gott eingesetzt'],['Reichsinsignien','Krone, Zepter, Reichsapfel, Reichsschwert'],['Pfalz','Burg/Hof, in dem der reisende König wohnte'],['Pfalzen in Sachsen-Anhalt','Memleben, Quedlinburg, Tilleda']],
 tasks:[['m','Warum reiste der König ständig durch sein Reich?',['Es gab keine Hauptstadt – er musste überall selbst herrschen und Recht sprechen.','Er hatte kein eigenes Haus.','Er wollte fremde Länder kennenlernen.','Die Pfalzen mussten jedes Jahr neu gebaut werden.'],'Reisekönigtum.'],['m','Wo liegt Otto der Große begraben?',['im Magdeburger Dom','im Aachener Dom','im Petersdom in Rom','in Quedlinburg'],'Magdeburg war ihm besonders wichtig.'],['m','Was gehört NICHT zu den Reichsinsignien?',['der Bischofsstab','die Krone','der Reichsapfel','das Zepter'],'Der Bischofsstab gehört zu Bischöfen.'],['m','Was bedeutet „Gottesgnadentum“?',['Der König gilt als von Gott eingesetzt.','Der König wählt den Papst.','Alle Menschen sind vor Gott gleich.','Der König darf keine Kriege führen.'],'Darum wurde er gesalbt.']]});
addAfter('ge-ottonen',{id:'ge-lehnswesen',s:'ge',title:'Lehnswesen & Grundherrschaft',k6:true,
 learn:[['Lehnswesen','Der König (<b>Lehnsherr</b>) gab Land (<b>Lehen</b>) an Adlige und Bischöfe (<b>Vasallen</b>). Diese schworen dafür <b>Treue</b> und leisteten Kriegsdienst und Rat. Kronvasallen gaben Teile weiter an Untervasallen.'],['Grundherrschaft','Der <b>Grundherr</b> (Adliger oder Kloster) besaß das Land. Die Bauern (<b>Hörige</b>) bekamen Schutz und Land, mussten aber <b>Abgaben</b> leisten (z. B. den Zehnt) und <b>Frondienste</b> auf den Feldern des Herrn verrichten. <b>Leibeigene</b> waren persönlich unfrei.'],['Dreifelderwirtschaft','Das Ackerland wurde dreigeteilt: Wintergetreide – Sommergetreide – <b>Brache</b> (Erholung). Jedes Jahr wurde gewechselt. So gab es mehr Ertrag.'],['Kloster','Mönche lebten nach der Regel des heiligen Benedikt: „<b>ora et labora</b>“ – bete und arbeite. Klöster waren Orte der Bildung, Landwirtschaft und Heilkunde.']],
 cards:[['Vasall','Lehnsmann, der Land vom Lehnsherrn erhält'],['Lehen','geliehenes Land'],['Pflichten des Vasallen','Treue, Kriegsdienst, Rat'],['Frondienst','Arbeit auf den Feldern des Grundherrn'],['der Zehnt','Abgabe: der zehnte Teil der Ernte'],['Brache','Feld, das ein Jahr lang nicht bestellt wird'],['ora et labora','bete und arbeite – Regel des Benedikt']],
 tasks:[['m','Was bekam ein Vasall vom König?',['ein Lehen (Land)','einen Lohn in Gold','einen Platz im Kloster','die Königskrone'],'Dafür schuldete er Treue und Kriegsdienst.'],['m','Was war ein Frondienst?',['Arbeit auf den Feldern des Grundherrn','ein Gottesdienst im Kloster','ein Kriegszug des Königs','eine Steuer für Händler'],'Hörige mussten für den Herrn arbeiten.'],['m','Warum ließ man bei der Dreifelderwirtschaft ein Feld brach liegen?',['damit sich der Boden erholen konnte','weil es zu wenig Bauern gab','weil dort Vieh verboten war','weil der König es so wollte'],'Mehr Ertrag in den folgenden Jahren.'],['m','Was bedeutet „ora et labora“?',['bete und arbeite','lies und schreibe','kämpfe und siege','höre und schweige'],'Benediktsregel.'],['m','Wer stand im Lehnswesen ganz oben?',['der König','die Bauern','die Untervasallen','die Hörigen'],'Lehnspyramide.']]});
addAfter('ge-lehnswesen',{id:'ge-stadt',s:'ge',title:'Die Stadt im Mittelalter',k6:true,
 learn:[['Warum in die Stadt?','„<b>Stadtluft macht frei</b>“: Wer ein Jahr und einen Tag in der Stadt lebte, wurde frei vom Grundherrn. In der Stadt gab es Handel, Handwerk und Schutz durch die <b>Stadtmauer</b>.'],['Rechte der Stadt','<b>Stadtrecht</b> (eigene Gesetze, eigenes Gericht), <b>Marktrecht</b>, <b>Zollrecht</b>, <b>Münzrecht</b>. Das <b>Magdeburger Recht</b> wurde Vorbild für hunderte Städte in Mittel- und Osteuropa.'],['Wer lebte in der Stadt?','<b>Patrizier</b> (reiche Kaufleute, regierten im Rat) · <b>Handwerker</b> (in <b>Zünften</b> organisiert) · Mägde, Knechte, Tagelöhner, Bettler (Unterschichten)'],['Die Hanse','Bund von Kaufleuten und Städten (z. B. Lübeck, Hamburg, auch Magdeburg und Halle) zum gemeinsamen Handel. Wichtigstes Schiff: die <b>Kogge</b>.'],['Roland','Steinfigur eines Ritters auf dem Marktplatz, Zeichen für Stadtrechte und Freiheit, z. B. in Halle und Zerbst.']],
 cards:[['Stadtluft macht frei','nach einem Jahr und einem Tag frei vom Grundherrn'],['Zunft','Zusammenschluss der Handwerker eines Berufs'],['Patrizier','reiche Oberschicht, regierte im Stadtrat'],['Hanse','Bund von Kaufleuten und Städten für den Handel'],['Kogge','Handelsschiff der Hanse'],['Magdeburger Recht','Stadtrecht, Vorbild für viele Städte in Osteuropa'],['Roland','Steinfigur auf dem Markt als Zeichen der Stadtrechte']],
 tasks:[['m','Was bedeutete „Stadtluft macht frei“?',['Nach einem Jahr und einem Tag in der Stadt war man frei vom Grundherrn.','In der Stadt war die Luft sauberer als auf dem Land.','Stadtbewohner mussten keine Steuern zahlen.','Jeder durfte die Stadt jederzeit verlassen.'],'Darum zogen viele Hörige in die Städte.'],['m','Was war eine Zunft?',['ein Zusammenschluss von Handwerkern eines Berufs','ein Stadttor','ein Handelsschiff','eine Abgabe an den König'],'Die Zunft regelte Preise, Ausbildung und Qualität.'],['m','Wofür war das Magdeburger Recht bekannt?',['Es wurde Vorbild für viele Städte in Mittel- und Osteuropa.','Es verbot den Handel mit anderen Städten.','Es galt nur für Bischöfe.','Es schaffte die Stadtmauern ab.'],'Hunderte Städte übernahmen es.'],['m','Wozu schlossen sich Städte zur Hanse zusammen?',['um gemeinsam sicherer und erfolgreicher Handel zu treiben','um einen eigenen König zu wählen','um Klöster zu bauen','um Ritterturniere zu veranstalten'],'Handelsbund im Nord- und Ostseeraum.'],['m','Wer regierte meist im Stadtrat?',['die Patrizier','die Tagelöhner','die Hörigen','die Bettler'],'Reiche Kaufmannsfamilien.']]});

{id:'rel-at',s:'rel',title:'Abraham & Mose',

{id:'rel-jesus',s:'rel',title:'Jesus von Nazaret',

function fix(o){const d=defState();if(o&&o.miss)Object.keys(o.miss).forEach(k=>{if(/^\d+ · \d+ − \d+ : \d+ =#/.test(k))delete o.miss[k]});o=Object.assign(d,o||{});o.set=Object.assign(defState().set,o.set||{});if(!Array.isArray(o.set.keys)||o.set.keys.length!==5||o.set.keys.join()==='92,81,67,50,30')o.set.keys=[93,75,60,40,20];['days','tp','cards','miss','done','badges'].forEach(k=>{if(!o[k]||typeof o[k]!=='object')o[k]={}});['tests','custom','redeem','rewards'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});o.st=Object.assign(defState().st,o.st||{});o.owned=Object.assign(defState().owned,o.owned||{});return o}

const SYNC={on:false,pin:lsGet(LSPIN),st:'lokal'};
async function api(a,body){const r=await fetch('api.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});return r.json()}
async function syncInit(){
 try{const r=await fetch('api.php?a=ping',{cache:'no-store'});const j=await r.json();SYNC.on=!!(j&&j.ok);SYNC.setup=!!(j&&j.setup)}catch(e){SYNC.on=false}
 if(!SYNC.on){render();return}
 if(!SYNC.pin){go('pin',{},true);return}
 await pull();render();
}
async function pull(){
 try{const j=await api('load',{pin:SYNC.pin});
  if(j.err==='pin'){lsDel(LSPIN);SYNC.pin=null;go('pin',{},true);return}
  const st=j.state;
  if(st&&st.updated>S.updated){S=fix(st);lsSet(LS,JSON.stringify(S))}
  else if(S.updated>(st?st.updated:0))await push();
  SYNC.st='ok';
 }catch(e){SYNC.st='offline'}
}
async function push(){try{const j=await api('save',{pin:SYNC.pin,state:S});SYNC.st=j.ok?'ok':'fehler'}catch(e){SYNC.st='offline'}}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&SYNC.on&&SYNC.pin&&!['quiz','test','cards','blitz'].includes(view.n)){const u=S.updated;await pull();if(S.updated!==u)render()}});

function normTask(t,tid){if(!Array.isArray(t))return {...t,tid};const [k,q,a,ex,o]=t;return {t:k==='m'?'m':k==='w'?'w':'i',q,a,ex,cs:o==='cs',tid}}
function cardTasks(tp){
 const c=tp.cards||[],out=[];if(!c.length)return out;
 const backs=c.map(x=>first(x[1])),fronts=c.map(x=>x[0]);
 c.forEach(([f,b],i)=>{
  const others=shuffle([...new Set(backs)].filter(x=>x!==backs[i])).slice(0,3);
  if(tp.vok){
   const fa=f.replace(/^(der|die|das) /i,'');
   out.push({t:'i',q:`<span class="k">Übersetze ins ${tp.lb||'Englische'}</span><b>${esc(f)}</b>`,a:b,ex:`${esc(f)} = ${esc(b.split('|').join(' / '))}`,tid:tp.id});
   out.push({t:'i',q:`<span class="k">Was heißt auf ${tp.la||'Deutsch'}?</span><b>${esc(first(b))}</b>`,a:f+'|'+fa,ex:`${esc(first(b))} = ${esc(f)}`,tid:tp.id});
   if(others.length>=3)out.push({t:'m',q:`<span class="k">Was passt?</span><b>${esc(f)}</b>`,a:[first(b),...others],ex:`${esc(f)} = ${esc(first(b))}`,tid:tp.id});
  }else{
   if(/___/.test(f)){out.push({t:'i',q:`<span class="k">Setze ein</span>${esc(f).replace('___','<b>___</b>')}`,a:b,ex:esc(f.replace('___',first(b))),tid:tp.id});return}
   const others2=shuffle([...new Set(c.filter(x=>!/___/.test(x[0])).map(x=>first(x[1])))].filter(x=>x!==first(b))).slice(0,3);
   const q=tp.id==='geo-laender'?`Wie heißt die Hauptstadt von <b>${esc(f)}</b>?`:`<span class="k">Was passt?</span>${esc(f)}`;
   if(others2.length>=2){out.push({t:'m',q,a:[first(b),...others2],ex:`${esc(f)} → ${esc(first(b))}`,tid:tp.id});return}
   out.push({t:'i',q,a:b,ex:`${esc(f)} → ${esc(first(b))}`,tid:tp.id});
  }
 });return out;
}
const tkey=t=>t.q+'#'+(Array.isArray(t.a)?t.a[0]:t.a);
function ordered(list){const miss=[],fresh=[],done=[];list.forEach(t=>{const k=tkey(t);if(S.miss[k])miss.push(t);else if(S.done[k])done.push(t);else fresh.push(t)});done.sort((x,y)=>S.done[tkey(x)]-S.done[tkey(y)]);return {list:shuffle(miss).concat(shuffle(fresh)).concat(done),nNew:miss.length+fresh.length}}
function genFresh(tp,seen){let t;for(let i=0;i<15;i++){t={...GEN[tp.gen](),tid:tp.id};const k=tkey(t);if(!S.done[k]&&!seen.has(k))break}seen.add(tkey(t));return t}
/* Mischung: ca. 1/3 Theorie, 2/3 Anwendung. Neue und falsche Aufgaben zuerst, richtig gelöste erst, wenn nichts Neues mehr da ist. */
function tasksFor(tp,n,thN){
 const seen=new Set();
 const th=ordered((tp.th||[]).map(x=>({...normTask(x,tp.id),th:true})));
 let ap=(tp.tasks||[]).map(x=>normTask(x,tp.id));if(tp.auto||tp.vok)ap=ap.concat(cardTasks(tp));
 const apO=ordered(ap);
 if(!tp.gen&&thN==null){const fr=th.nNew+apO.nNew;if(fr>=4&&fr<n)n=fr;else if(fr<4&&(th.list.length+apO.list.length)>=4)tp._again=true}
 let nTh=thN!=null?thN:(th.list.length?Math.round(n*(tp.thShare||1/3)):0);
 if(tp.gen&&nTh>th.nNew)nTh=th.nNew;
 nTh=Math.min(nTh,th.list.length,n);
 const out=th.list.slice(0,nTh);
 const rest=n-out.length;let nStat=rest,gn=0;
 if(tp.gen){gn=apO.list.length?Math.round(rest*(tp.genShare||.7)):rest;nStat=rest-gn;if(nStat>apO.nNew){gn+=nStat-apO.nNew;nStat=apO.nNew}}
 out.push(...apO.list.slice(0,nStat));
 for(let i=0;i<gn;i++)out.push(genFresh(tp,seen));
 if(out.length<n)out.push(...th.list.slice(nTh,nTh+n-out.length));
 const isD=t=>!!S.done[tkey(t)]&&!S.miss[tkey(t)];const used=new Set(out.map(tkey));
 const spare=[...th.list,...apO.list].filter(t=>!isD(t)&&!used.has(tkey(t)));
 for(let i=0;i<out.length&&spare.length;i++)if(isD(out[i]))out[i]=spare.shift();
 return shuffle(out);
}
function cardsOf(tp){return (tp.cards||[]).map(([f,b])=>({key:tp.id+'|'+f,f,b,tid:tp.id,vok:tp.vok}))}

/* ---------- Antworten prüfen ---------- */
function norm(s,cs){s=String(s).replace(/[’‘`´]/g,"'").replace(/[„“”"]/g,'').replace(/\s+/g,' ').trim().replace(/[.!]+$/,'');return cs?s:s.toLowerCase()}
const isNum=s=>/^-?\d+([.,]\d+)?$/.test(String(s).replace(/[\s ]/g,''));
function toNum(s){s=String(s).replace(/[\s ]/g,'').replace('−','-');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+/.test(s))s=s.replace(/\./g,'');const m=s.match(/^-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
function check(t,v){
 if(v==null||v==='')return false;
 if(t.t==='m')return v===t.a[0];
 if(t.t==='w')return v===t.a;
 return String(t.a).split('|').some(a=>{
  if(isNum(a))return toNum(v)===toNum(a);
  if(/^\d+\/\d+$/.test(a))return String(v).replace(/\s/g,'')===a;
  return norm(v,t.cs)===norm(a,t.cs);
 });
}
const showAns=t=>{if(t.t==='m')return t.a[0];if(t.t==='w')return t.a?'Stimmt':'Stimmt nicht';const a=first(t.a);return isNum(a)&&Number.isInteger(toNum(a))?fmt(toNum(a)):a};

function startQuiz(id,rep){const t=topic(id);t._again=false;const tasks=tasksFor(t,10);if(t._again)setTimeout(()=>toast('🏁 Alle Aufgaben dieses Themas geschafft – jetzt kommt die Wiederholung!'),300);go('quiz',{x0:S.xp,title:t.title,color:subj(t.s).color,tasks,i:0,r:0,w:0,xp:0,retry:[],phase:1,tid:id,text:t.text},rep)}

VIEWS.quiz=p=>{
 if(p.i>=p.tasks.length)return quizEnd(p);
 const t=p.tasks[p.i];const pct=Math.round(p.i/p.tasks.length*100);const tp=topic(t.tid);
 let h=hdr(esc(p.title),p.color,`<span class="pill">${p.i+1}/${p.tasks.length}</span>`)+`<div class="prog"><i style="width:${pct}%"></i></div>`;
 if(p.phase===2)h+=`<p class="small" style="color:var(--warn)">🔁 Fehler-Runde: Versuch es noch einmal!</p>`;
 if(tp&&tp.text)h+=`<details class="text"${p.i===0?' open':''}><summary>Lesetext anzeigen</summary>${tp.text}</details>`;
 h+=`<div class="q">${t.q}</div>`+answerUI(t,p.ans,p.done);
 if(p.done){const ok=p.ok;h+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ '+PRAISE[p.i%PRAISE.length]:'❌ '+OOPS[p.i%OOPS.length]+' Richtig ist: '+esc(showAns(t))}</b>${t.ex?`<div class="small">${t.ex}</div>`:''}${ok&&p.cmsg?`<div class="combo">${p.cmsg}</div>`:''}</div><button class="btn" id="nx" onclick="quizNext()" autofocus>Weiter →</button>`}
 return h;
};
function answerUI(t,ans,done,testMode){
 if(t.col)return colUI(t,done,testMode);
 return answerUI0(t,ans,done,testMode)+paperUI(t);
}
function answerUI0(t,ans,done,testMode){
 if(t.t==='m'){if(!t._o)t._o=shuffle(t.a);return `<div class="opts">${t._o.map((o,j)=>{let c='';if(done){if(o===t.a[0])c='ok';else if(o===ans)c='no'}else if(testMode&&o===ans)c='sel';return `<button class="opt ${c}" ${done?'disabled':''} onclick="${testMode?'testAns':'quizAns'}(${j})">${o}</button>`}).join('')}</div>`}
 if(t.t==='w'){return `<div class="tf">${[true,false].map(v=>{let c='';if(done){if(v===t.a)c='ok';else if(v===ans)c='no'}else if(testMode&&v===ans)c='sel';return `<button class="opt ${c}" style="text-align:center" ${done?'disabled':''} onclick="${testMode?'testAns':'quizAns'}(${v})">${v?'👍 Stimmt':'👎 Stimmt nicht'}</button>`}).join('')}</div>`}
 const num=isNum(first(t.a));
 return `<div style="display:flex;gap:8px;align-items:center"><input id="ans" ${done?'disabled':''} value="${esc(ans||'')}" ${num?'inputmode="decimal"':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Deine Antwort" ${!done&&!view.p.paper?'autofocus':''} onkeydown="if(event.key==='Enter'){${testMode?'testIn()':'quizIn()'}}" ${testMode?'oninput="testIn(true)"':''}>${t.u?`<b>${t.u}</b>`:''}</div>${done||testMode?'':'<button class="btn" onclick="quizIn()">Prüfen</button>'}`;
}
function quizIn(){const t=view.p.tasks[view.p.i];const v=t.col?colVal(t):$('#ans').value.trim();if(t.col&&v==='?'){toast('Da fehlt noch eine Ziffer im Ergebnis.');return}if(!v){toast('Gib zuerst eine Antwort ein.');return}quizAns(v,true)}
function quizAns(j,raw){
 const p=view.p;if(p.done)return;const t=p.tasks[p.i];let v=raw?j:(t.t==='m'?t._o[j]:j);
 const ok=check(t,v);p.ans=v;p.done=true;p.ok=ok;const k=tkey(t);
 const st=S.tp[t.tid]||(S.tp[t.tid]={});
 if(ok){p.r++;st.r=(st.r||0)+1;S.st.right++;if(S.miss[k])S.st.fixed++;const wasDone=!!S.done[k];S.done[k]=Date.now();const x=p.phase===2||wasDone?1:3;p.xp+=x;addXP(x);delete S.miss[k];p.combo=(p.combo||0)+1;if(p.combo>S.st.combo)S.st.combo=p.combo;if([5,10,20].includes(p.combo)){const b={5:3,10:5,20:10}[p.combo];p.xp+=b;addXP(b);p.cmsg=`🔥 ${p.combo}er-Combo! +${b} Bonus`}else p.cmsg=''}
 else{p.combo=0;p.cmsg='';p.w++;st.w=(st.w||0)+1;S.miss[k]={...t,_o:undefined};if(p.phase===1&&p.tasks!==p.retry)p.retry.push({...t,_o:undefined});if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}}
 const mk=Object.keys(S.miss);if(mk.length>80)delete S.miss[mk[0]];
 save();render();
}
function quizNext(){const p=view.p;p.i++;p.done=false;p.ans='';render();scrollTo(0,0)}
function quizEnd(p){
 if(p.phase===1&&p.retry.length&&!p.noRetry){return hdr(esc(p.title),p.color)+`<div class="big">🔁</div><h2 class="center">${p.retry.length} ${p.retry.length===1?'Aufgabe':'Aufgaben'} noch nicht richtig</h2><p class="center mut">Hol dir die Punkte zurück! In der Fehler-Runde übst du genau diese Aufgaben noch einmal.</p><button class="btn" onclick="retryRound()">Fehler-Runde starten</button><button class="btn sec2" onclick="view.p.noRetry=true;render()">Überspringen</button>`}
 if(!p.saved){p.saved=true;const first=p.r1??p.r;const tot=p.n1??p.tasks.length;const pct=Math.round(first/tot*100);if(p.tid){const st=S.tp[p.tid]||(S.tp[p.tid]={});st.sc=st.sc==null?pct:Math.round(st.sc*.5+pct*.5);st.last=today()}if(first===tot&&tot>=5){S.st.perfect++;addXP(10);p.xp+=10}save()}
 const tot=p.n1??p.tasks.length,first=p.r1??p.r,pct=Math.round(first/tot*100);
 const em=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'💪';
 return hdr(esc(p.title),p.color)+`<div class="big">${em}</div><h2 class="center">${first} von ${tot} beim ersten Versuch richtig</h2><p class="center mut">+${p.x0!=null?S.xp-p.x0:p.xp} XP · ${pct>=90?'Hervorragend!':pct>=70?'Richtig gut!':pct>=50?'Ordentlich – dranbleiben!':'Übung macht den Meister. Schau dir noch einmal die Merkkästen an.'}</p>
 ${p.tid?`<button class="btn" onclick="startQuiz('${p.tid}',true)">Noch eine Runde</button>`:`<button class="btn" onclick="go('train',{},true)">Weiter trainieren</button>`}
 ${p.tid&&pct<70?`<button class="btn sec2" onclick="go('learn',{id:'${p.tid}'},true)">📘 Nochmal lernen</button>`:''}<button class="btn sec2" onclick="go('home',{},true)">Zur Startseite</button>`;
}
function retryRound(){const p=view.p;p.r1=p.r;p.n1=p.tasks.length;p.tasks=p.retry.map(t=>({...t,_o:undefined}));p.retry=[];p.i=0;p.phase=2;p.done=false;render()}

/* ---------- Schriftlich rechnen in Kästchen ---------- */
function colInit(t){if(t._c)return t._c;const A=String(t.col.a),B=String(t.col.b),n=Math.max(A.length,B.length)+1;t._c={n,r:Array(n).fill(''),c:Array(n).fill(''),row:'r',i:n-1};return t._c}
function colVal(t){const c=colInit(t);const s=c.r.map(x=>x===''?' ':x).join('').trim();if(!s||s.includes(' '))return s?'?':'';return s.replace(/^0+(?=\d)/,'')}
function colUI(t,done,testMode){
 const c=colInit(t),n=c.n,A=String(t.col.a).padStart(n,' '),B=String(t.col.b).padStart(n,' ');const res=String(first(t.a)).padStart(n,' ');
 const cell=(row,i)=>{const v=c[row][i];let cl='cc in'+(row==='c'?' cy':'');if(!done&&c.row===row&&c.i===i)cl+=' sel';if(done&&row==='r'){cl+=(v===(res[i]===' '?'':res[i]))?' ok':' no'}return `<div class="${cl}" ${done?'':`onclick="colSel('${row}',${i})"`}>${v}</div>`};
 let h=`<div class="colg" style="grid-template-columns:repeat(${n+1},minmax(0,46px))">`;
 h+=`<div class="cc"></div>`+[...A].map(d=>`<div class="cc">${d.trim()}</div>`).join('');
 h+=`<div class="cc">${t.col.op}</div>`+[...B].map(d=>`<div class="cc">${d.trim()}</div>`).join('');
 h+=`<div class="cc cy mut" style="font-size:.6rem">Ü</div>`+Array.from({length:n},(_,i)=>cell('c',i)).join('');
 h+=`<div class="cline"></div><div class="cc">=</div>`+Array.from({length:n},(_,i)=>cell('r',i)).join('')+`</div>`;
 if(!done){h+=`<p class="small mut center" style="margin:0 0 6px">Von rechts nach links rechnen. Tippe ein Kästchen an, um es zu ändern – das „Ü“-Feld ist für Überträge.</p><div class="kp">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button onclick="colKey('${d}')">${d}</button>`).join('')}<button onclick="colKey('del')">⌫</button><button onclick="colKey('clr')" class="small">Alles<br>löschen</button></div>`;
  if(!testMode)h+=`<button class="btn" onclick="quizIn()">Prüfen</button>`}
 return h;
}
function colTask(){const p=view.p;return p.tasks[p.i]}
function colSel(row,i){const c=colInit(colTask());c.row=row;c.i=i;render()}
function colKey(k){const t=colTask(),c=colInit(t);
 if(k==='clr'){c.r.fill('');c.c.fill('');c.row='r';c.i=c.n-1}
 else if(k==='del'){if(c[c.row][c.i]!=='')c[c.row][c.i]='';else if(c.i<c.n-1){c.i++;c[c.row][c.i]=''}}
 else{c[c.row][c.i]=k;if(c.row==='r'&&c.i>0)c.i--;else if(c.row==='c'){c.row='r'}}
 if(view.n==='test'){view.p.ans[view.p.i]=colVal(t);view.p.sure=false}
 render()}

/* ---------- Rechenpapier (Karopapier zum Draufschreiben) ---------- */
function paperUI(t){if(!t.tid||!String(t.tid).startsWith('ma-'))return '';const on=view.p.paper;
 return `<button class="btn sec2" onclick="view.p.paper=!view.p.paper;render()">✏️ Rechenpapier ${on?'ausblenden':'zeigen'}</button>${on?`<div class="paper"><canvas id="paper"></canvas></div><div class="row2"><button class="btn sec2" onclick="paperUndo()">↶ Zurück</button><button class="btn sec2" onclick="paperClear()">🧽 Wegwischen</button></div>`:''}`}
let PAPER={strokes:[],key:null};
function initPaper(){const cv=$('#paper');if(!cv)return;const t=view.p.tasks&&view.p.tasks[view.p.i];const key=t?tkey(t)+view.p.i:'';if(PAPER.key!==key){PAPER={strokes:[],key}}
 const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineCap='round';g.lineJoin='round';g.lineWidth=2.6;g.strokeStyle='#1e3a8a';
 const redraw=()=>{g.clearRect(0,0,r.width,r.height);PAPER.strokes.forEach(s=>{g.beginPath();s.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke()})};redraw();
 let cur=null;const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pos(e)];PAPER.strokes.push(cur);redraw()};
 cv.onpointermove=e=>{if(!cur)return;cur.push(pos(e));const s=cur;g.beginPath();g.moveTo(s[s.length-2][0],s[s.length-2][1]);g.lineTo(s[s.length-1][0],s[s.length-1][1]);g.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>{cur=null};

function weakMix(){const ts=allTopics().filter(t=>(t.tasks&&t.tasks.length)||t.gen||((t.auto||t.vok)&&t.cards.length));

 const sel=scored.slice(0,4).map(x=>x.t);startMix(shuffle(sel.flatMap(t=>tasksFor(t,3))),'Schwächen-Mix','#f59e0b')}

 const out=[];for(let i=0;i<12;i++)out.push(...tasksFor(ts[i%ts.length],1));startMix(shuffle(out),subj(s).name+'-Mix',subj(s).color)}

let testT=null;
function startTest(ids,n,min){
 const ts=ids.map(topic).filter(Boolean);if(!ts.length)return;
 const per={},thp={};ts.forEach(t=>{per[t.id]=0;thp[t.id]=0});for(let i=0;i<n;i++)per[ts[i%ts.length].id]++;
 const tsTh=ts.filter(t=>t.th&&t.th.length);const nTh=tsTh.length?Math.round(n/3):0;for(let i=0;i<nTh;i++){const t=tsTh[i%tsTh.length];if(thp[t.id]<per[t.id])thp[t.id]++}
 let tasks=shuffle(ts.flatMap(t=>per[t.id]?tasksFor(t,per[t.id],thp[t.id]):[]));const seen=new Set();tasks=tasks.filter(t=>{const k=tkey(t);if(seen.has(k))return false;seen.add(k);return true}).slice(0,n);
 const sb=subj(ts[0].s);const title=ts.length===1?ts[0].title:sb.name+'-Test';
 go('test',{tasks,ans:[],i:0,start:Date.now(),end:min?Date.now()+min*60000:0,title,color:sb.color,s:ts[0].s});
 clearInterval(testT);testT=setInterval(()=>{if(view.n!=='test'||view.p.fin){clearInterval(testT);return}const p=view.p;const el=$('#tt');const sec=p.end?Math.max(0,Math.round((p.end-Date.now())/1000)):Math.round((Date.now()-p.start)/1000);if(el)el.textContent=(p.end?'⏳ ':'⏱ ')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(p.end&&sec<=0){toast('⏰ Die Zeit ist um!');finishTest()}},500);
}

 S.st.tests++;if(p.g===1)S.st.ones++;p.tasks.forEach((t,j)=>{const st=S.tp[t.tid]||(S.tp[t.tid]={});if(p.res[j]){st.r=(st.r||0)+1;S.st.right++;S.done[tkey(t)]=Date.now();delete S.miss[tkey(t)]}else{st.w=(st.w||0)+1;S.miss[tkey(t)]={...t,_o:undefined}}});
 const tids=[...new Set(p.tasks.map(t=>t.tid))];tids.forEach(id=>{const idx=p.tasks.map((t,j)=>t.tid===id?j:-1).filter(j=>j>=0);const pc=Math.round(idx.filter(j=>p.res[j]).length/idx.length*100);const st=S.tp[id];st.sc=st.sc==null?pc:Math.round(st.sc*.5+pc*.5)});
 p.xpg=p.r*2+({1:15,2:8,3:3}[p.g]||0);addXP(p.xpg);if(p.g<=2)celeb(p.g===1?'🥇':'🥈','Note '+p.g+'!','Stark geschrieben – '+p.r+' von '+p.tasks.length+' richtig.',p.g===1?25:10);S.tests.push({d:today(),title:p.title,s:p.s,n:p.tasks.length,r:p.r,g:p.g,sec:p.sec});if(S.tests.length>100)S.tests.shift();save();render();scrollTo(0,0)}

 const seen=new Set();const before=d.cards.length;d.cards=d.cards.filter(c=>{const k=nkey(c[0]);if(seen.has(k))return false;seen.add(k);return true});
 if(p.isNew&&S.custom.some(x=>x.id!==d.id&&x.s===d.s&&nkey(x.title)===nkey(d.title)))d.title+=' ('+new Date().getDate()+'.'+(new Date().getMonth()+1)+'.)';
 const i=S.custom.findIndex(x=>x.id===d.id);if(i>=0)S.custom[i]=d;else S.custom.push(d);save();toast(before>d.cards.length?`Gespeichert ✓ (${before-d.cards.length} doppelte entfernt)`:'Gespeichert ✓');go('topic',{id:d.id},true)}
function delCustom(){const p=view.p;if(!p.del){p.del=true;render();return}S.custom=S.custom.filter(x=>x.id!==p.d.id);Object.keys(S.cards).forEach(k=>{if(k.startsWith(p.d.id+'|'))delete S.cards[k]});delete S.tp[p.d.id];save();toast('Gelöscht');go('subject',{s:'eigen'},true)}

async function loadCron(){if(!SYNC.on||!SYNC.pin||VIEWS._cron)return;try{const j=await api('cronkey',{pin:SYNC.pin});if(j.key){VIEWS._cron=location.href.split('#')[0].replace(/[^/]*$/,'')+'api.php?a=cron&key='+j.key;const el=$('#cronurl');if(el)el.value=VIEWS._cron}}catch(e){}}

function b64u8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function pushEnable(){

/* ===== Erklärbilder („Anschauen“): Bild + Regler + Merke + Schritt-für-Schritt ===== */
const BILDER={},BST={};
function B(id,def){(BILDER[id]=BILDER[id]||[]).push(def)}
const BC={b:'#38bdf8',g:'#4ade80',y:'#fde047',o:'#fb923c',p:'#f472b6',v:'#a78bfa',r:'#f87171',m:'#94a3b8',t:'#e2e8f0',d:'#334155',bg:'#0f1a30'};
const sv=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" font-family="system-ui,-apple-system,sans-serif">${inner}</svg>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" dominant-baseline="${o.bl||'middle'}" font-size="${o.s||14}" font-weight="${o.w||700}" fill="${o.c||BC.t}" ${o.x||''}>${s}</text>`;
const Rc=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r??4}" fill="${f}" stroke="${o.st||'none'}" stroke-width="${o.sw||1}" ${o.x||''}/>`;
const Ln=(x1,y1,x2,y2,c=BC.m,w=2,o='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o}/>`;
const Ci=(x,y,r,f,o='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${o}/>`;
const STELLEN=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen'];

function bCur(){const p=view.p,list=BILDER[p.id],i=p.i||0,key=p.id+'#'+i;return {b:list[i],s:BST[key],key}}
function bSet(k,v){const {b,s}=bCur();s[k]=v;s.k=0;if(b.fix)b.fix(s);render()}
function bStep(k,d){const {b,s}=bCur();const c=(b.ctl?b.ctl(s):[]).find(x=>x.k===k);let v=s[k]+d;if(c){if(v<c.min)v=c.min;if(v>c.max)v=c.max}s[k]=v;s.k=0;if(b.fix)b.fix(s,d);render()}
function bNeu(){const {b,s,key}=bCur();const n=Object.assign({k:0},b.neu?b.neu(s):b.init());if(b.fix)b.fix(n);BST[key]=n;render()}
function bNext(all){const {b,s,key}=bCur();const n=(b.draw(s).steps||[]).length;s.k=all?n:Math.min(n,s.k+1);
 if(s.k>=n&&!PREVIEW){if(S.bvd!==today()){S.bvd=today();S.bv=[]}if(!(S.bv||[]).includes(key)){S.bv=(S.bv||[]).concat(key);addXP(2);save();toast('+2 XP fürs Anschauen 🖼️')}}render()}
VIEWS.bild=p=>{
 const list=BILDER[p.id];const t=topic(p.id);if(!list||!t)return VIEWS.home();const i=p.i||0,b=list[i],key=p.id+'#'+i;
 if(!BST[key]){BST[key]=Object.assign({k:0},b.init());if(b.fix)b.fix(BST[key])}
 const s=BST[key],o=b.draw(s),steps=o.steps||[],sb=subj(t.s);
 const ctl=(b.ctl?b.ctl(s):[]).map(c=>c.opts?`<div class="bctl"><span>${c.l}</span><div class="chips">${c.opts.map(([v,l])=>`<button class="chip ${s[c.k]===v?'on':''}" onclick='bSet("${c.k}",${JSON.stringify(v)})'>${l}</button>`).join('')}</div></div>`
  :`<div class="bst"><span>${c.l}</span><button onclick="bStep('${c.k}',-${c.st||1})" aria-label="weniger">−</button><b>${c.f?c.f(s[c.k]):s[c.k]}</b><button onclick="bStep('${c.k}',${c.st||1})" aria-label="mehr">+</button></div>`).join('');
 return hdr('🖼️ '+esc(t.title),sb.color)+
 (list.length>1?`<div class="chips" style="margin-bottom:10px">${list.map((x,j)=>`<button class="chip ${j===i?'on':''}" onclick="go('bild',{id:'${p.id}',i:${j}},true)">${x.t}</button>`).join('')}</div>`:`<h3 style="margin-top:0">${b.t}</h3>`)+
 `<div class="bildk">${o.pic}</div>${o.info?`<div class="binfo">${o.info}</div>`:''}
 ${ctl?`<div class="bctls">${ctl}</div>`:''}
 ${o.merke?`<div class="box"><h3>Merke</h3>${o.merke}</div>`:''}
 ${steps.length?`<div class="sec">${o.stepTitle||'Schritt für Schritt'}</div><ol class="bsteps">${steps.map((x,j)=>`<li class="${j<s.k?'':'zu'}">${j<s.k?x:'…'}</li>`).join('')}</ol>
 <div class="row2">${s.k<steps.length?`<button class="btn" style="margin-top:4px" onclick="bNext()">Schritt ${s.k+1} zeigen</button><button class="btn sec2" style="margin-top:4px" onclick="bNext(true)">Alle zeigen</button>`:`<button class="btn sec2" style="margin-top:4px;grid-column:1/-1" onclick="bSet('k',0)">↺ Wieder verdecken</button>`}</div>`:''}
 ${b.neu?`<button class="btn sec2" onclick="bNeu()">🎲 Neues Beispiel</button>`:''}`;
};

/* ---------- Hilfen für schriftliches Rechnen ---------- */
function colGrid(rows,cols,o={}){ // rows: [{cells:[...], y, c, s}], cells right-aligned over cols
 const cw=o.cw||30,x0=o.x0??((360-cols*cw)/2);let s='';
 rows.forEach(r=>{const cs=r.cells;cs.forEach((ch,j)=>{if(ch===''||ch==null)return;const col=cols-cs.length+j+(r.shift?-r.shift:0);s+=T(x0+col*cw+cw/2,r.y,ch,{s:r.s||24,c:r.c||BC.t,w:r.w||800})})});
 return {svg:s,x0,cw};
}

function addSteps(a,b){const A=String(a),Bs=String(b),sum=String(a+b),n=sum.length;let c=0;const res=[],car=[],txt=[];
 for(let i=0;i<n;i++){const da=+(A[A.length-1-i]||0),db=+(Bs[Bs.length-1-i]||0);const tot=da+db+c;
  if(i>=A.length&&i>=Bs.length){res.push(String(c));txt.push(`Übertrag <b>${c}</b> vorne hinschreiben.`);c=0;continue}
  txt.push(`${STELLEN[i]}: ${da} + ${db}${c?' + 1 (Übertrag)':''} = ${tot} → schreibe <b>${tot%10}</b>${tot>=10?', Übertrag <b>1</b>':''}`);res.push(String(tot%10));c=tot>=10?1:0;car.push(c)}
 return {res,car,txt,n}}

const TREPPE={len:{n:'Länge',u:['km','m','dm','cm','mm'],f:[1000,10,10,10]},mas:{n:'Masse',u:['t','kg','g','mg'],f:[1000,1000,1000]},fl:{n:'Fläche',u:['km²','ha','a','m²','dm²','cm²','mm²'],f:[100,100,100,100,100,100]},zeit:{n:'Zeit',u:['d','h','min','s'],f:[24,60,60]}};

const STOP=new Set(['der','die','das','den','dem','des','ein','eine','und','oder','the','a','an','to','von','vom','mit','für','im','in','am','auf','zu','zum','zur','is','are','klasse','thema','vokabeln','teil','seite']);
const nkey=s=>String(s||'').toLowerCase().split('|')[0].replace(/[„“"'’.,;:!?()]/g,' ').replace(/^\s*(der|die|das|ein|eine|the|a|an|to)\s+/,'').replace(/\s+/g,' ').trim();
const words=s=>String(s||'').toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!STOP.has(w));
/* Wo gibt es diese Karte im Fach schon? (Vorder- ODER Rückseite gleich bei Vokabeln, sonst Vorderseite) */
function dupIndex(s,exceptId){const m=new Map();topicsOf(s).forEach(t=>{if(t.id===exceptId)return;(t.cards||[]).forEach(([f,b])=>{m.set('f:'+nkey(f),t.title);if(t.vok)b.split('|').forEach(x=>m.set('b:'+nkey(x),t.title))});(t.tasks||[]).concat(t.th||[]).forEach(x=>{if(Array.isArray(x))m.set('q:'+nkey(String(x[1]).replace(/<[^>]+>/g,'')),t.title)})});return m}
function dupOf(m,f,b,vok){return m.get('f:'+nkey(f))||(vok&&m.get('b:'+nkey(b)))||m.get('q:'+nkey(f))||null}
/* Bereinigt eine neue Kartenliste: doppelt im Fach + doppelt in sich selbst */
function cleanImport(d){const m=dupIndex(d.s,d.id),seen=new Set(),keep=[],removed=[];
 d.cards.forEach(c=>{if(!c[0]||!c[1]){keep.push(c);return}const k=nkey(c[0]);const w=seen.has(k)?'diesem Import':dupOf(m,c[0],c[1],d.kind==='vok');if(w){removed.push([c[0],c[1],w])}else{seen.add(k);keep.push(c)}});
 d.cards=keep;return removed}
/* Passendes bestehendes eigenes Thema zum Anhängen finden */
function mergeTarget(d){const w=new Set(words(d.title));let best=null,bs=0;S.custom.forEach(c=>{if(c.id===d.id||c.s!==d.s||c.kind!==d.kind)return;let sc=words(c.title).filter(x=>w.has(x)).length;if(nkey(c.title)===nkey(d.title))sc+=5;if(sc>bs){bs=sc;best=c}});return bs>=1?best:null}
/* Lehrplan-Thema, zu dem ein eigenes Thema passt */
function relatedBuiltin(c){const w=new Set(words(c.title+' '+(c.cards||[]).slice(0,6).map(x=>x[0]).join(' ')));let best=null,bs=0;TOPICS.filter(t=>t.s===c.s).forEach(t=>{const sc=words(t.title).filter(x=>w.has(x)).length;if(sc>bs){bs=sc;best=t}});return best?best.id:null}
function sortedTopics(s){const built=TOPICS.filter(t=>t.s===s),cust=S.custom.filter(c=>(c.s||'eigen')===s).map(customTopic);const out=[],used=new Set();
 built.forEach(t=>{out.push(t);cust.filter(c=>!used.has(c.id)&&relatedBuiltin(S.custom.find(x=>x.id===c.id))===t.id).sort((a,b)=>a.title.localeCompare(b.title,'de')).forEach(c=>{used.add(c.id);out.push(Object.assign({},c,{sub:true}))})});
 cust.filter(c=>!used.has(c.id)).sort((a,b)=>a.title.localeCompare(b.title,'de')).forEach(c=>out.push(c));return out}

/* ===== Vokabeln aus dem Heft (Foto → Texterkennung des Geräts → einfügen) ===== */
const DE_HINT=/^(der|die|das|ein|eine)\s|[äöüßÄÖÜ]|(ung|heit|keit|schaft|chen|lein|en|ern|eln)$/;
const EN_HINT=/^(to|a|an|the)\s|(ing|tion|ly|ous|ful|th|w|y)$|\b(is|are|you|my|your)\b/;
function vokScore(w){w=w.trim();let s=0;if(DE_HINT.test(w))s+=2;if(/^[A-ZÄÖÜ]/.test(w)&&!/^(I|I'm)\b/.test(w))s+=.5;if(EN_HINT.test(w.toLowerCase()))s-=2;return s}
function parseVok(txt){
 const lines=txt.split(/\r?\n/).map(l=>l.replace(/^[\s•·\-–*\d.)]+(?=\S)/,'').trim()).filter(l=>l&&l.length<120);
 let pairs=[];const sep=/\s*(?:=|;|\t|\s[-–—:]\s|\s{3,})\s*/;
 const art=/^(.+?)\s+((?:der|die|das|ein|eine)\s.+)$/,art2=/^((?:der|die|das|ein|eine)\s\S+)\s+(.+)$/;
 for(let i=0;i<lines.length;i++){const l=lines[i];if(sep.test(l))continue;let m=l.match(art2);if(m&&!/^(der|die|das|ein|eine)\s/.test(m[2])&&/^[a-z]/.test(m[2])&&!/(en|ern|eln)$/.test(m[2])){lines[i]=m[1]+' = '+m[2];continue}m=l.match(art);if(m&&/^[a-z]/.test(m[1])&&!/(en|ern|eln)$/.test(m[1]))lines[i]=m[1]+' = '+m[2]}
 const withSep=lines.filter(l=>sep.test(l)).length;
 if(withSep>=lines.length*.6){lines.forEach(l=>{const m=l.split(sep);if(m.length>=2&&m[0]&&m[1])pairs.push([m[0].trim(),m.slice(1).join(' ').trim()])})}
 else{for(let i=0;i+1<lines.length;i+=2)pairs.push([lines[i],lines[i+1]])}
 // Welche Seite ist Deutsch? → in die erste Spalte
 let a=0,b=0;pairs.forEach(([x,y])=>{a+=vokScore(x);b+=vokScore(y)});
 if(a<b)pairs=pairs.map(([x,y])=>[y,x]);
 return pairs;
}

 const row=(x,lab)=>`<div class="rev ok"><div>${lab?`<span class="badge" style="background:#38bdf833;color:#7dd3fc">${lab}</span> `:''}${x.q}</div>${x.t==='m'?`<div class="small mut" style="margin-top:4px">Auswahl: ${x.a.map((o,j)=>j?esc(o):'<b style="color:#86efac">'+o+'</b>').join(' · ')}</div>`:`<div class="small" style="margin-top:4px">Lösung: <b style="color:#86efac">${esc(showAns(x))}</b></div>`}${x.ex?`<div class="small mut">${x.ex}</div>`:''}</div>`;
 return hdr('📋 Aufgaben & Lösungen',subj(t.s).color)+`<p class="small mut">${esc(t.title)} – ${th.length} Theorie · ${ap.length} Anwendung · ${(t.cards||[]).length} Karteikarten${t.gen?' · dazu unbegrenzt neu erzeugte Rechenaufgaben (5 Beispiele unten)':''}</p>
 ${t.text?`<details class="text"><summary>Lesetext</summary>${t.text}</details>`:''}
 ${th.length?`<div class="sec">Theorie</div>${th.map(x=>row(x)).join('')}`:''}${ap.length?`<div class="sec">Anwendung</div>${ap.map(x=>row(x)).join('')}`:''}${ex.length?`<div class="sec">Beispiele (zufällig erzeugt)</div>${ex.map(x=>row(x)).join('')}`:''}
 ${(t.cards||[]).length?`<div class="sec">Karteikarten</div><div class="box">${t.cards.map(([f,b])=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${esc(f)}</b> – ${esc(b.split('|').join(' / '))}</div>`).join('')}</div>`:''}`};

/* ---------- Installieren ---------- */
let INSTALL=null;
const isApp=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(view.n==='home')render()});
window.addEventListener('appinstalled',()=>{INSTALL=null;toast('📲 Lernbasis ist installiert!');render()});
async function installApp(){if(INSTALL){INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()}else go('install')}
VIEWS.install=()=>{const ios=/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;const sam=/SamsungBrowser/.test(navigator.userAgent);
 return hdr('📲 Als App installieren','#38bdf8')+(ios?`<div class="box"><h3>iPad / iPhone (Safari)</h3>1. Unten oder oben auf das <b>Teilen-Symbol</b> (Quadrat mit Pfeil) tippen.<br>2. <b>„Zum Home-Bildschirm“</b> wählen.<br>3. Oben rechts <b>„Hinzufügen“</b>.</div>`:'')+
 `<div class="box"><h3>${sam?'Samsung Internet':'Chrome (Android)'}</h3>${sam?'1. Unten auf <b>☰</b> tippen.<br>2. <b>„Seite hinzufügen zu“</b> → <b>„Startbildschirm“</b>.':'1. Oben rechts auf <b>⋮</b> tippen.<br>2. <b>„Zum Startbildschirm hinzufügen“</b> wählen.<br>3. Falls gefragt: <b>„Installieren“</b>.'}</div>
 <div class="box"><h3>Steht dort nur „In Leuchtturm öffnen“?</h3>Dann ist auf diesem Handy schon die Leuchtturm-App installiert, und der Browser verwechselt die beiden. Im Menü ⋮ trotzdem <b>„Zum Startbildschirm hinzufügen“</b> wählen – die Lernbasis bekommt dann ihr eigenes Symbol. Hilft das nicht: die Adresse in <b>Samsung Internet</b> öffnen und dort hinzufügen.</div>`};
/* ---------- Start ---------- */
try{history.replaceState({n:'home',p:{}},'')}catch(e){}
modeCache();
if(MODE==='eltern'){const l=document.querySelector('link[rel=manifest]');if(l)l.href='eltern-manifest.php';document.title='Lernbasis Eltern';const ic=document.querySelector('link[rel=apple-touch-icon]');if(ic)ic.href='icon-eltern-192.png'}
render();syncInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
