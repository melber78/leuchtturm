<style>
:root{--bg:#0b1324;--bg2:#111c33;--card:#17243f;--card2:#1e2d4d;--line:#2a3b60;--txt:#eef2ff;--mut:#9fb0d0;--acc:#38bdf8;--ok:#22c55e;--bad:#f43f5e;--warn:#fbbf24;--r:18px;--sub:#38bdf8}

html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1d3b6e55,transparent),radial-gradient(900px 500px at -10% 110%,#3b1d6e44,transparent),var(--bg)}

button{font:inherit;color:inherit;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}

textarea{min-height:90px;resize:vertical}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.top .ttl{flex:1;font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:1.2rem;flex:none}
.pill{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--mut);white-space:nowrap}
.hero{background:var(--hero,linear-gradient(135deg,#1e3a8a,#6d28d9));border-radius:24px;padding:18px;margin:6px 0 14px;box-shadow:0 10px 30px #0006}
.hero .row{display:flex;align-items:center;gap:12px}
.lvl{width:56px;height:56px;border-radius:16px;background:#ffffff22;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.bar{height:10px;border-radius:99px;background:#ffffff26;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#fb923c);border-radius:99px;transition:width .4s}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stats span{background:#ffffff1f;padding:6px 10px;border-radius:12px;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:var(--r);padding:14px;text-align:left;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:1.7rem}
.tile b{font-size:1rem}
.tile small{color:var(--mut);font-size:.78rem}
.tile::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--c,#38bdf8);opacity:.22}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.act{border-radius:var(--r);padding:14px;text-align:left;background:var(--card2);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.act .ic{font-size:1.5rem;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ffffff12;flex:none}
.act b{display:block}.act small{color:var(--mut);font-size:.78rem}
.sec{margin:18px 0 8px;color:var(--mut);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .t{flex:1}.item small{color:var(--mut);display:block;font-size:.8rem}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--sub) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center;flex:none}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center}
.mode .ic{font-size:1.8rem;display:block}.mode b{display:block;margin-top:4px}.mode small{color:var(--mut);font-size:.78rem}
.box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.box h3{color:var(--sub)}
.tbl{font-family:ui-monospace,monospace;background:var(--bg2);border-radius:10px;padding:8px 10px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.text{background:#fffbea;color:#1f2937;border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:1.02rem;line-height:1.6}
.text p{margin:.4em 0}
details.text summary{font-weight:700;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:8px 0 12px;font-size:1.15rem}
.q .k{display:block;color:var(--mut);font-size:.78rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:1rem}
.opt.sel{border-color:var(--acc);background:#38bdf822}
.opt.ok{border-color:var(--ok);background:#22c55e26}
.opt.no{border-color:var(--bad);background:#f43f5e26}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--acc);color:#04263a;font-weight:800;font-size:1.02rem;margin-top:10px;text-align:center}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#052e16}.btn.no{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb{border-radius:16px;padding:14px;margin-top:10px;animation:pop .25s}
.fb.ok{background:#22c55e22;border:1px solid #22c55e66}.fb.no{background:#f43f5e1f;border:1px solid #f43f5e66}

@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.prog{height:8px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:4px 0 8px}.prog i{display:block;height:100%;background:var(--sub);transition:width .3s}
.card3d{perspective:1000px;margin:10px 0}
.flip{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.3rem;font-weight:600;background:var(--card);border:2px solid var(--line)}
.face.b{transform:rotateY(180deg);background:linear-gradient(135deg,#0e7490,#4338ca);border-color:transparent}
.face small{font-size:.75rem;color:var(--mut);font-weight:400;position:absolute;top:12px}
.face.b small{color:#e0e7ff}
.big{font-size:3rem;text-align:center;margin:10px 0}
.center{text-align:center}.mut{color:var(--mut)}.small{font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-size:.9rem}
.chip.on{border-color:var(--sub);background:#38bdf822}
.cb{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cb input{width:22px;height:22px;flex:none;accent-color:var(--acc)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.nav button{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.85rem}
.nav button.done{background:#38bdf833}.nav button.cur{border:2px solid var(--acc)}
.note{font-size:6rem;font-weight:900;text-align:center;line-height:1;margin:8px 0}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:.95rem}
.rev.ok{border-left:5px solid var(--ok)}.rev.no{border-left:5px solid var(--bad)}
.timer{font-variant-numeric:tabular-nums}
.ed{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.ed input{padding:10px}
.ed button{width:40px;border-radius:10px;background:var(--card2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827ee;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .2s;max-width:90vw;text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:16px auto}
.pinpad button{height:62px;border-radius:16px;background:var(--card);font-size:1.4rem;font-weight:700}
.dots{display:flex;justify-content:center;gap:12px;margin:14px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc);border-color:var(--acc)}
table.st{width:100%;border-collapse:collapse;font-size:.9rem}table.st td,table.st th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.badge{font-size:.7rem;background:#ec489933;color:#f9a8d4;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
sup{font-size:.7em}
.colg{display:grid;gap:4px;justify-content:center;margin:10px 0 12px}
.cc{height:50px;display:grid;place-items:center;font:700 1.55rem ui-monospace,Menlo,monospace;border-radius:9px}
.cc.in{background:var(--bg2);border:2px solid var(--line);cursor:pointer}
.cc.cy{height:30px;font-size:.95rem;color:var(--warn)}
.cc.sel{border-color:var(--acc);background:#38bdf826;box-shadow:0 0 0 3px #38bdf833}
.cc.ok{border-color:var(--ok);background:#22c55e22}.cc.no{border-color:var(--bad);background:#f43f5e22}
.cline{grid-column:1/-1;height:3px;background:var(--txt);border-radius:2px;margin:2px 0}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:460px;margin:0 auto}
.kp button{height:54px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1.35rem;font-weight:700}
.kp button.small{font-size:.7rem;line-height:1.1}
.paper{position:relative;height:300px;margin-top:10px;border-radius:14px;background:#fdfdfb;background-image:linear-gradient(#cbd5e6 1px,transparent 1px),linear-gradient(90deg,#cbd5e6 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
@media(min-width:700px){.paper{height:380px}}

.lvl.av{position:relative;font-size:2rem;width:62px;height:62px}
.lvl.av i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:.8rem;font-weight:800;background:#fde047;color:#422006;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 5px;border:2px solid #0b1324}
.stats button{background:#ffffff1f;padding:6px 10px;border-radius:12px;font-size:.85rem}
.combo{margin-top:8px;font-weight:800;color:#fdba74;animation:pop .3s}
.coins{text-align:center;font-size:2rem;font-weight:900;margin:6px 0 2px;color:#fde047}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.shopi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shopi span{font-size:2rem;line-height:1.1}.shopi small{color:var(--mut);font-size:.75rem}
.shopi.on{border-color:var(--acc);background:#ffffff10}
.shopg.th{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.shopi .sw{width:100%;height:42px;border-radius:10px;display:block}
.warnb{background:#f59e0b;color:#1f1300}
.badgeg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bdg span{font-size:2.2rem;display:block}.bdg b{display:block;margin:4px 0 2px}.bdg small{color:var(--mut);font-size:.75rem}
.bdg.lock{opacity:.45;filter:grayscale(1)}
.ov{position:fixed;inset:0;z-index:100;background:#020617cc;display:grid;place-items:center;padding:20px;animation:pop .25s}
.ovc{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 22px;text-align:center;max-width:360px;width:100%;position:relative;z-index:2;box-shadow:0 20px 60px #000a}
.ovi{font-size:4.5rem;animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) scale(1.06)}}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.conf{display:none}.ovi{animation:none}}

</style>

<script>
/* ===== Aufgaben-Generatoren (Mathe, Geschichte) ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{const s=String(Math.abs(n));if(s.length<5)return (n<0?'−':'')+s;return (n<0?'−':'')+s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');};
const dez=n=>String(Math.round(n*1000)/1000).replace('.',',');
const mcNum=(q,c,wr,ex)=>({t:'m',q,a:[String(c),...wr.map(String)],ex});
function nearWrong(c,steps){const s=new Set();steps.forEach(d=>{if(c+d!==c&&c+d>=0)s.add(c+d)});return [...s].slice(0,3);}

const GEN={
 zahlen(){
  const k=R(0,4);
  if(k===0){const n=R(1000000,9999999);const names=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen'];const p=R(1,6);const d=String(n).split('').reverse()[p];
   return {t:'i',q:`Welche Ziffer steht in <b>${fmt(n)}</b> an der <b>${names[p]}</b>stelle?`,a:d,ex:`Von rechts gezählt: Einer, Zehner, Hunderter, Tausender, Zehntausender, Hunderttausender, Millionen. An der ${names[p]}stelle steht ${d}.`};}
  if(k===1){const n=R(1000000,9999999);const st=pick([[1000,'Tausender'],[10000,'Zehntausender'],[100000,'Hunderttausender']]);const r=Math.round(n/st[0])*st[0];
   return {t:'i',q:`Runde <b>${fmt(n)}</b> auf <b>${st[1]}</b>.`,a:String(r),ex:`Schau auf die Ziffer rechts neben der ${st[1]}stelle: 0–4 abrunden, 5–9 aufrunden. Ergebnis: ${fmt(r)}.`};}
  if(k===2){const base=pick([R(1,9)*1000000,R(10,99)*100000,R(100,999)*10000]);const nf=Math.random()<.5;const n=nf?base-1:base;const ans=nf?base:base-1;
   return {t:'i',q:`Wie heißt der <b>${nf?'Nachfolger':'Vorgänger'}</b> von <b>${fmt(n)}</b>?`,a:String(ans),ex:`${nf?'Nachfolger = Zahl + 1':'Vorgänger = Zahl − 1'}: ${fmt(ans)}.`};}
  if(k===3){const n=R(4,2999);const r=toRoman(n);if(Math.random()<.5)return {t:'i',q:`Schreibe als arabische Zahl: <b>${r}</b>`,a:String(n),ex:`I=1, V=5, X=10, L=50, C=100, D=500, M=1000. Steht ein kleineres Zeichen vor einem größeren, wird es abgezogen (IV = 4). ${r} = ${n}.`};
   return {t:'i',q:`Schreibe als römische Zahl: <b>${n}</b>`,a:r,ex:`${n} = ${r}. Tipp: Zerlege in Tausender, Hunderter, Zehner und Einer.`};}
  const d=String(R(1000000,9999999)).split('');const opts=new Set();while(opts.size<4){const c=[...d];const i=R(0,6),j=R(0,6);[c[i],c[j]]=[c[j],c[i]];if(c[0]!=='0')opts.add(Number(c.join('')));}
  const arr=[...opts].sort((a,b)=>b-a);const big=Math.random()<.5;const c=big?arr[0]:arr[3];
  return {t:'m',q:`Welche Zahl ist die <b>${big?'größte':'kleinste'}</b>?`,a:[fmt(c),...arr.filter(x=>x!==c).map(fmt)],ex:'Vergleiche von links nach rechts Stelle für Stelle. Die erste unterschiedliche Ziffer entscheidet.'};
 },
 rechnen(){
  const k=R(0,4);
  if(k===0){const a=R(10000,899999),b=R(1000,99999);return {t:'i',col:{a,b,op:'+'},q:`Rechne schriftlich: <b>${fmt(a)} + ${fmt(b)}</b>`,a:String(a+b),ex:`Schriftlich untereinander addieren, Überträge nicht vergessen. Ergebnis: ${fmt(a+b)}.`};}
  if(k===1){const a=R(20000,999999),b=R(1000,a-1000);return {t:'i',col:{a,b,op:'−'},q:`Rechne schriftlich: <b>${fmt(a)} − ${fmt(b)}</b>`,a:String(a-b),ex:`Schriftlich subtrahieren (Ergänzungsverfahren). Probe: ${fmt(a-b)} + ${fmt(b)} = ${fmt(a)}.`};}
  if(k===2){const a=R(102,989),b=R(12,89);return {t:'i',q:`Rechne schriftlich: <b>${a} · ${b}</b>`,a:String(a*b),ex:`${a} · ${Math.floor(b/10)*10} = ${fmt(a*Math.floor(b/10)*10)} und ${a} · ${b%10} = ${fmt(a*(b%10))}. Zusammen: ${fmt(a*b)}.`};}
  if(k===3){const d=R(3,9),q=R(112,1999);return {t:'i',q:`Rechne schriftlich: <b>${fmt(d*q)} : ${d}</b>`,a:String(q),ex:`Schriftlich dividieren. Probe: ${q} · ${d} = ${fmt(d*q)}.`};}
  const a=R(1100,9800),b=R(1100,9800),op=pick(['+','·']);
  if(op==='+'){const c=Math.round(a/1000)*1000+Math.round(b/1000)*1000;return mcNum(`Überschlage: <b>${fmt(a)} + ${fmt(b)}</b> ist ungefähr …`,fmt(c),[fmt(c+1000),fmt(c-1000),fmt(c*10)],`Runde beide Zahlen auf Tausender: ${fmt(Math.round(a/1000)*1000)} + ${fmt(Math.round(b/1000)*1000)} = ${fmt(c)}.`);}
  const x=R(21,89),y=R(21,89),c=Math.round(x/10)*10*Math.round(y/10)*10;return mcNum(`Überschlage: <b>${x} · ${y}</b> ist ungefähr …`,fmt(c),[fmt(c*10),fmt(Math.round(c/10)),fmt(c+1000)],`Runde auf Zehner: ${Math.round(x/10)*10} · ${Math.round(y/10)*10} = ${fmt(c)}.`);
 },
 regeln(){
  const k=R(0,3);
  if(k===0){const a=R(2,30),b=R(2,9),c=R(2,9);return {t:'i',q:`${a} + ${b} · ${c} =`,a:String(a+b*c),ex:`Punkt vor Strich: erst ${b} · ${c} = ${b*c}, dann ${a} + ${b*c} = ${a+b*c}.`};}
  if(k===1){const a=R(2,15),b=R(2,15),c=R(2,9);return {t:'i',q:`(${a} + ${b}) · ${c} =`,a:String((a+b)*c),ex:`Klammern zuerst: ${a} + ${b} = ${a+b}, dann · ${c} = ${(a+b)*c}.`};}
  if(k===2){const d=R(2,9),q=R(2,9),a=R(3,9),b=R(3,9);const v=a*b-q;if(v<0)return GEN.regeln();return {t:'i',q:`${a} · ${b} − ${d*q} : ${d} =`,a:String(v),ex:`Punkt vor Strich: ${a} · ${b} = ${a*b} und ${d*q} : ${d} = ${q}. Dann ${a*b} − ${q} = ${v}.`};}
  const a=R(50,99),b=R(10,40),c=R(2,8);return {t:'i',q:`${a} − (${b} − ${c}) =`,a:String(a-(b-c)),ex:`Klammer zuerst: ${b} − ${c} = ${b-c}. Dann ${a} − ${b-c} = ${a-(b-c)}.`};
 },

function toRoman(n){const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,r] of m)while(n>=v){s+=r;n-=v}return s;}
function gcd(a,b){return b?gcd(b,a%b):a}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function smallDiv(n){for(let i=2;i<n;i++)if(n%i===0)return `${i} und ${n/i}`;return ''}

 cards:[['Doppelpunkt bei der wörtlichen Rede?','wenn der Begleitsatz vorne steht'],['Komma bei der wörtlichen Rede?','wenn der Begleitsatz danach oder dazwischen steht'],['Komma vor „und“ in einer Aufzählung?','Nein'],['Komma vor „aber“?','Ja, immer'],['Komma vor „weil“?','Ja – Nebensatz']],

{id:'de-texte',s:'de',title:'Märchen, Fabel, Sage & Erzählen',
 learn:[['Märchen','„Es war einmal …“, Ort und Zeit unbestimmt, Gut gegen Böse, Zauberei und Wunder, magische Zahlen (3, 7, 12), gutes Ende. Gesammelt u. a. von den Brüdern Grimm.'],['Fabel','Kurze Geschichte, Tiere handeln wie Menschen und haben typische Eigenschaften (Fuchs = listig, Löwe = mächtig). Am Ende eine Lehre (Moral). Berühmter Fabeldichter: Äsop.'],['Sage','Hat einen wahren Kern: echte Orte oder Personen, dazu Übernatürliches. Aus dem Harz: die Rosstrappe, der Hexentanzplatz.'],['Gut erzählen','<b>Einleitung</b>: Wer? Wo? Wann? · <b>Hauptteil</b>: Spannung steigt bis zum <b>Höhepunkt</b> · <b>Schluss</b>: Auflösung. Präteritum, wörtliche Rede, treffende Verben (statt „sagen“: flüstern, rufen, murmeln).']],
 cards:[['Typischer Märchenanfang','Es war einmal …'],['Magische Zahlen im Märchen','3, 7, 12'],['Fabel – Besonderheit','Tiere handeln wie Menschen, am Ende steht eine Lehre'],['Fuchs in der Fabel','listig, schlau'],['Sage – Besonderheit','wahrer Kern: echte Orte oder Personen'],['Aufbau einer Erzählung','Einleitung – Hauptteil mit Höhepunkt – Schluss'],['Zeitform beim Erzählen','Präteritum'],['Wortfeld „gehen“','schlendern, rennen, schleichen, stapfen …']],
 tasks:[['m','Woran erkennst du eine Fabel?',['Tiere handeln wie Menschen und es gibt eine Lehre.','Sie beginnt mit „Es war einmal“.','Sie spielt an einem echten Ort.','Sie wird immer in Reimen erzählt.'],'Typisch für die Fabel: Tiere mit menschlichen Eigenschaften und eine Moral.'],
 ['m','Welche Textsorte hat einen wahren Kern, z. B. einen echten Ort?',['Sage','Märchen','Fabel','Gedicht'],'Sagen verbinden Wirkliches mit Übernatürlichem.'],['m','Was gehört in die Einleitung einer Erzählung?',['Wer, wo und wann','der Höhepunkt','die Lehre','die Lösung des Problems'],'Die Einleitung stellt Figuren, Ort und Zeit vor.'],
 ['m','Welches Verb passt am besten? „Psst“, ___ Lena, „das Baby schläft.“',['flüsterte','brüllte','jubelte','stotterte'],'Bei „Psst“ und einem schlafenden Baby spricht man leise.'],['w','In Märchen sind Ort und Zeit meist genau angegeben.',false,'Märchen spielen „irgendwann, irgendwo“.'],['w','Die Spannung einer Erzählung ist im Höhepunkt am größten.',true,'Danach folgt die Auflösung im Schluss.']]},
{id:'de-lesen',s:'de',title:'Lesetraining: Der Fund im Steinbruch',
 text:`<p>Jonas verbrachte die Herbstferien bei seinem Opa Werner in einem kleinen Dorf im Harz. Am Mittwoch regnete es den ganzen Vormittag. Erst nach dem Mittagessen hörte es auf, und die beiden zogen ihre Gummistiefel an.</p><p>„Heute zeige ich dir den alten Steinbruch“, sagte Opa. „Dort habe ich als Junge jeden Nachmittag gesucht – meistens ohne Erfolg.“</p><p>Der Weg führte zuerst durch einen Fichtenwald und dann steil bergauf. Oben angekommen, war Jonas ziemlich außer Atem. Vor ihnen lag eine graue Wand aus Schiefer, von der der Regen viele kleine Bruchstücke gelöst hatte.</p><p>Jonas drehte einen flachen Stein nach dem anderen um. Nach einer halben Stunde wollte er schon aufgeben. Da entdeckte er auf einer Platte feine, geschwungene Linien, die aussahen wie die Rippen eines Fächers.</p><p>„Opa! Ist das ein Abdruck?“</p><p>Opa Werner setzte seine Lesebrille auf und pfiff leise durch die Zähne. „Das ist eine Muschel – und zwar eine, die vor etwa 380 Millionen Jahren gelebt hat. Damals war hier ein Meer.“</p><p>Jonas starrte ungläubig auf die Platte. Ein Meer, mitten im Harz?</p><p>Am Abend wickelte er seinen Fund vorsichtig in Zeitungspapier. Opa lächelte: „Siehst du, manchmal muss man nur lange genug suchen. Und manchmal braucht es den Regen dazu.“</p>`,
 learn:[['So liest du einen Sachtext oder eine Geschichte','1. Überschrift lesen und vermuten. 2. Text ganz lesen. 3. Fragen lesen. 4. Antworten im Text suchen – nicht raten! 5. Bei „Warum“-Fragen zwischen den Zeilen lesen.']],
 tasks:[['m','Wann machten sich Jonas und Opa auf den Weg?',['nach dem Mittagessen','am Vormittag','am Abend','am Donnerstag'],'„Erst nach dem Mittagessen hörte es auf, und die beiden zogen ihre Gummistiefel an.“'],
 ['m','Woraus bestand die Wand im Steinbruch?',['aus Schiefer','aus Kalkstein','aus Granit','aus Sandstein'],'„eine graue Wand aus Schiefer“'],
 ['m','Wie hatte der Regen beim Suchen geholfen?',['Er hatte Bruchstücke aus der Wand gelöst.','Er hatte andere Sammler ferngehalten.','Er hatte den Schiefer dunkler gefärbt.','Er hatte den Weg nach oben verkürzt.'],'„… von der der Regen viele kleine Bruchstücke gelöst hatte.“'],
 ['m','Wie alt ist die Muschel ungefähr?',['380 Millionen Jahre','38 Millionen Jahre','3 800 Jahre','380 000 Jahre'],'Opa sagt: „vor etwa 380 Millionen Jahren“.'],
 ['w','Opa hat als Junge im Steinbruch oft etwas gefunden.',false,'Er sagt: „meistens ohne Erfolg“.'],
 ['m','Warum staunte Jonas so sehr?',['Er konnte sich kaum vorstellen, dass im Harz einmal ein Meer war.','Er hatte noch nie eine Lesebrille gesehen.','Die Muschel war größer als seine Hand.','Opa hatte ihm nichts vom Steinbruch erzählt.'],'„Ein Meer, mitten im Harz?“ – Er ist ungläubig über das frühere Meer.'],
 ['m','Was zeigt das Verhalten von Opa, als er „leise durch die Zähne pfiff“?',['Er war beeindruckt.','Er war enttäuscht.','Er war ungeduldig.','Er war verärgert.'],'Ein leiser Pfiff drückt hier Staunen aus.'],
 ['m','Was meint Opa mit dem letzten Satz?',['Geduld lohnt sich – und manchmal hilft ein glücklicher Umstand.','Man sollte nur bei Regen nach Fossilien suchen.','Jonas soll beim nächsten Mal früher aufstehen.','Fossilien findet man nur mit Brille.'],'Jonas hat lange gesucht (Geduld), der Regen hat zufällig geholfen.'],
 ['m','In welcher Zeitform ist der Text geschrieben?',['Präteritum','Präsens','Perfekt','Futur I'],'verbrachte, regnete, zogen … – typische Erzählzeit.']]},

{id:'en-tobe',s:'en',title:'to be & have got',

 tasks:[['i','I ___ eleven years old.','am|\'m','I am – Kurzform I\'m.'],['i','My sister ___ at school.','is','he/she/it → is.'],['i','We ___ best friends.','are|\'re','we → are.'],['i','He ___ hungry. (Verneinung von „is“, Kurzform)','isn\'t|is not','he is not → he isn\'t.'],['m','___ you from Halle?',['Are','Is','Am','Do'],'Fragen mit „to be“: Are you …?'],['m','Is Paul your brother? – Yes, he ___.',['is','does','has','are'],'Kurzantwort mit derselben Form: Yes, he is.'],
 ['i','She ___ got a cat.','has','he/she/it → has got.'],['m','We ___ got two rabbits.',['have','has','are','do'],'we → have got.'],['m','I ___ got a bike. (Verneinung)',['haven\'t','hasn\'t','don\'t','aren\'t'],'I haven\'t got …'],['m','___ he got a brother?',['Has','Have','Is','Does'],'Frage: Has he got …?'],['m','Have you got a pet? – No, I ___.',['haven\'t','don\'t','am not','hasn\'t'],'Kurzantwort: No, I haven\'t.']]},
{id:'en-simple',s:'en',title:'Simple present',
 learn:[['Wann?','Für Gewohnheiten und Dinge, die regelmäßig passieren. Signalwörter: <b>always, usually, often, sometimes, never, every day, on Mondays</b>.'],['he, she, it – das s muss mit!','I play – he play<b>s</b> · watch → watch<b>es</b> · go → go<b>es</b> · fly → fl<b>ies</b> · have → <b>has</b>'],['Verneinung','I/you/we/they <b>don\'t</b> play · he/she/it <b>doesn\'t</b> play (ohne s!)'],['Fragen','<b>Do</b> you play …? · <b>Does</b> she play …? (ohne s!)<br>Kurzantwort: Yes, I do. / No, she doesn\'t.']],
 cards:[['Signalwörter simple present','always, usually, often, sometimes, never, every …'],['he/she/it-Regel','an das Verb kommt ein -s'],['Verneinung bei he/she/it','doesn\'t + Verb ohne s'],['Frage bei he/she/it','Does …? + Verb ohne s'],['watch → he …','watches'],['fly → it …','flies']],
 tasks:[['i','He ___ (play) football every Sunday.','plays','he → -s: plays.'],['i','She ___ (watch) TV after dinner.','watches','Nach ch kommt -es.'],['i','My dad ___ (go) to work by bus.','goes','go → goes.'],['i','The bird ___ (fly) south in autumn.','flies','Konsonant + y → -ies.'],['m','I ___ like spinach.',['don\'t','doesn\'t','not','am not'],'I → don\'t.'],['m','My brother ___ like spinach.',['doesn\'t','don\'t','isn\'t','not'],'he → doesn\'t.'],['i','She doesn\'t ___ (play) tennis.','play','Nach doesn\'t kein s mehr!'],['m','___ she live in Leipzig?',['Does','Do','Is','Has'],'Frage bei she → Does.'],['m','___ your parents work on Saturdays?',['Do','Does','Are','Have'],'they → Do.'],['m','Which word is a signal word for the simple present?',['usually','now','at the moment','look'],'„usually“ zeigt eine Gewohnheit.'],['m','Does Paul like pizza? – Yes, he ___.',['does','likes','is','do'],'Kurzantwort: Yes, he does.']]},
{id:'en-progressive',s:'en',title:'Present progressive',
 learn:[['Wann?','Für Dinge, die <b>gerade jetzt</b> passieren. Signalwörter: <b>now, at the moment, Look!, Listen!</b>'],['Bildung','am / is / are + Verb mit <b>-ing</b>: I am reading · she is playing · they are running'],['Schreibregeln','make → mak<b>ing</b> (stummes e fällt weg) · sit → si<b>tt</b>ing · swim → swi<b>mm</b>ing · run → ru<b>nn</b>ing (kurzer Vokal + Konsonant: verdoppeln)'],['Simple present oder progressive?','Every morning I <b>brush</b> my teeth. (Gewohnheit) – Look! The dog <b>is running</b> away. (jetzt)']],
 cards:[['Signalwörter present progressive','now, at the moment, Look!, Listen!'],['Bildung present progressive','am/is/are + -ing'],['make + ing','making'],['swim + ing','swimming'],['sit + ing','sitting'],['write + ing','writing']],

{id:'bio-leben',s:'bio',title:'Kennzeichen des Lebendigen',
 learn:[['Alle Lebewesen …','… haben einen <b>Stoffwechsel</b> (nehmen Stoffe auf, wandeln sie um, geben Stoffe ab) · zeigen <b>Bewegung</b> · sind <b>reizbar</b> (reagieren auf Reize) · <b>wachsen und entwickeln sich</b> · <b>pflanzen sich fort</b>.'],['Nur wenn alle Kennzeichen zutreffen','… ist etwas ein Lebewesen. Eine Kerzenflamme „bewegt sich“ und „wächst“ – sie pflanzt sich aber nicht fort und ist nicht reizbar.'],['Ordnen','Lebewesen ordnet man nach gemeinsamen Merkmalen, z. B. Wirbeltiere (mit Wirbelsäule) und Wirbellose.'],['Die Lupe','Lupe nah ans Auge, dann den Gegenstand heranführen, bis das Bild scharf ist.']],
 cards:[['5 Kennzeichen des Lebendigen','Stoffwechsel, Bewegung, Reizbarkeit, Wachstum/Entwicklung, Fortpflanzung'],['Stoffwechsel','Stoffe aufnehmen, umwandeln und abgeben'],['Reizbarkeit','auf Reize aus der Umwelt reagieren'],['Wirbeltiere','Tiere mit Wirbelsäule'],['Beispiel Reizbarkeit bei Pflanzen','Sonnenblume dreht sich zum Licht']],
 tasks:[['m','Welches Kennzeichen zeigt eine Sonnenblume, die sich zum Licht dreht?',['Reizbarkeit','Fortpflanzung','Stoffwechsel','Wachstum'],'Sie reagiert auf den Reiz Licht.'],['m','Warum ist eine Kerzenflamme kein Lebewesen?',['Sie pflanzt sich nicht fort und ist nicht reizbar.','Sie bewegt sich nicht.','Sie verbraucht keine Stoffe.','Sie wird nicht größer.'],'Es müssen alle Kennzeichen zutreffen.'],['m','Ein Hase frisst Möhren und scheidet Kot aus. Welches Kennzeichen ist gemeint?',['Stoffwechsel','Bewegung','Reizbarkeit','Entwicklung'],'Stoffe aufnehmen, umwandeln, abgeben = Stoffwechsel.'],['w','Pflanzen sind keine Lebewesen, weil sie sich nicht fortbewegen.',false,'Pflanzen bewegen sich (z. B. Blätter zum Licht) und zeigen alle Kennzeichen.'],['m','Aus der Kaulquappe wird ein Frosch. Welches Kennzeichen?',['Entwicklung','Fortpflanzung','Reizbarkeit','Stoffwechsel'],'Gestaltwandel während des Lebens = Entwicklung.']]},
{id:'bio-wirbeltiere',s:'bio',title:'Die fünf Wirbeltierklassen',
 learn:[['Fische','Schuppen, Kiemenatmung, wechselwarm, Eier (Laich) im Wasser, Flossen.'],['Lurche (Amphibien)','nackte, feuchte Schleimhaut · Larven (Kaulquappen) atmen mit Kiemen, erwachsene Tiere mit Lunge und Haut · wechselwarm · Laich im Wasser. Beispiele: Frosch, Kröte, Molch.'],['Kriechtiere (Reptilien)','trockene Hornschuppen · Lunge · wechselwarm · Eier mit lederartiger Schale an Land. Beispiele: Eidechse, Schlange, Schildkröte.'],['Vögel','Federn · Lunge mit Luftsäcken · gleichwarm · Eier mit Kalkschale.'],['Säugetiere','Haare/Fell · Lunge · gleichwarm · meist lebendgebärend · Junge werden gesäugt.'],['Wechselwarm – gleichwarm','<b>Wechselwarm</b>: Körpertemperatur hängt von der Umgebung ab (Winterstarre). <b>Gleichwarm</b>: konstante Körpertemperatur.']],
 cards:[['Körperbedeckung Fische','Schuppen'],['Körperbedeckung Lurche','nackte, feuchte Haut'],['Körperbedeckung Kriechtiere','Hornschuppen'],['Körperbedeckung Vögel','Federn'],['Körperbedeckung Säugetiere','Haare / Fell'],['gleichwarme Klassen','Vögel und Säugetiere'],['Atmung der Kaulquappe','Kiemen'],['Ist der Wal ein Fisch?','Nein – Säugetier (Lunge, säugt seine Jungen)'],['Ist die Blindschleiche eine Schlange?','Nein – eine beinlose Eidechse (Kriechtier)']],
 tasks:[['m','Zu welcher Klasse gehört der Wal?',['Säugetiere','Fische','Lurche','Kriechtiere'],'Wale atmen mit Lunge und säugen ihre Jungen.'],['m','Zu welcher Klasse gehört der Molch?',['Lurche','Kriechtiere','Fische','Säugetiere'],'Feuchte Haut, Larven im Wasser → Lurch.'],['m','Zu welcher Klasse gehört die Fledermaus?',['Säugetiere','Vögel','Kriechtiere','Lurche'],'Fell, säugt die Jungen – sie kann aber fliegen.'],['m','Zu welcher Klasse gehört der Pinguin?',['Vögel','Säugetiere','Fische','Lurche'],'Federn und Eier mit Kalkschale – nur flugunfähig.'],['m','Welche Tiere sind gleichwarm?',['Vögel und Säugetiere','Fische und Lurche','Kriechtiere und Vögel','Lurche und Säugetiere'],'Nur Vögel und Säugetiere halten ihre Körpertemperatur konstant.'],['m','Wie atmet ein erwachsener Frosch?',['mit Lunge und Haut','nur mit Kiemen','nur mit der Haut','mit Kiemen und Lunge'],'Erwachsene Lurche: Lunge + Hautatmung.'],['m','Welche Eier haben eine lederartige Schale?',['die der Kriechtiere','die der Vögel','die der Fische','die der Lurche'],'Vogeleier: Kalkschale. Kriechtiere: lederartig.'],['w','Kriechtiere fallen im Winter in eine Winterstarre, weil sie wechselwarm sind.',true,'Bei Kälte sinkt ihre Körpertemperatur.'],['w','Die Blindschleiche ist eine Schlange.',false,'Sie ist eine beinlose Eidechse.']]},
{id:'bio-anpassung',s:'bio',title:'Angepasstheit: Säuger, Vögel, Fische',
 learn:[['Fortbewegung der Säugetiere','<b>Sohlengänger</b>: ganze Fußsohle (Mensch, Bär) · <b>Zehengänger</b>: auf den Zehen (Hund, Katze) · <b>Zehenspitzengänger</b>: auf Hufen (Pferd, Rind)'],['Gebisse','<b>Fleischfresser</b> (Hund, Katze): Fangzähne, Reißzähne · <b>Pflanzenfresser</b> (Rind): breite Backenzähne, Wiederkäuer mit 4 Mägen: Pansen, Netzmagen, Blättermagen, Labmagen · <b>Allesfresser</b> (Schwein, Mensch)'],['Vögel – gebaut fürs Fliegen','Leichtbau: hohle Röhrenknochen, Luftsäcke, Hornschnabel statt Zähne · Federn: Schwung-, Deck-, Daunenfedern · Brustmuskeln sehr kräftig · Stromlinienform'],['Fische – gebaut fürs Wasser','Stromlinienform, Schleimschicht, Flossen zum Steuern, <b>Schwimmblase</b> zum Schweben, <b>Seitenlinienorgan</b> zum Spüren von Strömungen']],
 cards:[['Zehengänger','Hund, Katze'],['Sohlengänger','Mensch, Bär'],['Zehenspitzengänger','Pferd, Rind (Hufe)'],['Vier Mägen des Rindes','Pansen, Netzmagen, Blättermagen, Labmagen'],['Röhrenknochen beim Vogel','hohl → leicht'],['Daunenfedern','wärmen'],['Schwimmblase','Fisch kann im Wasser schweben'],['Seitenlinienorgan','spürt Wasserbewegungen'],['Vorfahr des Hundes','Wolf']],
 tasks:[['m','Wozu dient die Schwimmblase der Fische?',['zum Schweben in einer Wassertiefe','zum Atmen unter Wasser','zum Verdauen der Nahrung','zum Hören von Geräuschen'],'Mit der Schwimmblase gleicht der Fisch seinen Auftrieb aus.'],['m','Wie heißen die Zähne, mit denen der Hund Fleisch zerschneidet?',['Reißzähne','Fangzähne','Schneidezähne','Mahlzähne'],'Fangzähne halten fest, Reißzähne zerschneiden.'],['m','Welches Tier ist ein Zehengänger?',['Katze','Bär','Pferd','Rind'],'Katzen laufen auf den Zehen.'],['m','Welche Federn halten den Vogel warm?',['Daunenfedern','Schwungfedern','Deckfedern','Schwanzfedern'],'Daunen sind weich und isolieren.'],['m','Warum haben Vögel hohle Knochen?',['Sie sparen Gewicht.','Sie speichern dort Nahrung.','Sie wachsen dadurch schneller.','Sie können so besser hören.'],'Leichtbau erleichtert das Fliegen.'],['m','Welcher Magen gehört NICHT zum Rind?',['Kropf','Pansen','Blättermagen','Labmagen'],'Der Kropf gehört zu Vögeln.'],['w','Das Rind ist ein Wiederkäuer.',true,'Es würgt Nahrung aus dem Pansen hoch und kaut sie erneut.']]},
{id:'bio-skelett',s:'bio',title:'Skelett, Gelenke & Muskeln',
 learn:[['Aufgaben des Skeletts','stützen, schützen (Schädel → Gehirn, Brustkorb → Herz und Lunge), bewegen'],['Wirbelsäule','doppelt S-förmig – federt Stöße ab. Zwischen den Wirbeln liegen die <b>Bandscheiben</b>.'],['Gelenke','<b>Kugelgelenk</b>: Schulter, Hüfte (in alle Richtungen) · <b>Scharniergelenk</b>: Knie, Ellenbogen, Finger (in eine Richtung) · <b>Sattelgelenk</b>: Daumen · <b>Drehgelenk</b>: zwischen 1. und 2. Halswirbel'],['Gegenspielerprinzip','Muskeln können nur ziehen. Im Oberarm: <b>Bizeps</b> beugt, <b>Trizeps</b> streckt. Sie arbeiten als Gegenspieler.'],['Gesund bleiben','aufrecht sitzen, Schulranzen richtig tragen, Bewegung, Sport']],
 cards:[['Kugelgelenk','Schulter, Hüfte'],['Scharniergelenk','Knie, Ellenbogen, Finger'],['Sattelgelenk','Daumen'],['Bizeps','beugt den Arm'],['Trizeps','streckt den Arm'],['Form der Wirbelsäule','doppelte S-Form'],['Bandscheiben','Puffer zwischen den Wirbeln'],['Schädel schützt …','das Gehirn']],
 tasks:[['m','Welche Art Gelenk ist das Kniegelenk?',['Scharniergelenk','Kugelgelenk','Sattelgelenk','Drehgelenk'],'Das Knie bewegt sich in nur einer Ebene.'],['m','Welche Art Gelenk ist das Schultergelenk?',['Kugelgelenk','Scharniergelenk','Sattelgelenk','Drehgelenk'],'Der Arm lässt sich in alle Richtungen bewegen.'],['m','Welcher Muskel beugt den Arm?',['Bizeps','Trizeps','Deltamuskel','Wadenmuskel'],'Der Bizeps zieht den Unterarm nach oben.'],['m','Warum braucht ein Gelenk zwei Muskeln?',['Muskeln können nur ziehen, nicht drücken.','Ein Muskel allein wäre zu schwer.','Damit der Knochen besser wächst.','Damit das Gelenk geschmiert wird.'],'Gegenspielerprinzip: Beuger und Strecker.'],['m','Welche Aufgabe hat die doppelte S-Form der Wirbelsäule?',['Sie federt Stöße ab.','Sie macht uns größer.','Sie schützt das Herz.','Sie bildet Blut.'],'Wie eine Feder fängt sie Erschütterungen ab.'],['w','Der Daumen hat ein Sattelgelenk.',true,'Darum kann man den Daumen den anderen Fingern gegenüberstellen.']]},
{id:'bio-pflanzen',s:'bio',title:'Samenpflanzen: Bau, Blüte, Keimung',
 learn:[['Pflanzenorgane','<b>Wurzel</b>: Halt, Wasser- und Mineralstoffaufnahme · <b>Sprossachse</b> (Stängel): trägt, leitet · <b>Laubblatt</b>: Fotosynthese · <b>Blüte</b>: Fortpflanzung'],['Fotosynthese','Mit Licht und Blattgrün (Chlorophyll) stellt die Pflanze aus Wasser und Kohlenstoffdioxid Traubenzucker her. Dabei entsteht Sauerstoff.'],['Blütenbau (von außen nach innen)','Kelchblätter · Kronblätter · Staubblätter (mit Staubbeutel → Pollen) · Stempel (Narbe, Griffel, Fruchtknoten)'],['Bestäubung & Befruchtung','<b>Bestäubung</b>: Pollen gelangt auf die Narbe (durch Insekten oder Wind). <b>Befruchtung</b>: Verschmelzung im Fruchtknoten → Samen und Frucht entstehen.'],['Keimung','braucht Wasser, Wärme und Sauerstoff (Luft). Licht ist für die Keimung nicht nötig, aber für das Wachstum danach.'],['Nachweise','Stärke: Iod-Kaliumiodid-Lösung färbt <b>blauschwarz</b>. Fett: Fettfleckprobe – durchscheinender Fleck auf Papier.']],
 cards:[['Aufgabe der Wurzel','Halt, Wasser und Mineralstoffe aufnehmen'],['Was entsteht bei der Fotosynthese?','Traubenzucker und Sauerstoff'],['Was braucht die Fotosynthese?','Licht, Wasser, Kohlenstoffdioxid, Blattgrün'],['Teile des Stempels','Narbe, Griffel, Fruchtknoten'],['männlicher Blütenteil','Staubblatt'],['Bestäubung','Pollen gelangt auf die Narbe'],['Keimungsbedingungen','Wasser, Wärme, Sauerstoff'],['Stärkenachweis','Iod-Kaliumiodid-Lösung → blauschwarz'],['Fettnachweis','Fettfleckprobe']],
 tasks:[['m','Welches Gas entsteht bei der Fotosynthese?',['Sauerstoff','Kohlenstoffdioxid','Stickstoff','Wasserstoff'],'Pflanzen geben Sauerstoff ab.'],['m','Wo entsteht nach der Befruchtung der Samen?',['im Fruchtknoten','im Staubbeutel','in der Narbe','im Kelchblatt'],'Aus dem Fruchtknoten wird die Frucht mit den Samen.'],['m','Was braucht ein Samen NICHT zum Keimen?',['Licht','Wasser','Wärme','Sauerstoff'],'Bohnen keimen auch im Dunkeln.'],['m','Wie färbt sich Stärke mit Iod-Kaliumiodid-Lösung?',['blauschwarz','rot','gelb','grün'],'Typischer Stärkenachweis, z. B. bei der Kartoffel.'],['m','Wo sitzt der Pollen?',['im Staubbeutel','im Fruchtknoten','auf dem Kelchblatt','im Griffel'],'Staubblätter bestehen aus Staubfaden und Staubbeutel.'],['m','Was ist Bestäubung?',['Pollen gelangt auf die Narbe.','Samen fallen auf den Boden.','Blätter nehmen Licht auf.','Die Wurzel nimmt Wasser auf.'],'Danach kann die Befruchtung folgen.'],['w','Ein Experiment protokolliert man mit Frage, Vermutung, Durchführung, Beobachtung und Auswertung.',true,'Das ist das Protokollschema.']]},
{id:'bio-nahrung',s:'bio',title:'Nahrungsketten & Nutztiere',
 learn:[['Nahrungskette','Gras → Kaninchen → Fuchs. Der Pfeil bedeutet „wird gefressen von“.<br><b>Erzeuger (Produzenten)</b>: Pflanzen. <b>Verbraucher (Konsumenten)</b>: Tiere.'],['Nutztiere','Rind (Milch, Fleisch, Leder), Schwein (Fleisch), Huhn (Eier, Fleisch), Schaf (Wolle). Artgerechte Haltung: genug Platz, Auslauf, Licht, Kontakt zu Artgenossen, passendes Futter.']],
 cards:[['Erzeuger (Produzenten)','grüne Pflanzen'],['Verbraucher (Konsumenten)','Tiere'],['Pfeil in der Nahrungskette bedeutet','wird gefressen von'],['artgerechte Haltung','Platz, Auslauf, Licht, Artgenossen, passendes Futter']],
 tasks:[['m','Welche Nahrungskette ist richtig?',['Gras → Kaninchen → Fuchs','Fuchs → Kaninchen → Gras','Kaninchen → Gras → Fuchs','Gras → Fuchs → Kaninchen'],'Am Anfang steht immer eine Pflanze.'],['m','Wer steht am Anfang jeder Nahrungskette?',['eine Pflanze','ein Pflanzenfresser','ein Raubtier','ein Pilz'],'Pflanzen sind die Erzeuger.'],['w','Hühner brauchen für eine artgerechte Haltung Auslauf und Sandbäder.',true,'Sie scharren und baden gern im Sand.']]},

{id:'geo-erde',s:'geo',title:'Die Erde als Planet',
 learn:[['Unser Sonnensystem','8 Planeten: Merkur, Venus, <b>Erde</b>, Mars, Jupiter, Saturn, Uranus, Neptun. Merksatz: <i>Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel.</i>'],['Erdrotation','Die Erde dreht sich in <b>24 Stunden</b> einmal um sich selbst (von West nach Ost) → Tag und Nacht.'],['Erdrevolution','In etwa <b>365 Tagen</b> umläuft die Erde die Sonne. Weil die Erdachse schräg steht, gibt es Jahreszeiten.'],['Wichtige Linien','<b>Äquator</b>: teilt die Erde in Nord- und Südhalbkugel · <b>Nordpol und Südpol</b>: Endpunkte der Erdachse']],

{id:'geo-orientierung',s:'geo',title:'Gradnetz, Himmelsrichtungen & Karten',
 learn:[['Himmelsrichtungen','N, O, S, W – dazwischen NO, SO, SW, NW. Die Sonne steht mittags im Süden. Kompassnadel zeigt nach Norden.'],['Gradnetz','<b>Breitenkreise</b>: parallel zum Äquator (0°) bis 90° N bzw. 90° S. <b>Längenhalbkreise (Meridiane)</b>: von Pol zu Pol, vom <b>Nullmeridian</b> (Greenwich bei London) bis 180° O bzw. W.'],['Karten','<b>Physische Karte</b>: Höhen (grün = Tiefland, gelb/braun = Gebirge), Flüsse, Städte. <b>Thematische Karte</b>: ein bestimmtes Thema (z. B. Klima, Bodenschätze). Die <b>Legende</b> erklärt die Zeichen.'],['Maßstab','1 : 100 000 → 1 cm auf der Karte = 100 000 cm = 1 km in Wirklichkeit. Großer Maßstab = viele Details, kleiner Ausschnitt.'],['Atlas','Im <b>Register</b> findest du einen Ort mit Seitenzahl und Planquadrat (z. B. 34 C3).']],

 tasks:[['m','Wo steht die Sonne bei uns um 12 Uhr mittags?',['im Süden','im Norden','im Osten','im Westen'],'Morgens Osten, mittags Süden, abends Westen.'],['m','Wodurch verläuft der Nullmeridian?',['Greenwich bei London','Berlin','Paris','den Nordpol und den Äquator'],'Er wurde 1884 festgelegt.'],['m','Was zeigt eine braune Farbe auf einer physischen Karte?',['Gebirge','Wüste','Tiefland','Städte'],'Je höher, desto dunkler das Braun.'],['m','Welche Karte zeigt die Bodenschätze Deutschlands?',['eine thematische Karte','eine physische Karte','ein Stadtplan','eine Wanderkarte'],'Thematische Karten zeigen ein bestimmtes Thema.'],['m','Welcher Maßstab zeigt mehr Einzelheiten?',['1 : 25 000','1 : 1 000 000','1 : 500 000','1 : 100 000'],'Je kleiner die Zahl hinter dem Doppelpunkt, desto größer der Maßstab und desto genauer.'],['w','Breitenkreise verlaufen von Pol zu Pol.',false,'Das sind die Längenhalbkreise (Meridiane).']]},

{id:'ge-zeit',s:'ge',title:'Zeitrechnung & Quellen',gen:'jahrhundert',genShare:.45,
 learn:[['Zeitrechnung','Unsere Zeitrechnung beginnt mit Christi Geburt. Vorher: <b>v. Chr.</b> (rückwärts gezählt), danach: <b>n. Chr.</b> Ein Jahr 0 gibt es nicht.'],['Jahrhunderte','1. Jahrhundert = Jahre 1–100 · 2. Jh. = 101–200 · Das Jahr 2026 liegt im 21. Jahrhundert.'],['Zeitstrahl','Ereignisse werden in der richtigen Reihenfolge auf einer Linie eingetragen. Gleiche Abstände für gleiche Zeitspannen!'],['Quellen','Zeugnisse aus der Vergangenheit: <b>gegenständlich</b> (Werkzeug, Münze), <b>schriftlich</b> (Brief, Urkunde), <b>bildlich</b> (Gemälde, Foto), <b>mündlich</b> (Erzählung von Zeitzeugen).<br><b>Darstellung</b>: Später geschrieben, z. B. Schulbuchtext.'],['Archäologie','Wissenschaft, die Funde im Boden ausgräbt und untersucht.']],

{id:'ge-urgeschichte',s:'ge',title:'Ur- und Frühgeschichte',
 learn:[['Altsteinzeit','Menschen lebten als <b>Jäger und Sammler</b>, zogen umher (<b>Nomaden</b>), nutzten Feuer, Faustkeil, Speere. Höhlenmalereien zeigen Tiere.'],['Jungsteinzeit','<b>Neolithische Revolution</b>: Ackerbau und Viehzucht → Menschen werden <b>sesshaft</b>, bauen Langhäuser, töpfern, weben, schleifen Steinwerkzeuge.'],['Metallzeit','Kupfer → <b>Bronze</b> (Kupfer + Zinn) → <b>Eisen</b>. Handel und Handwerk nehmen zu.'],['Himmelsscheibe von Nebra','1999 bei Nebra in Sachsen-Anhalt gefunden, etwa 3 600 Jahre alt (Bronzezeit). Älteste bekannte konkrete Darstellung des Himmels. Heute im Landesmuseum für Vorgeschichte in Halle.'],['Ötzi','Gletschermumie, ca. 5 300 Jahre alt, 1991 in den Ötztaler Alpen gefunden. Hatte ein Kupferbeil dabei.']],
 cards:[['Neolithische Revolution','Übergang zu Ackerbau, Viehzucht und Sesshaftigkeit'],['Nomaden','Menschen ohne festen Wohnsitz'],['Bronze besteht aus …','Kupfer und Zinn'],['Fundort Himmelsscheibe','Nebra (Sachsen-Anhalt)'],['Alter der Himmelsscheibe','etwa 3 600 Jahre'],['Wo ist die Himmelsscheibe heute?','Landesmuseum für Vorgeschichte Halle'],['Werkzeug der Altsteinzeit','Faustkeil'],['Ötzi – Alter','etwa 5 300 Jahre']],

{id:'ge-aegypten',s:'ge',title:'Ägypten – eine Hochkultur',

 ['Die Brüder Grimm','<b>Jacob und Wilhelm Grimm</b> sammelten Volksmärchen und schrieben sie auf. 1812 erschien der erste Band ihrer <b>„Kinder- und Hausmärchen“</b>. Beispiele: Rotkäppchen, Hänsel und Gretel, Schneewittchen, Frau Holle, Rumpelstilzchen, Aschenputtel, Der Froschkönig.<br>Kunstmärchen schrieben z. B. <b>Hans Christian Andersen</b> (Das hässliche Entlein, Des Kaisers neue Kleider) und <b>Wilhelm Hauff</b> (Der kleine Muck, Kalif Storch).'],
 ['Merkmale – die musst du kennen!','• <b>Anfangsformel</b>: „Es war einmal …“<br>• <b>Schlussformel</b>: „Und wenn sie nicht gestorben sind, dann leben sie noch heute.“<br>• <b>Ort und Zeit unbestimmt</b> (irgendwo, irgendwann)<br>• <b>Gut gegen Böse</b> – das Gute wird belohnt, das Böse bestraft<br>• <b>Gegensätze</b>: arm – reich, klug – dumm, schön – hässlich, fleißig – faul<br>• <b>Magische Zahlen</b>: 3, 7, 12<br>• <b>Zauberei und Wunder</b>, Verwandlungen<br>• <b>Sprechende Tiere</b>, Pflanzen oder Gegenstände<br>• <b>Zaubersprüche und Reime</b><br>• <b>Prüfungen/Aufgaben</b>, oft dreimal und immer schwerer<br>• <b>Helfer und Zaubergaben</b><br>• Figuren ohne echte Namen („der König“) oder mit <b>sprechenden Namen</b> (Rotkäppchen)<br>• <b>Glückliches Ende</b><br>• erzählt im <b>Präteritum</b>'],

{id:'de-maerchen-text',s:'de',title:'Märchen: Merkmale im Text finden',
 text:`<p style="text-align:center"><b>Das Lied des Raben</b></p><p>Es war einmal ein armer Korbflechter, der hatte drei Söhne. Die beiden älteren waren stark, aber hochmütig. Der jüngste, Hans, war klein und still, und alle lachten über ihn.</p><p>Eines Tages ließ der König verkünden: „Ein böser Zauberer hat meine Tochter in den Turm am Schwarzen Moor gesperrt. Wer sie befreit, soll sie zur Frau bekommen.“</p><p>Zuerst zog der älteste Bruder los. Am Waldrand saß eine alte Frau und bat um ein Stück Brot. „Ich habe selbst nicht genug“, rief er und ging weiter. Er kam nie zurück. Dem zweiten Bruder erging es genauso.</p><p>Zuletzt machte sich Hans auf den Weg. Als die alte Frau ihn um Brot bat, teilte er seinen letzten Kanten mit ihr. Da sprach sie: „Weil du ein gutes Herz hast, schenke ich dir diesen Raben. Er wird dir dreimal helfen.“</p><p>Der Rabe führte Hans durch den finsteren Wald, warnte ihn vor einer tiefen Schlucht und fand den geheimen Eingang zum Turm. Dort stand der Zauberer und lachte: „Kleiner Wicht, was willst du hier?“</p><p>Doch der Rabe flog auf Hans' Schulter und sang:<br><i>„Nebel, Nebel, weiche fort,<br>Zauber, brich an diesem Ort!“</i></p><p>Da zerfiel der Zauberer zu grauem Staub. Auch die beiden Brüder, die er in Steine verwandelt hatte, wurden wieder lebendig.</p><p>Hans führte die Königstochter heim, und bald wurde Hochzeit gefeiert. Und wenn sie nicht gestorben sind, dann leben sie noch heute.</p>`,
 learn:[['So gehst du in der Arbeit vor','1. Text genau lesen. 2. Merkmale mit Bleistift markieren (Anfang, Schluss, Zahlen, Zauber, Helfer, Gegensätze). 3. Jedes Merkmal <b>mit Textstelle belegen</b>: „Das Märchen beginnt mit der typischen Anfangsformel ‚Es war einmal‘.“']],

function normTask(t,tid){if(!Array.isArray(t))return {...t,tid};const [k,q,a,ex,o]=t;return {t:k==='m'?'m':k==='w'?'w':'i',q,a,ex,cs:o==='cs',tid}}
function cardTasks(tp){
 const c=tp.cards||[],out=[];if(!c.length)return out;
 const backs=c.map(x=>first(x[1])),fronts=c.map(x=>x[0]);
 c.forEach(([f,b],i)=>{
  const others=shuffle([...new Set(backs)].filter(x=>x!==backs[i])).slice(0,3);
  if(tp.vok){
   const fa=f.replace(/^(der|die|das) /i,'');
   out.push({t:'i',q:`<span class="k">Übersetze ins ${tp.lb||'Englische'}</span><b>${esc(f)}</b>`,a:b,ex:`${esc(f)} = ${esc(b.split('|').join(' / '))}`,tid:tp.id});
   out.push({t:'i',q:`<span class="k">Was heißt auf ${tp.la||'Deutsch'}?</span><b>${esc(first(b))}</b>`,a:f+'|'+fa,ex:`${esc(first(b))} = ${esc(f)}`,tid:tp.id});
   if(others.length>=3)out.push({t:'m',q:`<span class="k">Was passt?</span><b>${esc(f)}</b>`,a:[first(b),...others],ex:`${esc(f)} = ${esc(first(b))}`,tid:tp.id});
  }else{
   const q=tp.id==='geo-laender'?`Wie heißt die Hauptstadt von <b>${esc(f)}</b>?`:`<span class="k">Was passt?</span>${esc(f)}`;
   if(others.length>=2)out.push({t:'m',q,a:[first(b),...others],ex:`${esc(f)} → ${esc(first(b))}`,tid:tp.id});
   else out.push({t:'i',q,a:b,ex:`${esc(f)} → ${esc(first(b))}`,tid:tp.id});
  }
 });return out;
}
const tkey=t=>t.q+'#'+(Array.isArray(t.a)?t.a[0]:t.a);
function ordered(list){const miss=[],fresh=[],done=[];list.forEach(t=>{const k=tkey(t);if(S.miss[k])miss.push(t);else if(S.done[k])done.push(t);else fresh.push(t)});done.sort((x,y)=>S.done[tkey(x)]-S.done[tkey(y)]);return {list:shuffle(miss).concat(shuffle(fresh)).concat(done),nNew:miss.length+fresh.length}}
function genFresh(tp,seen){let t;for(let i=0;i<15;i++){t={...GEN[tp.gen](),tid:tp.id};const k=tkey(t);if(!S.done[k]&&!seen.has(k))break}seen.add(tkey(t));return t}
/* Mischung: ca. 1/3 Theorie, 2/3 Anwendung. Neue und falsche Aufgaben zuerst, richtig gelöste erst, wenn nichts Neues mehr da ist. */
function tasksFor(tp,n,thN){
 const seen=new Set();
 const th=ordered((tp.th||[]).map(x=>({...normTask(x,tp.id),th:true})));
 let ap=(tp.tasks||[]).map(x=>normTask(x,tp.id));if(tp.auto||tp.vok)ap=ap.concat(cardTasks(tp));
 const apO=ordered(ap);
 if(!tp.gen&&thN==null){const fr=th.nNew+apO.nNew;if(fr>=4&&fr<n)n=fr;else if(fr<4&&(th.list.length+apO.list.length)>=4)tp._again=true}
 let nTh=thN!=null?thN:(th.list.length?Math.round(n*(tp.thShare||1/3)):0);
 if(tp.gen&&nTh>th.nNew)nTh=th.nNew;
 nTh=Math.min(nTh,th.list.length,n);
 const out=th.list.slice(0,nTh);
 const rest=n-out.length;let nStat=rest,gn=0;
 if(tp.gen){gn=apO.list.length?Math.round(rest*(tp.genShare||.7)):rest;nStat=rest-gn;if(nStat>apO.nNew){gn+=nStat-apO.nNew;nStat=apO.nNew}}
 out.push(...apO.list.slice(0,nStat));
 for(let i=0;i<gn;i++)out.push(genFresh(tp,seen));
 if(out.length<n)out.push(...th.list.slice(nTh,nTh+n-out.length));
 const isD=t=>!!S.done[tkey(t)]&&!S.miss[tkey(t)];const used=new Set(out.map(tkey));
 const spare=[...th.list,...apO.list].filter(t=>!isD(t)&&!used.has(tkey(t)));
 for(let i=0;i<out.length&&spare.length;i++)if(isD(out[i]))out[i]=spare.shift();
 return shuffle(out);
}
function cardsOf(tp){return (tp.cards||[]).map(([f,b])=>({key:tp.id+'|'+f,f,b,tid:tp.id,vok:tp.vok}))}

function norm(s,cs){s=String(s).replace(/[’‘`´]/g,"'").replace(/[„“”"]/g,'').replace(/\s+/g,' ').trim().replace(/[.!]+$/,'');return cs?s:s.toLowerCase()}
const isNum=s=>/^-?\d+([.,]\d+)?$/.test(String(s).replace(/[\s ]/g,''));
function toNum(s){s=String(s).replace(/[\s ]/g,'').replace('−','-');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+/.test(s))s=s.replace(/\./g,'');const m=s.match(/^-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
function check(t,v){
 if(v==null||v==='')return false;
 if(t.t==='m')return v===t.a[0];
 if(t.t==='w')return v===t.a;
 return String(t.a).split('|').some(a=>{
  if(isNum(a))return toNum(v)===toNum(a);
  if(/^\d+\/\d+$/.test(a))return String(v).replace(/\s/g,'')===a;
  return norm(v,t.cs)===norm(a,t.cs);
 });
}
const showAns=t=>{if(t.t==='m')return t.a[0];if(t.t==='w')return t.a?'Stimmt':'Stimmt nicht';const a=first(t.a);return isNum(a)&&Number.isInteger(toNum(a))?fmt(toNum(a)):a};

function colInit(t){if(t._c)return t._c;const A=String(t.col.a),B=String(t.col.b),n=Math.max(A.length,B.length)+1;t._c={n,r:Array(n).fill(''),c:Array(n).fill(''),row:'r',i:n-1};return t._c}
function colVal(t){const c=colInit(t);const s=c.r.map(x=>x===''?' ':x).join('').trim();if(!s||s.includes(' '))return s?'?':'';return s.replace(/^0+(?=\d)/,'')}
function colUI(t,done,testMode){
 const c=colInit(t),n=c.n,A=String(t.col.a).padStart(n,' '),B=String(t.col.b).padStart(n,' ');const res=String(first(t.a)).padStart(n,' ');
 const cell=(row,i)=>{const v=c[row][i];let cl='cc in'+(row==='c'?' cy':'');if(!done&&c.row===row&&c.i===i)cl+=' sel';if(done&&row==='r'){cl+=(v===(res[i]===' '?'':res[i]))?' ok':' no'}return `<div class="${cl}" ${done?'':`onclick="colSel('${row}',${i})"`}>${v}</div>`};
 let h=`<div class="colg" style="grid-template-columns:repeat(${n+1},minmax(0,46px))">`;
 h+=`<div class="cc"></div>`+[...A].map(d=>`<div class="cc">${d.trim()}</div>`).join('');
 h+=`<div class="cc">${t.col.op}</div>`+[...B].map(d=>`<div class="cc">${d.trim()}</div>`).join('');
 h+=`<div class="cc cy mut" style="font-size:.6rem">Ü</div>`+Array.from({length:n},(_,i)=>cell('c',i)).join('');
 h+=`<div class="cline"></div><div class="cc">=</div>`+Array.from({length:n},(_,i)=>cell('r',i)).join('')+`</div>`;
 if(!done){h+=`<p class="small mut center" style="margin:0 0 6px">Von rechts nach links rechnen. Tippe ein Kästchen an, um es zu ändern – das „Ü“-Feld ist für Überträge.</p><div class="kp">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button onclick="colKey('${d}')">${d}</button>`).join('')}<button onclick="colKey('del')">⌫</button><button onclick="colKey('clr')" class="small">Alles<br>löschen</button></div>`;
  if(!testMode)h+=`<button class="btn" onclick="quizIn()">Prüfen</button>`}
 return h;
}
function colTask(){const p=view.p;return p.tasks[p.i]}
function colSel(row,i){const c=colInit(colTask());c.row=row;c.i=i;render()}
function colKey(k){const t=colTask(),c=colInit(t);
 if(k==='clr'){c.r.fill('');c.c.fill('');c.row='r';c.i=c.n-1}
 else if(k==='del'){if(c[c.row][c.i]!=='')c[c.row][c.i]='';else if(c.i<c.n-1){c.i++;c[c.row][c.i]=''}}
 else{c[c.row][c.i]=k;if(c.row==='r'&&c.i>0)c.i--;else if(c.row==='c'){c.row='r'}}
 if(view.n==='test'){view.p.ans[view.p.i]=colVal(t);view.p.sure=false}
 render()}

function paperUI(t){if(!t.tid||!String(t.tid).startsWith('ma-'))return '';const on=view.p.paper;
 return `<button class="btn sec2" onclick="view.p.paper=!view.p.paper;render()">✏️ Rechenpapier ${on?'ausblenden':'zeigen'}</button>${on?`<div class="paper"><canvas id="paper"></canvas></div><div class="row2"><button class="btn sec2" onclick="paperUndo()">↶ Zurück</button><button class="btn sec2" onclick="paperClear()">🧽 Wegwischen</button></div>`:''}`}
let PAPER={strokes:[],key:null};
function initPaper(){const cv=$('#paper');if(!cv)return;const t=view.p.tasks&&view.p.tasks[view.p.i];const key=t?tkey(t)+view.p.i:'';if(PAPER.key!==key){PAPER={strokes:[],key}}
 const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineCap='round';g.lineJoin='round';g.lineWidth=2.6;g.strokeStyle='#1e3a8a';
 const redraw=()=>{g.clearRect(0,0,r.width,r.height);PAPER.strokes.forEach(s=>{g.beginPath();s.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke()})};redraw();
 let cur=null;const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pos(e)];PAPER.strokes.push(cur);redraw()};
 cv.onpointermove=e=>{if(!cur)return;cur.push(pos(e));const s=cur;g.beginPath();g.moveTo(s[s.length-2][0],s[s.length-2][1]);g.lineTo(s[s.length-1][0],s[s.length-1][1]);g.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>{cur=null};
 PAPER.redraw=redraw}
function paperClear(){PAPER.strokes=[];PAPER.redraw&&PAPER.redraw()}

function elternRemind(){

 return `<div class="sec">Tägliche Erinnerung</div>${can?`<p class="small mut">Kommt nur, wenn Henry an dem Tag noch nichts gelernt hat. Muss auf jedem Gerät einmal eingeschaltet werden (App vorher installieren).</p>

 <button class="btn sec2" onclick="pushTest()">Test-Erinnerung an alle Geräte senden</button>
 <details style="margin-top:8px"><summary class="small mut">Zeitsteuerung einrichten (einmalig)</summary><p class="small mut">Damit die Erinnerung pünktlich kommt, muss der Server regelmäßig angestoßen werden. Lege bei IONOS unter „Cronjobs“ (oder kostenlos bei cron-job.org) einen Aufruf <b>alle 15 Minuten</b> mit dieser Adresse an:</p><input readonly id="cronurl" value="${esc(VIEWS._cron||'wird geladen …')}" onclick="this.select()"><button class="btn sec2" onclick="cpCron()">Adresse kopieren</button></details>`:'<p class="small mut">Erinnerungen gehen nur in der installierten App im Leuchtturm.</p>'}`}
async function loadCron(){if(!SYNC.on||!SYNC.pin||VIEWS._cron)return;try{const j=await api('cronkey',{pin:SYNC.pin});if(j.key){VIEWS._cron=location.href.split('#')[0].replace(/[^/]*$/,'')+'api.php?a=cron&key='+j.key;const el=$('#cronurl');if(el)el.value=VIEWS._cron}}catch(e){}}
function cpCron(){const el=$('#cronurl');el.select();try{navigator.clipboard.writeText(el.value).then(()=>toast('Kopiert ✓'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
function b64u8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function pushEnable(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){toast('Erinnerungen gehen nur in der installierten App (auf dem iPad: vom Home-Bildschirm aus öffnen).');return}
 try{const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Benachrichtigungen wurden nicht erlaubt – in den Einstellungen des Geräts freigeben.');return}
  const reg=await navigator.serviceWorker.ready;const j=await api('vapid',{pin:SYNC.pin});if(!j.key)throw 0;
  let sub=await reg.pushManager.getSubscription();if(sub){try{await sub.unsubscribe()}catch(e){}}
  sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(j.key)});
  const r=await api('sub',{pin:SYNC.pin,sub:sub.toJSON(),dev:navigator.userAgent.slice(0,120)});if(!r.ok)throw 0;
  lsSet('lb_push','1');toast('🔔 Erinnerung ist eingeschaltet');render();
 }catch(e){toast('Das hat nicht geklappt. Ist die App installiert und online?')}}

VIEWS.abfrage=p=>{
 if(!ELTERN_OK)return VIEWS.eltern(view.p);
 if(p.run)return abfrageRun(p);
 p.s=p.s||'de';const ts=topicsOf(p.s).filter(t=>(t.cards||[]).length||(t.tasks||[]).length||t.gen||(t.th||[]).length);
 if(!p.sel||p.selS!==p.s){p.sel=[];p.selS=p.s}p.n=p.n||15;p.opt=p.opt??false;
 return hdr('🗣️ Abfragen','#64748b')+`<p class="small mut">Du siehst Frage und Lösung, Henry antwortet mündlich. Was er nicht weiß, kommt in seine Liste „Fehler wiederholen“.</p>
 <div class="sec">Fach</div><div class="chips">${SUBJECTS.filter(s=>topicsOf(s.id).length).map(s=>`<button class="chip ${p.s===s.id?'on':''}" onclick="view.p.s='${s.id}';render()">${s.icon} ${s.name}</button>`).join('')}</div>
 <div class="sec">Themen</div><div class="list">${ts.map(t=>`<label class="cb"><input type="checkbox" ${p.sel.includes(t.id)?'checked':''} onchange="abTog('${t.id}')"><span>${esc(t.title)}<br><small class="mut">${topicScore(t.id)==null?'noch nicht geübt':'Sicherheit '+topicScore(t.id)+' %'}</small></span></label>`).join('')}</div>
 <div class="sec">Anzahl Fragen</div><div class="chips">${[10,15,20,30].map(n=>`<button class="chip ${p.n===n?'on':''}" onclick="view.p.n=${n};render()">${n}</button>`).join('')}</div>
 <div class="sec">Antwortmöglichkeiten</div><div class="chips"><button class="chip ${!p.opt?'on':''}" onclick="view.p.opt=false;render()">frei antworten</button><button class="chip ${p.opt?'on':''}" onclick="view.p.opt=true;render()">vorlesen lassen (A, B, C, D)</button></div>
 <button class="btn" ${p.sel.length?'':'disabled'} onclick="abStart()">Abfrage starten</button>`;
};
function abTog(id){const p=view.p;p.sel=p.sel.includes(id)?p.sel.filter(x=>x!==id):[...p.sel,id];render()}
function abStart(){const p=view.p;const ts=p.sel.map(topic).filter(Boolean);const per=Math.ceil(p.n/ts.length);let qs=[];
 ts.forEach(t=>{const cards=shuffle(cardsOf(t)).map(c=>({q:esc(c.f),ans:esc(c.b.split('|').join(' / ')),tid:t.id,card:c}));
  const tasks=tasksFor(t,per).map(x=>({q:x.q,ans:esc(showAns(x)),ex:x.ex,opts:x.t==='m'?shuffle(x.a):null,tid:t.id,task:x}));
  const nC=Math.min(cards.length,Math.round(per/2));qs.push(...shuffle(cards.slice(0,nC).concat(tasks.slice(0,per-nC))))});
 const seen=new Set();qs=shuffle(qs).filter(q=>{const k=q.q+q.ans;if(seen.has(k))return false;seen.add(k);return true}).slice(0,p.n);
 const sb=subj(ts[0].s);Object.assign(p,{run:true,qs,i:0,res:[],show:false,title:ts.length===1?ts[0].title:sb.name});render()}
function abfrageRun(p){
 if(p.i>=p.qs.length)return abfrageEnd(p);
 const q=p.qs[p.i];
 return hdr('🗣️ '+esc(p.title),'#64748b',`<span class="pill">${p.i+1}/${p.qs.length}</span>`)+`<div class="prog"><i style="width:${p.i/p.qs.length*100}%"></i></div>
 ${topic(q.tid)&&topic(q.tid).text?`<details class="text"><summary>Lesetext (Henry darf ihn ansehen)</summary>${topic(q.tid).text}</details>`:''}<div class="q"><span class="k">${q.card?'Karteikarte – was weißt du dazu?':'Frage an Henry'}</span>${q.q}${p.opt&&q.opts?`<div class="small" style="margin-top:10px;line-height:1.7">${q.opts.map((o,j)=>`<b>${'ABCD'[j]})</b> ${o}`).join('<br>')}</div>`:''}</div>
 ${p.show?`<div class="fb ok" style="background:#38bdf81a;border-color:#38bdf866"><b>Lösung: ${q.ans}</b>${q.ex?`<div class="small">${q.ex}</div>`:''}</div>`:`<button class="btn sec2" onclick="view.p.show=true;render()">👁 Lösung anzeigen</button>`}
 <div class="row2" style="margin-top:6px"><button class="btn no" onclick="abRate(false)">✗ nicht gewusst</button><button class="btn ok" onclick="abRate(true)">✓ gewusst</button></div>
 <button class="btn sec2" onclick="abRate(null)">Überspringen</button>`;
}
function abRate(ok){const p=view.p,q=p.qs[p.i];p.res[p.i]=ok;
 if(ok!==null){const st=S.tp[q.tid]||(S.tp[q.tid]={});
  if(q.task){const k=tkey(q.task);if(ok){st.r=(st.r||0)+1;S.done[k]=Date.now();delete S.miss[k]}else{st.w=(st.w||0)+1;S.miss[k]={...q.task,_o:undefined}}}
  if(q.card){const s=S.cards[q.card.key]||{b:0};if(ok){s.b=Math.min(5,(s.b||0)+1);s.d=today(INT[s.b])}else{s.b=1;s.d=today()}S.cards[q.card.key]=s;if(ok)st.r=(st.r||0)+1;else st.w=(st.w||0)+1}}
 p.i++;p.show=false;render();scrollTo(0,0)}
function abfrageEnd(p){
 const rated=p.res.filter(x=>x!==null),r=rated.filter(Boolean).length,n=rated.length,pct=n?Math.round(r/n*100):0,g=grade(pct);
 if(!p.saved&&n){p.saved=true;S.tests.push({d:today(),title:'Abfrage: '+p.title,s:subj(topic(p.qs[0].tid).s).id,n,r,g,sec:0});addXP(r*5);
  [...new Set(p.qs.map(q=>q.tid))].forEach(id=>{const idx=p.qs.map((q,j)=>q.tid===id&&p.res[j]!==null?j:-1).filter(j=>j>=0);if(!idx.length)return;const pc=Math.round(idx.filter(j=>p.res[j]).length/idx.length*100);const st=S.tp[id]||(S.tp[id]={});st.sc=st.sc==null?pc:Math.round(st.sc*.5+pc*.5)});save()}
 const wrong=p.qs.filter((_,j)=>p.res[j]===false);
 return hdr('🗣️ Auswertung','#64748b')+`<p class="center mut" style="margin:0">${esc(p.title)}</p><div class="note">${n?g:'–'}</div><p class="center"><b>${r} von ${n} gewusst (${pct} %)</b><br><span class="small mut">Henry bekommt +${r*5} XP und Münzen</span></p>
 ${wrong.length?`<div class="sec">Nicht gewusst – zum Nachlernen</div>${wrong.map(q=>`<div class="rev no"><div>${q.q}</div><div class="small" style="margin-top:4px">Lösung: <b>${q.ans}</b></div></div>`).join('')}<p class="small mut">Henry übt diese Fragen jetzt unter „Trainieren → Fehler wiederholen“ und als fällige Karteikarten unter „Merken“.</p>`:'<p class="center">🏆 Alles gewusst!</p>'}
 <button class="btn" onclick="go('abfrage',{s:'${subj(topic(p.qs[0].tid).s).id}'},true)">Neue Abfrage</button><button class="btn sec2" onclick="go('eltern',{ok:true},true)">Zum Eltern-Bereich</button>`;
}

 ${weak.length?`<div class="sec">Hier hakt es noch</div>${weak.map(t=>`<div class="item"><span>${subj(t.s).icon}</span><div class="t">${esc(t.title)}<small>Sicherheit ${topicScore(t.id)} %</small></div><button class="pill" onclick="go('abfrage',{s:'${t.s}',sel:['${t.id}'],selS:'${t.s}'})">abfragen</button></div>`).join('')}`:''}
 ${lastT.length?`<div class="sec">Letzte Tests</div>${lastT.map(h=>`<div class="item"><b style="font-size:1.3rem;width:30px;text-align:center">${h.g}</b><div class="t">${esc(h.title)}<small>${h.d.split('-').reverse().join('.')} · ${h.r}/${h.n} richtig</small></div></div>`).join('')}`:''}
 ${SYNC.on&&SYNC.pin&&lsGet('lb_push')!=='1'&&'PushManager' in window?`<button class="item" style="margin-top:12px" onclick="pushEnable()"><span style="font-size:1.5rem">🔔</span><div class="t"><b>Benachrichtigung einschalten</b><small>Du bekommst Bescheid, wenn ${kidName()} bis zur Erinnerungszeit nicht gelernt hat</small></div>›</button>`:''}`;
};
async function refreshParent(){if(SYNC.on&&SYNC.pin){await pull();toast('Aktualisiert')}render()}
VIEWS.loesungen=({id})=>{const t=topic(id);if(!t)return VIEWS.home();
 const th=(t.th||[]).map(x=>normTask(x,t.id)),ap=(t.tasks||[]).map(x=>normTask(x,t.id)),ex=t.gen?Array.from({length:5},()=>GEN[t.gen]()):[];
 const row=(x,lab)=>`<div class="rev ok"><div>${lab?`<span class="badge" style="background:#38bdf833;color:#7dd3fc">${lab}</span> `:''}${x.q}</div>${x.t==='m'?`<div class="small mut" style="margin-top:4px">Auswahl: ${x.a.map((o,j)=>j?esc(o):'<b style="color:#86efac">'+o+'</b>').join(' · ')}</div>`:`<div class="small" style="margin-top:4px">Lösung: <b style="color:#86efac">${esc(showAns(x))}</b></div>`}${x.ex?`<div class="small mut">${x.ex}</div>`:''}</div>`;
 return hdr('📋 Aufgaben & Lösungen',subj(t.s).color)+`<p class="small mut">${esc(t.title)} – ${th.length} Theorie · ${ap.length} Anwendung · ${(t.cards||[]).length} Karteikarten${t.gen?' · dazu unbegrenzt neu erzeugte Rechenaufgaben (5 Beispiele unten)':''}</p>
 ${t.text?`<details class="text"><summary>Lesetext</summary>${t.text}</details>`:''}
 ${th.length?`<div class="sec">Theorie</div>${th.map(x=>row(x)).join('')}`:''}${ap.length?`<div class="sec">Anwendung</div>${ap.map(x=>row(x)).join('')}`:''}${ex.length?`<div class="sec">Beispiele (zufällig erzeugt)</div>${ex.map(x=>row(x)).join('')}`:''}
 ${(t.cards||[]).length?`<div class="sec">Karteikarten</div><div class="box">${t.cards.map(([f,b])=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${esc(f)}</b> – ${esc(b.split('|').join(' / '))}</div>`).join('')}</div>`:''}`};

/* ---------- Installieren ---------- */
let INSTALL=null;
const isApp=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(view.n==='home')render()});
window.addEventListener('appinstalled',()=>{INSTALL=null;toast('📲 Lernbasis ist installiert!');render()});
async function installApp(){if(INSTALL){INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()}else go('install')}
VIEWS.install=()=>{const ios=/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;const sam=/SamsungBrowser/.test(navigator.userAgent);
 return hdr('📲 Als App installieren','#38bdf8')+(ios?`<div class="box"><h3>iPad / iPhone (Safari)</h3>1. Unten oder oben auf das <b>Teilen-Symbol</b> (Quadrat mit Pfeil) tippen.<br>2. <b>„Zum Home-Bildschirm“</b> wählen.<br>3. Oben rechts <b>„Hinzufügen“</b>.</div>`:'')+
 `<div class="box"><h3>${sam?'Samsung Internet':'Chrome (Android)'}</h3>${sam?'1. Unten auf <b>☰</b> tippen.<br>2. <b>„Seite hinzufügen zu“</b> → <b>„Startbildschirm“</b>.':'1. Oben rechts auf <b>⋮</b> tippen.<br>2. <b>„Zum Startbildschirm hinzufügen“</b> wählen.<br>3. Falls gefragt: <b>„Installieren“</b>.'}</div>
 <div class="box"><h3>Steht dort nur „In Leuchtturm öffnen“?</h3>Dann ist auf diesem Handy schon die Leuchtturm-App installiert, und der Browser verwechselt die beiden. Im Menü ⋮ trotzdem <b>„Zum Startbildschirm hinzufügen“</b> wählen – die Lernbasis bekommt dann ihr eigenes Symbol. Hilft das nicht: die Adresse in <b>Samsung Internet</b> öffnen und dort hinzufügen.</div>`};
/* ---------- Start ---------- */
try{history.replaceState({n:'home',p:{}},'')}catch(e){}
modeCache();
if(MODE==='eltern'){const l=document.querySelector('link[rel=manifest]');if(l)l.href='eltern-manifest.php';document.title='Lernbasis Eltern';const ic=document.querySelector('link[rel=apple-touch-icon]');if(ic)ic.href='icon-eltern-192.png'}
render();syncInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
